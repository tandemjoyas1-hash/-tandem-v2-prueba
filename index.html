        <button type="button" onclick="toggleNuevoProveedor('vd')" style="flex:0 0 auto; width:auto; margin-top:0; padding:12px 14px; border:1.5px solid #e6ddc9; border-radius:8px; background:#fdfcf9; font-size:16px; cursor:pointer;">✏️</button>
      </div>
      <div id="vd-nuevo-proveedor-box" style="display:none; margin-top:8px; padding:10px; background:#fafafa; border-radius:8px;">
        <label style="margin-top:0;">Nombre del proveedor nuevo</label>
        <input type="text" id="vd-nuevo-proveedor-nombre" placeholder="Ej: Metalúrgica Ruiz">
        <label>Teléfono (opcional)</label>
        <input type="text" id="vd-nuevo-proveedor-telefono" placeholder="Ej: 3511234567">
        <button type="button" class="btn btn-verde" style="margin-top:8px;" onclick="guardarNuevoProveedor('vd')">Agregar proveedor</button>
        <div id="vd-nuevo-proveedor-msg"></div>
      </div>

      <label>Monto (total de toda la venta)</label>
      <input type="number" id="vd-monto" placeholder="0">

      <label>Medio de pago</label>
      <select id="vd-medio-pago">
        <option>EFECTIVO</option>
        <option>TARJETA FISER</option>
        <option>TRANSFERENCIA SANTANDER</option>
        <option>MERCADO PAGO FISER</option>
        <option>MERCADO PAGO LAUREANO</option>
        <option>UALA CARLA</option>
        <option>CUENTA CORRIENTE</option>
      </select>

      <button class="btn btn-verde" onclick="guardarVentaDirecta()">Registrar venta</button>
      <div id="vd-msg"></div>
    </div>
  `);
  document.getElementById('vd-descripcion').focus();
  cargarTiposProducto('vd');
  cargarProveedores('vd');
}
window.pantallaVentaDirecta = pantallaVentaDirecta;

let _timeoutBusquedaClienteVD = null;
let _clienteIdVentaDirecta = null;

function buscarClienteEnVentaDirecta() {
  clearTimeout(_timeoutBusquedaClienteVD);
  _clienteIdVentaDirecta = null;
  const nombre = document.getElementById('vd-cliente').value.trim();
  const box = document.getElementById('vd-cliente-sugerencias');
  if (nombre.length < 2) { box.innerHTML = ''; return; }

  _timeoutBusquedaClienteVD = setTimeout(async () => {
    const { data } = await sb.from('clientes').select('id, nombre, tipo_cliente').ilike('nombre', '%' + nombre + '%').order('nombre').limit(6);
    if (!data || data.length === 0) { box.innerHTML = ''; return; }
    box.innerHTML = data.map(c => `
      <div class="lista-sobre" style="cursor:pointer; padding:8px 10px;" onclick='elegirClienteVentaDirecta(${JSON.stringify(c.id)}, ${JSON.stringify(c.nombre)})'>
        <div class="nro" style="font-size:14px;">${c.nombre}</div>
        <div class="cli" style="font-size:12px;">${etiquetaTipoCliente(c.tipo_cliente) || c.tipo_cliente || ''}</div>
      </div>
    `).join('');
  }, 250);
}
window.buscarClienteEnVentaDirecta = buscarClienteEnVentaDirecta;

function elegirClienteVentaDirecta(id, nombre) {
  _clienteIdVentaDirecta = id;
  document.getElementById('vd-cliente').value = nombre;
  document.getElementById('vd-cliente-sugerencias').innerHTML = '';
}
window.elegirClienteVentaDirecta = elegirClienteVentaDirecta;

// --- Tipo de producto: buscador con autocompletado (escribís y se achica la lista),
// usado en Entrada, Venta Directa y Editar Movimiento. El código elegido se guarda
// en el input oculto "<prefix>-tipo-producto" (mismo id de siempre, no cambia nada
// de cómo se lee/guarda en el resto del código).
let _cacheTiposProducto = null;

async function cargarTiposProducto(prefix) {
  const hidden = document.getElementById(prefix + '-tipo-producto');
  if (!hidden) return;
  if (!_cacheTiposProducto) {
    const { data } = await sb.from('codigos_producto').select('codigo, descripcion').gte('codigo', 1000).order('descripcion');
    _cacheTiposProducto = data || [];
  }
  pintarTipoProductoTexto(prefix);
}
window.cargarTiposProducto = cargarTiposProducto;

// Muestra en el input visible el texto correspondiente al código que ya esté
// guardado en el input oculto (usado al editar un movimiento existente, o al
// restaurar un borrador).
function pintarTipoProductoTexto(prefix) {
  const hidden = document.getElementById(prefix + '-tipo-producto');
  const visible = document.getElementById(prefix + '-tipo-producto-busqueda');
  if (!hidden || !visible || !_cacheTiposProducto) return;
  const codigo = hidden.value;
  if (!codigo) { visible.value = ''; return; }
  const encontrado = _cacheTiposProducto.find(c => String(c.codigo) === String(codigo));
  visible.value = encontrado ? `${encontrado.codigo} — ${encontrado.descripcion}` : '';
}
window.pintarTipoProductoTexto = pintarTipoProductoTexto;

function filtrarTipoProducto(prefix) {
  const box = document.getElementById(prefix + '-tipo-producto-sugerencias');
  if (!box || !_cacheTiposProducto) return;
  const texto = (document.getElementById(prefix + '-tipo-producto-busqueda').value || '').trim().toLowerCase();

  // Si borran todo, se limpia también el código elegido.
  if (!texto) {
    document.getElementById(prefix + '-tipo-producto').value = '';
    box.innerHTML = '';
    return;
  }

  const coincidencias = _cacheTiposProducto
    .filter(c => c.descripcion.toLowerCase().includes(texto) || String(c.codigo).includes(texto))
    .slice(0, 8);

  if (coincidencias.length === 0) {
    box.innerHTML = `<div style="padding:8px 10px; color:#8a8378; font-size:13px;">Sin resultados. Tocá ✏️ para agregar "${texto}" como categoría nueva.</div>`;
    return;
  }

  box.innerHTML = coincidencias.map(c => `
    <div class="lista-sobre" style="cursor:pointer; padding:8px 10px;" onclick='elegirTipoProducto(${JSON.stringify(prefix)}, ${JSON.stringify(String(c.codigo))}, ${JSON.stringify(c.descripcion)})'>
      <div class="nro" style="font-size:14px;">${c.descripcion}</div>
      <div class="cli" style="font-size:12px;">Código ${c.codigo}</div>
    </div>
  `).join('');
}
window.filtrarTipoProducto = filtrarTipoProducto;

function elegirTipoProducto(prefix, codigo, descripcion) {
  document.getElementById(prefix + '-tipo-producto').value = codigo;
  document.getElementById(prefix + '-tipo-producto-busqueda').value = `${codigo} — ${descripcion}`;
  document.getElementById(prefix + '-tipo-producto-sugerencias').innerHTML = '';
}
window.elegirTipoProducto = elegirTipoProducto;

function toggleNuevaCategoria(prefix) {
  const box = document.getElementById(prefix + '-nueva-categoria-box');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  if (box.style.display === 'block') document.getElementById(prefix + '-nueva-categoria-nombre').focus();
}
window.toggleNuevaCategoria = toggleNuevaCategoria;

// Agrega una categoría nueva a codigos_producto (usado desde Entrada y Venta Directa, para que
// las categorías queden disponibles en cualquier lugar donde se registre una venta).
// El código se asigna solo: sigue la numeración de las categorías "chicas" (9000+),
// igual que como estaban cargadas COMPOSTURA, PILAS, ACERO, etc.
async function guardarNuevaCategoria(prefix) {
  const nombre = document.getElementById(prefix + '-nueva-categoria-nombre').value.trim();
  const msgBox = document.getElementById(prefix + '-nueva-categoria-msg');
  if (!nombre) { msgBox.innerHTML = `<div class="msg msg-error">Escribí un nombre.</div>`; return; }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { data: existente } = await sb.from('codigos_producto').select('codigo').ilike('descripcion', nombre).limit(1).maybeSingle();
  if (existente) {
    msgBox.innerHTML = `<div class="msg msg-error">Ya existe una categoría con ese nombre.</div>`;
    return;
  }

  const { data: maxRow } = await sb.from('codigos_producto').select('codigo').gte('codigo', 9000).lt('codigo', 10000).order('codigo', { ascending: false }).limit(1).maybeSingle();
  const nuevoCodigo = maxRow ? Number(maxRow.codigo) + 1 : 9000;

  const { error } = await sb.from('codigos_producto').insert({ codigo: nuevoCodigo, descripcion: nombre.toUpperCase() });
  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Categoría "${nombre}" agregada.</div>`;
  document.getElementById(prefix + '-nueva-categoria-nombre').value = '';
  _cacheTiposProducto = null; // forzar recarga para que incluya la categoría recién creada
  await cargarTiposProducto(prefix);
  document.getElementById(prefix + '-tipo-producto').value = String(nuevoCodigo);
  pintarTipoProductoTexto(prefix);
  document.getElementById(prefix + '-tipo-producto-sugerencias').innerHTML = '';
  document.getElementById(prefix + '-nueva-categoria-box').style.display = 'none';
}
window.guardarNuevaCategoria = guardarNuevaCategoria;

async function guardarVentaDirecta() {
  const msgBox = document.getElementById('vd-msg');
  const descripcion = document.getElementById('vd-descripcion').value.trim();
  const monto = parseFloat(document.getElementById('vd-monto').value) || 0;
  const cantidad = parseInt(document.getElementById('vd-cantidad').value) || 1;
  const medioPago = document.getElementById('vd-medio-pago').value;
  const nombreCliente = document.getElementById('vd-cliente').value.trim();
  const tipoCliente = document.getElementById('vd-tipo-cliente').value;
  const canal = document.getElementById('vd-canal').value;

  if (!descripcion) { msgBox.innerHTML = `<div class="msg msg-error">Falta la descripción.</div>`; return; }
  if (monto <= 0) { msgBox.innerHTML = `<div class="msg msg-error">Poné un monto mayor a cero.</div>`; return; }
  if (medioPago === 'CUENTA CORRIENTE' && !nombreCliente) { msgBox.innerHTML = `<div class="msg msg-error">Para Cuenta Corriente hace falta elegir o escribir el cliente.</div>`; return; }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  // Si escribió un nombre pero no lo eligió de la lista, se crea como cliente nuevo (igual que en Entrada)
  let clienteId = _clienteIdVentaDirecta;
  if (!clienteId && nombreCliente) {
    try {
      clienteId = await buscarOCrearCliente(nombreCliente, tipoCliente, null);
    } catch (errCliente) {
      msgBox.innerHTML = `<div class="msg msg-error">${errCliente.message}</div>`;
      return;
    }
  }

  const tipoProducto = document.getElementById('vd-tipo-producto').value;
  const proveedorId = document.getElementById('vd-proveedor').value || null;

  // NUEVO (05/09/2026): aviso de posible venta duplicada. Si otra vendedora (o la misma) ya
  // cargó hoy una venta del mismo monto para el mismo cliente (o, si no hay cliente, la misma
  // descripción), se avisa antes de guardar — cubre el caso de que Romi la cargue a la mañana
  // y Sofi la vuelva a cargar al mediodía sin saber que ya estaba.
  let queryDuplicado = sb.from('movimientos_caja')
    .select('vendedora, created_at, descripcion')
    .eq('ingresa_egresa', 'INGRESA')
    .eq('monto', monto)
    .eq('fecha', fechaHoyISO());
  queryDuplicado = clienteId ? queryDuplicado.eq('cliente_id', clienteId) : queryDuplicado.eq('descripcion', descripcion);
  const { data: posiblesDuplicados } = await queryDuplicado;

  if (posiblesDuplicados && posiblesDuplicados.length > 0) {
    const anterior = posiblesDuplicados[0];
    const hora = new Date(anterior.created_at).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    const seguir = confirm(`⚠️ POSIBLE VENTA DUPLICADA\n\n${anterior.vendedora || 'Alguien'} ya cargó hoy a las ${hora} una venta de $${monto.toLocaleString('es-AR')} para ${nombreCliente || 'este mismo cliente/descripción'} ("${anterior.descripcion}").\n\n¿Es una venta distinta y hay que cargarla igual?\n\nAceptar = SÍ, cargar de nuevo (es otra venta)\nCancelar = NO, no cargar (era la misma)`);
    if (!seguir) { msgBox.innerHTML = `<div class="msg msg-error">No se guardó — se detectó como posible duplicado.</div>`; return; }
  }

  const { error } = await sb.from('movimientos_caja').insert({
    vendedora: usuarioActual.nombre,
    descripcion: descripcion,
    ingresa_egresa: 'INGRESA',
    tipo_cliente: tipoCliente,
    medio_pago: medioPago,
    monto: monto,
    cantidad: cantidad,
    canal: canal,
    cliente_id: clienteId,
    codigo: tipoProducto ? parseInt(tipoProducto) : null,
    proveedor_id: proveedorId
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Venta de $${monto.toLocaleString('es-AR')} (${cantidad} ${cantidad === 1 ? 'unidad' : 'unidades'}) registrada.</div>`;
  document.getElementById('vd-cliente').value = '';
  document.getElementById('vd-tipo-cliente').value = 'CONSUMIDOR_FINAL';
  document.getElementById('vd-canal').value = 'LOCAL';
  document.getElementById('vd-medio-pago').value = 'EFECTIVO';
  document.getElementById('vd-descripcion').value = '';
  document.getElementById('vd-monto').value = '';
  document.getElementById('vd-cantidad').value = '1';
  document.getElementById('vd-tipo-producto').value = '';
  document.getElementById('vd-tipo-producto-busqueda').value = '';
  document.getElementById('vd-tipo-producto-sugerencias').innerHTML = '';
  document.getElementById('vd-proveedor').value = '';
  
  _clienteIdVentaDirecta = null;
}
window.guardarVentaDirecta = guardarVentaDirecta;

// Arranque
// ============================================================
(function iniciarApp() {
  // Link del QR del comprobante: …/?s=NUMERO
  try {
    const s = new URLSearchParams(window.location.search).get('s') || '';
    window._sobreDeQR = /^\d{1,9}$/.test(s.trim()) ? normalizarSobre(s) : '';
  } catch (e) { window._sobreDeQR = ''; }
  try {
    const guardada = localStorage.getItem('tandem_sesion');
    // Sin sesión del equipo en este celu = es un cliente mirando su comprobante.
    if (!guardada && window._sobreDeQR) { pantallaClienteSobre(window._sobreDeQR); return; }
    if (guardada) {
      usuarioActual = JSON.parse(guardada);
      const fechaSesion = localStorage.getItem('tandem_sesion_fecha');
      if (fechaSesion === fechaHoyISO()) {
        irAPantallaInicial();
      } else {
        pantallaConfirmarUsuario(usuarioActual);
      }
      return;
    }
  } catch (e) {}
  pantallaLogin();
})();
</script>
