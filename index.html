<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tándem — Sistema nuevo (prueba)</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4efe4;
    margin: 0;
    padding: 16px;
    padding-bottom: 92px; /* deja lugar para el menú fijo de abajo */
    color: #2c2c2a;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto 16px auto;
    box-shadow: 0 2px 10px rgba(60,40,10,0.08);
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; letter-spacing: -0.2px; }
  .sub { color: #8a8378; font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px 0; color: #4a453d; }
  input, select, textarea {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    border: 1.5px solid #e6ddc9;
    border-radius: 10px;
    background: #fdfcf9;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #c9a24a; }
  .btn {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    margin-top: 18px;
    cursor: pointer;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); opacity: 0.9; }
  .btn-verde { background: #2f6d1f; color: white; box-shadow: 0 3px 10px rgba(47,109,31,0.28); }
  .btn-outline { background: white; border: 1.5px solid #2f6d1f; color: #2f6d1f; }
  .pin-grid { display: flex; gap: 8px; margin-top: 10px; }
  .pin-grid input { text-align: center; font-size: 22px; letter-spacing: 4px; }
  .msg { margin-top: 12px; padding: 11px 14px; border-radius: 10px; font-size: 14px; }
  .msg-ok { background: #e5f1dc; color: #234d0e; font-weight: 600; }
  .msg-error { background: #fceceb; color: #7a2118; font-weight: 600; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #c9c2b2; border-top-color: #2f6d1f; border-radius: 50%; animation: girar 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .spinner-grande { width: 34px; height: 34px; border-width: 4px; margin: 0 0 14px 0; }
  .overlay-guardando {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(40,36,28,0.55);
    display: flex; align-items: center; justify-content: center;
  }
  .overlay-guardando-caja {
    background: #fffdf8; border-radius: 16px; padding: 32px 40px;
    display: flex; flex-direction: column; align-items: center;
    font-size: 18px; font-weight: 700; color: #3a3226;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    text-align: center;
  }
  .usuario-actual {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, #fff6e4, #fdefd2); border: 1px solid #eed9a3; border-radius: 12px;
    padding: 11px 16px; max-width: 480px; margin: 0 auto 16px auto; font-size: 14px;
  }
  .usuario-actual button { border: none; background: none; color: #9a4a1e; font-weight: 700; cursor: pointer; }
  small { color: #8a8378; }

  /* ===== MENÚ FIJO ABAJO (como Square / Loyverse / Gincore) ===== */
  .nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: white;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.10);
    padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px)) 2px;
    overflow-x: auto;
    z-index: 100;
    gap: 2px;
  }
  .nav button {
    flex: 1 0 76px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    padding: 12px 4px;
    border: none;
    background: none;
    font-size: 10px;
    font-weight: 700;
    color: #6b6459;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    min-height: 62px;
  }
  .nav button:active { background: #f4efe4; }
  .nav-icon { font-size: 24px; line-height: 1; }
  .nav-label { font-size: 10.5px; letter-spacing: 0.2px; }

  .lista-sobre {
    border: 1px solid #ece5d4; border-radius: 12px; padding: 13px; margin-bottom: 10px;
    background: #fffefb;
  }
  .lista-sobre .nro { font-weight: 700; font-size: 15px; }
  .lista-sobre .cli { color: #5c564b; font-size: 14px; }
  .lista-sobre .desc { color: #8a8378; font-size: 13px; margin-bottom: 8px; }
  .lista-sobre select, .lista-sobre input { margin-bottom: 8px; }
  .vacio { text-align: center; color: #a39c8d; padding: 24px 10px; font-size: 14px; }
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat-grid .lista-sobre { margin-bottom: 0; padding: 10px; }

  /* ===== Tabla estilo Excel para Caja del Día en pantallas grandes ===== */
  .tabla-caja { display: none; }
  .tabla-caja table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabla-caja th {
    text-align: left; padding: 10px 12px; background: #f4efe4; color: #4a453d;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px;
    border-bottom: 2px solid #e6ddc9; position: sticky; top: 0;
  }
  .tabla-caja td { padding: 9px 12px; border-bottom: 1px solid #f0ebe0; }
  .tabla-caja tr:nth-child(even) td { background: #fbf9f4; }
  .tabla-caja tr:hover td { background: #fdf5e2; }
  .tabla-caja .col-monto { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tabla-caja .ingresa { color: #2f6d1f; }
  .tabla-caja .egresa { color: #9a3a1e; }
  .lista-movil-caja { display: block; }

  @media (min-width: 720px) {
    .tabla-caja { display: block; max-width: 900px; margin: 0 auto; }
    .lista-movil-caja { display: none; }
    .card { max-width: 900px; }
    .usuario-actual, .nav { max-width: 900px; }
  }
</style>
</head>
<body>

<div id="app"></div>

// ============================================================
// NUEVO: cada vez que se cambia de pantalla, se guarda una "foto"
// de lo que había antes en el historial del navegador. Así, si
// alguien toca el botón "atrás" del celu/navegador, vuelve a la
// pantalla anterior DENTRO de la app, en vez de salir de golpe.
// ============================================================
let _historialHTML = [];
let _restaurandoHistorial = false;

// ============================================================
// Limpia un N° de sobre: saca cualquier símbolo (#, N°, espacios, etc.)
// y los ceros a la izquierda, para que quede solo el número puro
// (ej: "#0801" -> "801"). Igual que hacía el sistema viejo, para que
// no queden dos sobres "distintos" por un cero o un símbolo de más.
// ============================================================
function normalizarSobre(v) {
  const soloDigitos = String(v || '').replace(/\D/g, '');
  if (!soloDigitos) return String(v || '').trim();
  return String(parseInt(soloDigitos, 10));
}

// Deja el teléfono solo con dígitos (sin espacios, guiones, +54, etc.) para poder
// usarlo como forma confiable de reconocer al mismo cliente aunque el nombre varíe.
function normalizarTelefono(v) {
  return String(v || '').replace(/\D/g, '');
}

function render(html) {
  if (!_restaurandoHistorial) {
    _historialHTML.push(app.innerHTML);
    history.pushState({ idx: _historialHTML.length }, '');
  }
  app.innerHTML = html;
}

window.addEventListener('popstate', () => {
  if (_historialHTML.length > 0) {
    _restaurandoHistorial = true;
    app.innerHTML = _historialHTML.pop();
    _restaurandoHistorial = false;
  }
});

// ============================================================
// AUXILIAR: arma un link de WhatsApp a partir de un teléfono
// (asume números argentinos guardados como 10 dígitos, ej:
// 3511234567) y un mensaje. Devuelve null si no hay teléfono.
// ============================================================
function linkWhatsApp(telefono, mensaje) {
  if (!telefono) return null;
  let limpio = String(telefono).replace(/\D/g, '');
  if (!limpio) return null;
  if (limpio.startsWith('0')) limpio = limpio.slice(1);
  if (!limpio.startsWith('54')) limpio = '549' + limpio;
  return 'https://wa.me/' + limpio + '?text=' + encodeURIComponent(mensaje);
}

function botonWhatsApp(telefono, mensaje) {
  const link = linkWhatsApp(telefono, mensaje);
  if (!link) return `<small>Este cliente no tiene teléfono cargado, no se puede avisar por WhatsApp.</small>`;
  return `<a href="${link}" target="_blank" class="btn btn-outline" style="display:block; text-align:center; text-decoration:none; margin-top:8px;">📱 Avisar por WhatsApp</a>`;
}

    .select('id, nombre');

    return;
  }

  const opciones = data.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('');
  render(`
    <div class="card">
      <h1>Joyería Tándem</h1>

      <label>¿Quién sos?</label>

      <label>Tu PIN (2 números)</label>
      <input type="tel" inputmode="numeric" maxlength="6" id="pin-input" placeholder="••">
      <button class="btn btn-verde" onclick="intentarLogin()">Entrar</button>
      <div id="login-msg"></div>
      <small>Si es tu primera vez, escribí el PIN que quieras usar de ahora en más.</small>

  `);

// NUEVO (22/09/2026): el PIN ya no se compara en el navegador — se manda a una función del
// servidor (login-pin) que lo verifica y, si es correcto, entrega una sesión real de acceso
// (antes, toda la app leía y escribía con la misma llave pública, estuviera alguien logueado
// o no; ahora recién acá se obtiene una credencial de verdad).
async function intentarLogin() {
  const usuarioId = document.getElementById('sel-usuario').value;
  const pin = document.getElementById('pin-input').value.trim();
  const msgBox = document.getElementById('login-msg');

  if (!/^\d{2,6}$/.test(pin)) {
    msgBox.innerHTML = `<div class="msg msg-error">El PIN tiene que ser de 2 a 6 números.</div>`;
    return;
  }

  msgBox.innerHTML = `<p>Verificando...</p>`;
  let resp, cuerpo;
  try {
    resp = await fetch(SUPABASE_FUNCIONES_URL + '/login-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario_id: usuarioId, pin: pin })
    });
    cuerpo = await resp.json();
  } catch (e) {
    msgBox.innerHTML = `<div class="msg msg-error">No se pudo conectar. Probá de nuevo.</div>`;
    return;
  }

  if (!resp.ok) {
    msgBox.innerHTML = `<div class="msg msg-error">${cuerpo.error || 'PIN incorrecto.'}</div>`;
    return;
  }

  const { error: errSesion } = await sb.auth.setSession({
    access_token: cuerpo.access_token,
    refresh_token: cuerpo.refresh_token
  });
  if (errSesion) {
    msgBox.innerHTML = `<div class="msg msg-error">No se pudo iniciar sesión: ${errSesion.message}</div>`;
    return;
  }

  usuarioActual = { id: cuerpo.usuario.id, nombre: cuerpo.usuario.nombre, rol: cuerpo.usuario.rol };
  // Guarda quién es (solo para mostrar el nombre) — la sesión de acceso real la guarda Supabase sola
  try { localStorage.setItem('tandem_sesion', JSON.stringify(usuarioActual)); localStorage.setItem('tandem_sesion_fecha', fechaHoyISO()); } catch (e) {}
  irAPantallaInicial();
}
window.intentarLogin = intentarLogin;

let _timeoutVerFoto = null;
function buscarFotoSobre() {
  clearTimeout(_timeoutVerFoto);
  const numero = document.getElementById('vf-numero').value.trim();
  const box = document.getElementById('vf-resultado');
  if (!numero) { box.innerHTML = ''; return; }

  // Se limpia de una, para no dejar pegada en pantalla la foto de una búsqueda anterior
  // mientras se espera el cuarto de segundo antes de buscar la nueva.
  box.innerHTML = `<div class="msg">Buscando...</div>`;

  _timeoutVerFoto = setTimeout(async () => {
    const { data: s, error } = await sb
      .from('sobres')
      .select('id, numero, descripcion, foto_referencia, para_el_dia')
      .eq('numero', normalizarSobre(numero))
      .maybeSingle();

    if (error) { box.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
    if (!s) { box.innerHTML = `<div class="vacio">No se encontró ese sobre.</div>`; return; }

    const fechaEntregaHtml = s.para_el_dia
      ? `<div style="text-align:center; margin-top:8px; font-size:16px; font-weight:700; color:#7a5c00;">📅 Entregar el ${fechaCortaAR(s.para_el_dia)}</div>`
      : '';

    // NUEVO (05/09/2026): además de foto_referencia (la primera, vieja), se buscan TODAS las
    // fotos guardadas en tandem.fotos_sobre para este sobre (ej: mesa + laterales de un sello).
    const { data: fotosExtra } = await sb
      .from('fotos_sobre')
      .select('url, etiqueta')
      .eq('sobre_id', s.id)
      .order('created_at');

    // Arma la lista final de fotos a mostrar sin repetir la primera (foto_referencia suele ser
    // la misma que la primera fila de fotos_sobre desde que se unificó el guardado).
    const urlsExtra = (fotosExtra || []).map(f => f.url);
    const todasLasFotos = s.foto_referencia && !urlsExtra.includes(s.foto_referencia)
      ? [{ url: s.foto_referencia, etiqueta: null }, ...(fotosExtra || [])]
      : (fotosExtra || []);

    if (todasLasFotos.length === 0) {
      box.innerHTML = `
        <div class="nro" style="font-size:20px; text-align:center;">#${s.numero}</div>
        <div class="vacio" style="text-align:center; margin-top:10px;">Este sobre no tiene foto cargada.</div>
        <div class="desc" style="text-align:center; margin-top:10px; font-size:16px;">${s.descripcion || ''}</div>
        ${fechaEntregaHtml}
      `;
      return;
    }

    box.innerHTML = `
      <div class="nro" style="font-size:20px; text-align:center;">#${s.numero}</div>
      ${todasLasFotos.map(f => `
        ${f.etiqueta ? `<div style="text-align:center; margin-top:10px; font-size:15px; font-weight:700; color:#7a5c00;">🏷️ ${f.etiqueta}</div>` : ''}
        <img src="${f.url}" onclick="window.open('${f.url}','_blank')" style="width:100%; max-height:60vh; object-fit:contain; border-radius:10px; border:1px solid #e6ddc9; margin-top:${f.etiqueta ? '4' : '10'}px; cursor:pointer;">
      `).join('')}
      <div class="desc" style="text-align:center; margin-top:10px; font-size:16px;">${s.descripcion || ''}</div>
      ${fechaEntregaHtml}
    `;
  }, 250);
}
window.buscarFotoSobre = buscarFotoSobre;

const SUPABASE_FUNCIONES_URL = 'https://vbkpczhbudktbkclqncy.supabase.co/functions/v1';

let _productoSeleccionado = null; // { cat, cod } del último producto elegido del catálogo
let _precioGramoActual = null;
let _preciosMaterialesActual = null; // { PLATA: 3000, LATON: 100, ... }

async function cargarPreciosMateriales() {
  if (_preciosMaterialesActual) return _preciosMaterialesActual;
  const { data } = await sb.schema('public').from('materiales').select('id, nombre, precio_gramo').order('nombre');
  const mapa = {};
  (data || []).forEach(m => { mapa[m.id] = { nombre: m.nombre, precio_gramo: Number(m.precio_gramo) || 0 }; });
  _preciosMaterialesActual = mapa;
  _precioGramoActual = mapa.PLATA ? mapa.PLATA.precio_gramo : 0;
  return mapa;
}

function precioGramoDeMaterial(materialId) {
  const mapa = _preciosMaterialesActual || {};
  // "Plata y Oro" se cobra por peso al precio de la plata (el oro se carga aparte,
  // a mano, en el campo de Mano de obra) — así nunca se desactualiza si cambia el precio de la plata.
  if (materialId === 'PLATA_Y_ORO') {
    return mapa.PLATA ? mapa.PLATA.precio_gramo : (_precioGramoActual || 0);
  }
  const m = mapa[materialId || 'PLATA'];
  return m ? m.precio_gramo : (_precioGramoActual || 0);
}

  const form = document.getElementById('cat-precio-gramo-form');

  if (abrir) {

async function guardarPrecioGramo() {
  const msgBox = document.getElementById('cat-precio-gramo-msg');
  const inputs = document.querySelectorAll('#cat-precio-gramo-form input[data-material]');
  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  for (const inp of inputs) {
    const id = inp.getAttribute('data-material');
    const nuevo = parseFloat(inp.value);
    if (!nuevo || nuevo <= 0) continue;
    const { error } = await sb.schema('public').from('materiales').update({ precio_gramo: nuevo }).eq('id', id);
    if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  }

  _preciosMaterialesActual = null;
  await cargarPrecioGramoActual();
  document.getElementById('cat-precio-gramo-form').style.display = 'none';
  msgBox.innerHTML = '<div class="msg msg-ok">✅ Precios guardados.</div>';

  // Si había resultados en pantalla, los volvemos a calcular con el precio nuevo
  const termino = document.getElementById('cat-buscar').value.trim();
  if (termino) buscarEnCatalogo();

async function aplicarAjusteGeneralManoObra() {
  const msgBox = document.getElementById('cat-ajuste-msg');
  const categoria = document.getElementById('cat-ajuste-categoria').value;
  const porcentaje = parseFloat(document.getElementById('cat-ajuste-porcentaje').value);
  const redondear = document.getElementById('cat-ajuste-redondeo').checked;
  if (!categoria) { msgBox.innerHTML = `<div class="msg msg-error">Elegí una categoría.</div>`; return; }
  if (!porcentaje) { msgBox.innerHTML = `<div class="msg msg-error">Poné un porcentaje.</div>`; return; }

  let consulta = sb.schema('public').from('products').select('id, labor');
  if (categoria !== '__TODAS__') consulta = consulta.eq('cat', categoria);
  const { data: productos, error: errLeer } = await consulta;
  if (errLeer) { msgBox.innerHTML = `<div class="msg msg-error">${errLeer.message}</div>`; return; }
  if (!productos.length) { msgBox.innerHTML = `<div class="msg msg-error">No hay productos en esa categoría.</div>`; return; }

  const nombreCat = categoria === '__TODAS__' ? 'TODAS las categorías' : categoria;
  if (!confirm('¿Aumentar ' + porcentaje + '% la mano de obra de ' + productos.length + ' productos de ' + nombreCat + '?' + (redondear ? ' (redondeado de a $500 para arriba)' : '') + '\n\nNo se puede deshacer con un botón.')) return;

  msgBox.innerHTML = `<div class="msg">Aplicando a ${productos.length} productos, un momento...</div>`;
  let actualizados = 0;
  for (const p of productos) {
    const actual = Number(p.labor) || 0;
    if (actual <= 0) { actualizados++; continue; }
    let laborNueva = actual * (1 + porcentaje / 100);
    laborNueva = redondear ? Math.ceil(laborNueva / 500) * 500 : Math.round(laborNueva);
    const { error } = await sb.schema('public').from('products').update({ labor: laborNueva }).eq('id', p.id);
    if (!error) actualizados++;
  }

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Mano de obra actualizada en ${actualizados} de ${productos.length} productos de ${nombreCat}.</div>`;
  document.getElementById('cat-ajuste-porcentaje').value = '';
  document.getElementById('cat-ajuste-categoria').value = '';
}
window.aplicarAjusteGeneralManoObra = aplicarAjusteGeneralManoObra;

    return;
  }

  await cargarPreciosMateriales();

  const tienePrecioFijo = p.precio_fijo !== null && p.precio_fijo !== undefined && Number(p.precio_fijo) > 0;

  const boton = (etiqueta, precio) => `

          <div>Precio único (público en general)</div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr; gap:6px;">
          ${boton('Precio', Number(p.precio_fijo))}
        </div>
      ` : tieneMayorMenor ? `
        <div class="lista-sobre" style="background:#f7f7f7;">
          <div>Compostura — precio por mayor y por menor</div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          ${Number(p.precio_mayor) > 0 ? boton('Mayor', Number(p.precio_mayor)) : ''}
          ${Number(p.precio_menor) > 0 ? boton('Menor', Number(p.precio_menor)) : ''}

      ` : `
        <div class="lista-sobre" style="background:#f7f7f7;">

          <div>Peso: <strong>${p.peso || '-'} g</strong></div>

        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          ${boton('Zipiur', zipiur)}
          ${boton('Mayor', mayor)}
          ${boton('Redes', redes)}

  const msgBox = document.getElementById('ep-msg');

  const cambios = {
    descripcion: document.getElementById('ep-descripcion').value.trim(),

    material: document.getElementById('ep-material').value,
    peso: parseFloat(document.getElementById('ep-peso').value) || 0,

    precio_mayor: document.getElementById('ep-precio-mayor').value ? parseFloat(document.getElementById('ep-precio-mayor').value) : null,
    precio_menor: document.getElementById('ep-precio-menor').value ? parseFloat(document.getElementById('ep-precio-menor').value) : null
  };

  const archivoFoto = document.getElementById('ep-foto').files[0];
  if (archivoFoto) {
    cambios.foto = await archivoAFotoComprimida(archivoFoto);

  try {

async function sugerirCodigoNuevo() {
  const cat = document.getElementById('ap-cat').value;
  const codInput = document.getElementById('ap-cod');
  if (cat === '__nueva__') { codInput.value = ''; return; }
  codInput.value = 'Calculando...';

  const { data } = await sb.schema('public')
    .from('products')
    .select('cod')
    .eq('cat', cat)
    .not('cod', 'is', null);

  // Antes se tomaba el código del producto con mayor orden_num, pero si el orden
  // quedó desordenado eso podía sugerir un código que ya estaba en uso. Ahora se
  // calcula el número más alto real entre TODOS los códigos de la categoría.
  let mejor = null;
  (data || []).forEach(row => {
    const match = (row.cod || '').match(/^(.*?)(\d+)(\D*)$/);
    if (!match) return;
    const num = parseInt(match[2], 10);
    if (!mejor || num > mejor.num) {
      mejor = { prefijo: match[1], digitos: match[2], sufijo: match[3], num };
    }
  });

  // NUEVO (21/09/2026): el chequeo de "ya existe" mira TODAS las categorías, así que el número
  // más alto también se busca entre todos los códigos con el mismo prefijo, aunque estén en otra categoría.
  if (mejor) {
    const { data: mismos } = await sb.schema('public').from('products').select('cod').ilike('cod', mejor.prefijo + '%');
    (mismos || []).forEach(row => {
      const m = (row.cod || '').match(/^(.*?)(\d+)(\D*)$/);
      if (!m || m[1] !== mejor.prefijo) return;
      const n = parseInt(m[2], 10);
      if (n > mejor.num) mejor = { prefijo: m[1], digitos: m[2], sufijo: m[3], num: n };
    });
  }

  if (mejor) {
    const siguienteNum = (mejor.num + 1).toString().padStart(mejor.digitos.length, '0');
    codInput.value = mejor.prefijo + siguienteNum + mejor.sufijo;
    return;
  }
  codInput.value = '';
}
window.sugerirCodigoNuevo = sugerirCodigoNuevo;

async function guardarProductoNuevo() {
  const msgBox = document.getElementById('ap-msg');
  const btn = document.getElementById('ap-btn-guardar');
  if (btn.disabled) return; // ya se está guardando, evita el doble toque
  const cod = document.getElementById('ap-cod').value.trim();
  const descripcion = document.getElementById('ap-descripcion').value.trim();
  const peso = parseFloat(document.getElementById('ap-peso').value) || 0;

  let cat = document.getElementById('ap-cat').value;
  if (cat === '__nueva__') {
    cat = document.getElementById('ap-nueva-cat-nombre').value.trim();
    if (!cat) { msgBox.innerHTML = `<div class="msg msg-error">Escribí el nombre de la nueva categoría.</div>`; return; }
  }

  if (!cod) { msgBox.innerHTML = `<div class="msg msg-error">Falta el código.</div>`; return; }
  if (!descripcion) { msgBox.innerHTML = `<div class="msg msg-error">Falta la descripción.</div>`; return; }

  btn.disabled = true;
  mostrarCargandoCentro('Guardando el producto,<br>esperá unos segundos...');

  const { data: yaExiste } = await sb.schema('public').from('products').select('cod').eq('cod', cod).maybeSingle();
  if (yaExiste) {
    ocultarCargandoCentro();
    msgBox.innerHTML = `<div class="msg msg-error">Ya existe un producto con el código "${cod}". Usá otro código.</div>`;
    btn.disabled = false;
    return;
  }

  const nuevo = {
    id: 'P' + Date.now(),
    cod: cod,
    cat: cat,
    descripcion: descripcion,
    material: document.getElementById('ap-material').value || 'PLATA',
    medidas: document.getElementById('ap-medidas').value.trim() || null,
    peso: peso,
    labor: parseFloat(document.getElementById('ap-labor').value) || 0,
    precio_fijo: document.getElementById('ap-precio-fijo').value ? parseFloat(document.getElementById('ap-precio-fijo').value) : null,
    precio_mayor: document.getElementById('ap-precio-mayor').value ? parseFloat(document.getElementById('ap-precio-mayor').value) : null,
    precio_menor: document.getElementById('ap-precio-menor').value ? parseFloat(document.getElementById('ap-precio-menor').value) : null
  };

  const archivoFoto = document.getElementById('ap-foto').files[0];
  if (archivoFoto) {
    nuevo.foto = await archivoAFotoComprimida(archivoFoto);
  }

  const { error } = await sb.schema('public').from('products').insert(nuevo);
  ocultarCargandoCentro();
  if (error) {
    const mensaje = error.code === '23505' ? 'Ya existe un producto con ese código.' : error.message;
    msgBox.innerHTML = `<div class="msg msg-error">${mensaje}</div>`;
    btn.disabled = false;
    return;
  }

  msgBox.innerHTML = `
    <div class="msg msg-ok">✅ Producto "${descripcion}" agregado.</div>
    <button class="btn btn-outline" style="margin-top:8px;" onclick='verProductoEnCatalogo(${JSON.stringify(cod)})'>🔍 Ver el producto en el catálogo</button>
  `;
}

async function compartirFotosSeleccionadas() {
  const seleccionados = [...document.querySelectorAll('.cat-chk-compartir:checked')];
  if (seleccionados.length === 0) return;

  try {
    const archivos = await Promise.all(seleccionados.map(async (chk, i) => {
      const dataUri = _fotosProductosActuales[chk.dataset.cod];
      const resp = await fetch(dataUri);
      const blob = await resp.blob();
      const ext = blob.type.split('/')[1] || 'png';
      const nombreLimpio = (chk.dataset.desc || 'producto').replace(/[^a-zA-Z0-9 ]/g, '').trim().slice(0, 30).replace(/\s+/g, '-');
      return new File([blob], nombreLimpio + '.' + ext, { type: blob.type });
    }));

    // En celu: intenta abrir directo el menú de compartir (WhatsApp, etc.)
    if (navigator.canShare && navigator.canShare({ files: archivos })) {
      const descripciones = seleccionados.map(chk => chk.dataset.desc).join(', ');
      await navigator.share({ files: archivos, text: 'Joyería Tándem: ' + descripciones });
      return;
    }

    // En compu (o si el celu no soporta compartir archivos): descarga todas las fotos elegidas
    // de una sola vez, para adjuntarlas juntas en WhatsApp Web (📎 → Fotos y videos → elegís varias).
    archivos.forEach((archivo, i) => {
      setTimeout(() => {
        const url = URL.createObjectURL(archivo);
        const a = document.createElement('a');
        a.href = url;
        a.download = archivo.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, i * 200); // un pequeño espacio entre cada descarga para que el navegador no las bloquee
    });

    alert('Se descargaron ' + archivos.length + ' foto(s). Ahora abrí WhatsApp Web → 📎 (adjuntar) → Fotos y videos, y elegí esos archivos de tu carpeta de Descargas — se pueden mandar todas juntas en un mismo mensaje.');
  } catch (err) {
    if (err.name !== 'AbortError') alert('No se pudo descargar: ' + err.message);
  }
}
window.compartirFotosSeleccionadas = compartirFotosSeleccionadas;

let _catalogoBusquedaId = 0;
let _catalogoTimeout = null;

function buscarEnCatalogo() {
  clearTimeout(_catalogoTimeout);
  const termino = document.getElementById('cat-buscar').value.trim();
  // Al escribir se busca en TODO el catálogo (se suelta la categoría que estuviera elegida).
  if (termino && _categoriaActivaCatalogo) {

    document.querySelectorAll('[id^="cat-btn-"]').forEach(btn => { btn.classList.remove('btn-verde'); btn.classList.add('btn-outline'); });
  }
  const categoria = _categoriaActivaCatalogo;
  const resBox = document.getElementById('cat-resultado');
  // Mientras se escribe en el buscador se ocultan las categorías: los resultados quedan justo abajo.
  const bloqueCat = document.getElementById('cat-bloque-categorias');
  if (bloqueCat) bloqueCat.style.display = termino ? 'none' : '';
  if (!termino && !categoria) { resBox.innerHTML = ''; return; }
  resBox.innerHTML = `<div class="msg">Buscando...</div>`;

  // Espera un poquito después de la última letra tipeada, y además se queda con el ID de esta
  // búsqueda puntual: si mientras esperaba la respuesta llegó una búsqueda MÁS NUEVA (porque
  // seguiste escribiendo), esta respuesta vieja se descarta en vez de pisar el resultado bueno.
  const miId = ++_catalogoBusquedaId;
  _catalogoTimeout = setTimeout(() => ejecutarBusquedaCatalogo(termino, categoria, miId), 300);
}
window.buscarEnCatalogo = buscarEnCatalogo;

// Convierte una palabra a un patrón de búsqueda que ignora tildes: se sacan las tildes y cada vocal
// pasa a ser comodín de 1 letra ("gendarmería" -> "g_nd_rm_r__"), así encuentra con o sin tilde.
function patronBusquedaCatalogo(palabra) {
  const limpia = (palabra || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[,()%*\\_"]/g, '');
  // Si trae números es un código (ej. AI.01): se busca tal cual, sin comodines.
  if (/\d/.test(limpia)) return limpia;
  // Verbos: se saca la terminación (soldar -> sold) para que encuentre soldadura, soldar, soldado, etc.
  const raiz = (limpia.length >= 5) ? limpia.replace(/(ar|er|ir)$/i, '') : limpia;
  return raiz.replace(/[aeiouAEIOU]/g, '_');
}

async function ejecutarBusquedaCatalogo(termino, categoria, miId) {
  const resBox = document.getElementById('cat-resultado');

  try {
    await cargarPreciosMateriales();

    let consulta = sb.schema('public')
      .from('products')
      .select('cod, cat, descripcion, medidas, peso, labor, material, foto, precio_fijo, precio_mayor, precio_menor')
      .limit(80);

    if (categoria) consulta = consulta.eq('cat', categoria);
    // NUEVO (21/09/2026): cada palabra se busca por separado (en cualquier orden) y sin importar
    // las tildes, para que "gendarme", "gendarmería" o "armero gendarmeria" encuentren el producto.
    if (termino) {
      termino.split(/\s+/).map(patronBusquedaCatalogo).filter(Boolean).forEach(patron => {
        consulta = consulta.or('descripcion.ilike.%' + patron + '%,cod.ilike.%' + patron + '%');
      });
    }

    // Orden: alfabético por descripción — así el orden es siempre el mismo y previsible,
    // en vez de saltar según qué producto tenga o no una foto cargada.
    consulta = consulta.order('descripcion', { ascending: true });

    const { data: productos, error } = await consulta;

    if (miId !== _catalogoBusquedaId) return; // llegó una búsqueda más nueva mientras esperaba, se descarta esta

    if (error) throw error;

    if (!productos || productos.length === 0) {
      const terminoSeguro = termino.replace(/[<>"']/g, '');
      const enCategoria = categoria ? ` en la categoría "${categoria}"` : '';
      // Si hay una categoría activa, se ofrece buscar en todas (un toque) por si el filtro es lo que no deja ver el producto.
      const botonTodas = (categoria && termino)
        ? `<button type="button" class="btn btn-outline" style="margin-top:10px;" onclick='buscarPorCategoriaCatalogo(${JSON.stringify(categoria)})'>🔎 Buscar "${terminoSeguro}" en todas las categorías</button>`
        : '';
      resBox.innerHTML = `<div class="vacio">Sin resultados para ${terminoSeguro ? '"' + terminoSeguro + '"' : ''}${enCategoria}</div>${botonTodas}`;
      return;
    }

    resBox.innerHTML = `
      <div id="cat-compartir-barra" style="display:none; position:sticky; top:0; z-index:5; background:#2f6d1f; color:white; padding:10px 14px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <span id="cat-compartir-cantidad" style="font-weight:700; font-size:13px;"></span>
        <button type="button" onclick="compartirFotosSeleccionadas()" style="background:white; color:#2f6d1f; border:none; border-radius:8px; padding:8px 14px; font-weight:700; font-size:13px;">📤 Enviar / descargar fotos</button>
      </div>
      <div class="cat-grid">` + productos.map(p => {
      const tienePrecioFijo = p.precio_fijo !== null && p.precio_fijo !== undefined && Number(p.precio_fijo) > 0;
      const tieneMayorMenor = !tienePrecioFijo && ((p.precio_mayor !== null && p.precio_mayor !== undefined && Number(p.precio_mayor) > 0) || (p.precio_menor !== null && p.precio_menor !== undefined && Number(p.precio_menor) > 0));
      const metal = (Number(p.peso) || 0) * precioGramoDeMaterial(p.material);
      const zipiur = metal + (Number(p.labor) || 0);
      const mayor = zipiur * 1.2;
      const redes = mayor * 1.4;
      const menor = mayor * 1.67;

      const boton = (etiqueta, precio) => `
        <button type="button" class="btn btn-outline" style="margin-top:5px; padding:7px 4px; font-size:12px;"
          onclick='elegirProductoCatalogo(${JSON.stringify(p.cod)}, ${JSON.stringify(p.cat)}, ${JSON.stringify(p.descripcion)}, ${Math.round(precio)}, ${JSON.stringify(etiqueta)})'>
          ${etiqueta}: $${Math.round(precio).toLocaleString('es-AR')}
        </button>
      `;

      const foto = p.foto ? `<img src="${p.foto}" style="width:100%; max-height:130px; object-fit:contain; border-radius:8px; background:#fff; margin-bottom:8px; cursor:pointer;" onclick='pantallaDetalleProducto(${JSON.stringify(p.cod)})'>` : '';

      return `
        <div class="lista-sobre">
          ${p.foto ? `
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; font-size:12px; margin-bottom:4px;">
              <input type="checkbox" class="cat-chk-compartir" data-cod="${p.cod}" data-desc="${(p.descripcion || '').replace(/"/g, '&quot;')}" onchange="actualizarBarraCompartir()" style="width:auto;">
              Elegir para enviar
            </label>
          ` : ''}
          ${foto}
          <div class="nro" style="font-size:13px; cursor:pointer;" onclick='pantallaDetalleProducto(${JSON.stringify(p.cod)})'>${p.descripcion} ${p.medidas ? '(' + p.medidas + ')' : ''}</div>
          <div class="cli" style="font-size:11.5px;">${p.cat} · cód. ${p.cod}${(tienePrecioFijo || tieneMayorMenor) ? '' : '<br>M.Obra: $' + (Number(p.labor) || 0).toLocaleString('es-AR')}</div>
          ${tienePrecioFijo ? `
            <div style="display:grid; grid-template-columns: 1fr; gap:4px;">
              ${boton('Precio', Number(p.precio_fijo))}
            </div>
          ` : tieneMayorMenor ? `
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:4px;">
              ${Number(p.precio_mayor) > 0 ? boton('Mayor', Number(p.precio_mayor)) : ''}
              ${Number(p.precio_menor) > 0 ? boton('Menor', Number(p.precio_menor)) : ''}
            </div>
          ` : `
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:4px;">
            ${boton('Zipiur', zipiur)}
            ${boton('Mayor', mayor)}
            ${boton('Redes', redes)}
            ${boton('Menor', menor)}
          </div>
          `}
          <button type="button" class="btn btn-outline" style="margin-top:6px; padding:6px; font-size:11.5px;" onclick='pantallaEditarProducto(${JSON.stringify(p.cod)})'>✏️ Editar</button>
        </div>
      `;
    }).join('') + `</div>`;

    _fotosProductosActuales = {};
    productos.forEach(p => { if (p.foto) _fotosProductosActuales[p.cod] = p.foto; });
  } catch (err) {
    resBox.innerHTML = `<div class="msg msg-error">No se pudo buscar: ${err.message || err}</div>`;
  }
}
window.ejecutarBusquedaCatalogo = ejecutarBusquedaCatalogo;

function elegirProductoCatalogo(cod, cat, descripcion, precio, listaPrecio) {
  if (!_borradorEntrada) return; // modo consulta: solo mirar precios, no hay nada que "elegir"
  _productoSeleccionado = { cod, cat };

}

// Permite pegar una imagen copiada (por ejemplo, de WhatsApp Web) directo con Ctrl+V, sin tener
// que guardarla como archivo primero. Funciona para cualquiera de las pantallas de producto que
// esté abierta en ese momento (Agregar producto o Editar producto).
document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.indexOf('image') !== 0) continue;
    const blob = item.getAsFile();
    if (!blob) continue;

    const inputAp = document.getElementById('ap-foto');
    const inputEp = document.getElementById('ep-foto');
    const inputDestino = (inputAp && inputAp.offsetParent !== null) ? { input: inputAp, msg: 'ap-foto-ok' }
      : (inputEp && inputEp.offsetParent !== null) ? { input: inputEp, msg: 'ep-foto-ok' }
      : null;
    if (!inputDestino) continue;

    const dt = new DataTransfer();
    dt.items.add(new File([blob], 'foto-pegada.png', { type: blob.type || 'image/png' }));
    inputDestino.input.files = dt.files;
    mostrarFotoElegida(inputDestino.input, inputDestino.msg);
    e.preventDefault();
    break;
  }
});

function archivoABase64(archivo) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = () => resolve(lector.result.split(',')[1]);
    lector.onerror = reject;
    lector.readAsDataURL(archivo);
  });
}

// NUEVO (21/09/2026): fotos de PRODUCTO (catálogo) se achican solas antes de guardar, para que
// nunca vuelvan a pesar cientos de KB o varios MB adentro de la base de datos (eso hacía que
// buscar en el catálogo se cortara con "timeout" cuando había muchas fotos pesadas juntas).
// Se reduce a un máximo de 900px de lado más largo y se comprime a JPG calidad ~0.78 — en la
// gran mayoría de los casos queda entre 40 y 150 KB, sin que Sofi/Romi/Dami/Cele tengan que
// acordarse de hacer nada distinto al subir la foto.
function archivoAFotoComprimida(archivo) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX_LADO = 900;
        let { width, height } = img;
        if (width > MAX_LADO || height > MAX_LADO) {
          if (width >= height) { height = Math.round(height * MAX_LADO / width); width = MAX_LADO; }
          else { width = Math.round(width * MAX_LADO / height); height = MAX_LADO; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height); // fondo blanco (por si el PNG tenía transparencia)
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = lector.result;
    };
    lector.onerror = reject;
    lector.readAsDataURL(archivo);
  });
}

// ============================================================
// Foto de referencia que manda el cliente por WhatsApp (ej: "quiero
// el anillo igual a esta muestra"). Se guarda pegada al sobre para
// que el orfebre la vea directo desde el sistema, sin tener que
// buscarla en el grupo de WhatsApp.
// ============================================================
let _fotoReferenciaDataURL = null; // (sin uso, reemplazado por window._fotosReferenciaLista — se deja para no romper nada que lo referencie)

function archivoADataURL(archivo) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = () => resolve(lector.result); // incluye el prefijo data:image/...;base64,
    lector.onerror = reject;
    lector.readAsDataURL(archivo);
  });
}

// Deja el teléfono como 10 números (código de área sin 0 + número sin 15). Devuelve '' si no se puede.
function normalizarTelefonoAR(tel) {
  let d = String(tel || '').replace(/\D/g, '');
  if (d.startsWith('549')) d = d.slice(3);
  else if (d.startsWith('54')) d = d.slice(2);
  if (d.startsWith('0')) d = d.slice(1);
  if (d.length === 12) {
    // Saca el "15" que va después del código de área (2, 3 o 4 dígitos)
    for (const n of [2, 3, 4]) { if (d.substr(n, 2) === '15') { d = d.slice(0, n) + d.slice(n + 2); break; } }
  }
  return d.length === 10 ? d : '';
}

async function guardarNuevaEntrada() {
  const msgBox = document.getElementById('ne-msg');
  const numeroSobre = normalizarSobre(document.getElementById('ne-sobre').value.trim());
  const nombreCliente = document.getElementById('ne-cliente').value.trim();
  const tipoCliente = document.getElementById('ne-tipo-cliente').value;
  const trabajo = document.getElementById('ne-trabajo').value.trim();
  const paraElDia = document.getElementById('ne-para-el-dia').value || null;
  const destino = document.getElementById('ne-destino').value;
  const canal = document.getElementById('ne-canal').value;
  const tipoProducto = document.getElementById('ne-tipo-producto').value;
  const cantidad = parseInt(document.getElementById('ne-cantidad').value) || 1;
  const proveedorId = document.getElementById('ne-proveedor').value || null;
  const telefono = document.getElementById('ne-telefono').value.trim();
  const total = parseFloat(document.getElementById('ne-total').value) || null;
  const sena = parseFloat(document.getElementById('ne-sena').value) || 0;
  const medioPago = document.getElementById('ne-medio-pago').value;

  if (!numeroSobre) {
    msgBox.innerHTML = `<div class="msg msg-error">Falta el N° de sobre.</div>`;
    return;
  }
  if (!nombreCliente) {
    msgBox.innerHTML = `<div class="msg msg-error">Falta el nombre del cliente.</div>`;
    return;
  }
  // Teléfono obligatorio y bien escrito: sin él no le llega el WhatsApp al cliente.
  const telNormalizado = normalizarTelefonoAR(telefono);
  if (!telNormalizado) {
    alert('⚠️ FALTA EL TELÉFONO O ESTÁ MAL ESCRITO\n\nPoné código de área SIN 0 + número SIN 15.\nEj: 3511234567 (10 números).');
    msgBox.innerHTML = `<div class="msg msg-error">⚠️ Teléfono inválido. Ej: 3511234567 (código de área sin 0 + número sin 15).</div>`;
    return;
  }
  document.getElementById('ne-telefono').value = telNormalizado;
  if (!paraElDia) {
    msgBox.innerHTML = `<div class="msg msg-error">⚠️ Falta la fecha estimada de entrega.</div>`;
    return;
  }
  if (!canal) {
    msgBox.innerHTML = `<div class="msg msg-error">⚠️ Elegí el canal de venta (Local / Redes con envío / Redes retiro).</div>`;
    return;
  }
  if (canal === 'LOCAL' && /(env[ií]o|enviar|correo|andreani|encomienda)/i.test(trabajo)) {
    if (!confirm('El trabajo menciona un ENVÍO pero el canal dice LOCAL.\n\n¿Seguro que es LOCAL?\n(Cancelar para corregirlo)')) {
      msgBox.innerHTML = `<div class="msg msg-error">Revisá el canal: si va por correo, elegí "Redes — con envío".</div>`;
      return;
    }
  }

  // Si el trabajo dice "igual que la muestra" / "foto whatsapp" (o variantes,
  // incluso con errores de tipeo tipo "mustra" o "wasap"), es obligatorio
  // adjuntar la foto de referencia, para no perder tiempo después buscándola
  // en el grupo de WhatsApp. Se tolera errores de tipeo con distanciaLevenshtein
  // (la misma función que ya usamos para detectar clientes duplicados).
  const necesitaFoto = mencionaMuestraOWhatsapp(trabajo);
  if (necesitaFoto && window._fotosReferenciaLista.length === 0) {
    alert('⚠️ FALTA ADJUNTAR LA FOTO\n\nEl trabajo menciona "foto" o "muestra".\nSumá la foto al sistema antes de guardar el sobre.');
    msgBox.innerHTML = `<div class="msg msg-error">⚠️ Falta adjuntar la foto de referencia.</div>`;
    return;
  }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  // IMPORTANTE: todo el guardado va envuelto en try/catch. Si se corta la conexión a mitad de
  // camino (wifi débil, etc.), esto lo agarra y avisa bien claro en vez de dejar la pantalla en
  // un estado ambiguo donde no se sabe si se guardó o no.
  try {

  // 1) Buscar o crear el cliente (con aviso si hay uno muy parecido ya cargado)
  let clienteId;
  try {
    clienteId = await buscarOCrearCliente(nombreCliente, tipoCliente, telNormalizado);
  } catch (errCliente) {
    msgBox.innerHTML = `<div class="msg msg-error">Error creando cliente: ${errCliente.message}</div>`;
    return;
  }

  // 2) Crear el sobre
  const { data: sobreNuevo, error: errSobre } = await sb
    .from('sobres')
    .insert({
      numero: numeroSobre,
      cliente_id: clienteId,
      descripcion: trabajo,
      precio_total: total,
      tipo_cliente: tipoCliente,
      categoria_producto: _productoSeleccionado ? _productoSeleccionado.cat : null,
      cod_producto: _productoSeleccionado ? _productoSeleccionado.cod : null,
      foto_referencia: (window._fotosReferenciaLista[0] && window._fotosReferenciaLista[0].dataURL) || null,
      para_el_dia: paraElDia,
      canal: canal
    })
    .select('id')
    .single();

  if (errSobre) {
    const mensaje = errSobre.code === '23505'
      ? 'Ya existe un sobre con ese número.'
      : errSobre.message;
    msgBox.innerHTML = `<div class="msg msg-error">${mensaje}</div>`;
    return;
  }

  // 2.1) Verificación extra: confirmamos que el sobre quedó de verdad en la base antes de decir
  // que se guardó. Esto agarra el caso raro de que la conexión se corte justo después de que
  // Supabase confirme el guardado pero antes de que la respuesta llegue completa al navegador.
  const { data: chequeo } = await sb.from('sobres').select('id').eq('id', sobreNuevo.id).maybeSingle();
  if (!chequeo) {
    msgBox.innerHTML = `<div class="msg msg-error">⚠️ No se pudo confirmar el guardado (puede haberse cortado la conexión). Probá buscar el sobre ${numeroSobre} antes de cargarlo de nuevo.</div>`;
    return;
  }

  // 2.05) NUEVO (05/09/2026): subir TODAS las fotos de referencia (no solo la primera) a la
  // tabla tandem.fotos_sobre + bucket "fotos-sobres", para que se vean todas en la pantalla FOTO
  // y en Sobres (ej: mesa + laterales de un sello). No frena el guardado si alguna falla.
  for (const item of window._fotosReferenciaLista) {
    try {
      const blob = await (await fetch(item.dataURL)).blob();
      const nombreArchivo = `${sobreNuevo.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
      const { error: errSubida } = await sb.storage.from('fotos-sobres').upload(nombreArchivo, blob);
      if (!errSubida) {
        const { data: urlData } = sb.storage.from('fotos-sobres').getPublicUrl(nombreArchivo);
        await sb.from('fotos_sobre').insert({ sobre_id: sobreNuevo.id, url: urlData.publicUrl, path: nombreArchivo, etiqueta: item.etiqueta || null });
      }
    } catch (err) { /* si falla una foto, no corta el guardado del sobre */ }
  }

  // 3) Registrar el movimiento de caja.
  //    - Si es CUENTA CORRIENTE: se registra con el precio total como monto (aunque no se haya
  //      cobrado nada en el momento) — así queda la deuda reflejada en Caja del Día.
  //    - Para cualquier otro caso (incluso si sena = 0, ej: consumidor final que paga recién al
  //      retirar): SIEMPRE se registra el movimiento igual, con el monto que corresponda (puede
  //      ser $0). Así el sobre aparece en Caja del Día desde el momento de la entrada, y no recién
  //      cuando el cliente viene a pagar y retirar.
  if (medioPago === 'CUENTA CORRIENTE' && total > 0) {
    await sb.from('movimientos_caja').insert({
      vendedora: usuarioActual.nombre,
      descripcion: trabajo || ('sobre ' + numeroSobre),
      ingresa_egresa: 'INGRESA',
      tipo_cliente: tipoCliente,
      medio_pago: 'CUENTA CORRIENTE',
      monto: total,
      cantidad: cantidad,
      canal: canal,
      cliente_id: clienteId,
      sobre_id: sobreNuevo.id,
      codigo: tipoProducto ? parseInt(tipoProducto) : null,
      proveedor_id: proveedorId
    });
  } else {
    await sb.from('movimientos_caja').insert({
      vendedora: usuarioActual.nombre,
      descripcion: sena > 0 ? ('seña sobre ' + numeroSobre) : ('sobre ' + numeroSobre + ' - sin seña, paga al retirar'),
      ingresa_egresa: 'INGRESA',
      tipo_cliente: tipoCliente,
      medio_pago: medioPago,
      monto: sena,
      cantidad: cantidad,
      canal: canal,
      cliente_id: clienteId,
      sobre_id: sobreNuevo.id,
      codigo: tipoProducto ? parseInt(tipoProducto) : null,
      proveedor_id: proveedorId
    });
  }

  // 4) Historial
  await sb.from('historial_sobres').insert({
    sobre_id: sobreNuevo.id,
    evento: 'ENTRADA',
    detalle: 'Ingresó al local (dio entrada: ' + usuarioActual.nombre + ')'
  });

  // 4.1) Si se eligió destino, baja directo a taller (evita cargar el N° de sobre de nuevo)
  if (destino) {
    await sb.from('sobres').update({ baja_taller: new Date().toISOString(), orfebre: destino }).eq('id', sobreNuevo.id);
    await sb.from('historial_sobres').insert({
      sobre_id: sobreNuevo.id,
      evento: 'BAJA A TALLER',
      detalle: 'Asignado a ' + destino + ' directo desde Entrada (lo bajó: ' + usuarioActual.nombre + ')'
    });
  }

  // Datos para el comprobante impreso (se guardan acá porque el formulario se limpia enseguida)
  window._ultimoComprobante = {
    numero: numeroSobre,
    fechaHora: new Date().toLocaleString('es-AR', { timeZone: 'America/Argentina/Cordoba', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),

// desde el navegador (compu o celu). No guarda nada en la base.

function escaparHtmlComprobante(txt) {
  return String(txt == null ? '' : txt)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// QR como imagen vectorial (SVG) usando la librería "qrcode" incluida en la app. Sin internet, sin costo.
function qrSvgComprobante(texto) {
  try {
    const qr = qrcode(0, 'M');
    qr.addData(String(texto));
    qr.make();
    return qr.createSvgTag({ cellSize: 1, margin: 2, scalable: true });
  } catch (e) { return ''; }
}

// Achica las fotos y las pasa a blanco y negro con un poco más de contraste, para que la impresora
// láser las imprima livianas y rápido (baja calidad, solo de referencia para el taller).
function prepararFotosComprobante(fotos) {
  const procesar = (dataURL) => new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      try {
        const maxLado = 500;
        const esc = Math.min(1, maxLado / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * esc));
        const h = Math.max(1, Math.round(img.height * esc));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const datos = ctx.getImageData(0, 0, w, h);
        const px = datos.data;
        for (let i = 0; i < px.length; i += 4) {
          let g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
          g = Math.max(0, Math.min(255, (g - 128) * 1.25 + 128));
          px[i] = px[i + 1] = px[i + 2] = g;
        }
        ctx.putImageData(datos, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      } catch (e) { resolve(dataURL); }
    };
    img.onerror = () => resolve(null);
    img.src = dataURL;
  });
  return Promise.all((fotos || []).slice(0, 3).map(procesar));
}

async function imprimirComprobanteObjeto(c) {
  let fotos = [];
  try { fotos = await prepararFotosComprobante(c.fotos); } catch (e) { fotos = []; }
  const anterior = document.getElementById('iframe-comprobante');
  if (anterior) anterior.remove();
  const iframe = document.createElement('iframe');
  iframe.id = 'iframe-comprobante';
  iframe.style.cssText = 'position:fixed; right:0; bottom:0; width:0; height:0; border:0;';
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(armarHtmlComprobante({ ...c, fotos: fotos.filter(Boolean), fotosTotal: (c.fotos || []).length }));
  doc.close();
  // Espera a que carguen las fotos (si hay) antes de abrir la ventana de impresión
  const imgs = [...doc.images];
  await Promise.race([
    Promise.all(imgs.map(im => im.complete ? Promise.resolve() : new Promise(r => { im.onload = im.onerror = r; }))),
    new Promise(r => setTimeout(r, 2500))
  ]);
  setTimeout(() => { iframe.contentWindow.focus(); iframe.contentWindow.print(); }, 200);
}
window.imprimirComprobanteObjeto = imprimirComprobanteObjeto;

async function imprimirComprobante() {
  const c = window._ultimoComprobante;
  if (!c) { alert('No hay ningún comprobante para imprimir.'); return; }
  await imprimirComprobanteObjeto(c);
}

// NUEVO (22/09/2026): reimprimir el comprobante de un sobre YA cargado (para pruebas de
// impresión, o si se rompió/perdió la hoja original) — arma los datos desde lo que quedó
// guardado en el sobre en vez de depender de la memoria de la pantalla de Nueva Entrada.
async function reimprimirComprobante(sobreId) {
  const { data: s, error } = await sb
    .from('sobres')
    .select('numero, descripcion, precio_total, fecha_entrada, para_el_dia, canal, orfebre, clientes(nombre, telefono)')
    .eq('id', sobreId).single();
  if (error || !s) { alert('No se pudo cargar el sobre para reimprimir.'); return; }

  const { data: pagos } = await sb
    .from('movimientos_caja')
    .select('monto, medio_pago, vendedora, fecha')
    .eq('sobre_id', sobreId).eq('ingresa_egresa', 'INGRESA').neq('medio_pago', 'CUENTA CORRIENTE')
    .order('fecha');
  const sena = (pagos || []).reduce((acc, p) => acc + Number(p.monto), 0);

  const { data: fotosExtra } = await sb
    .from('fotos_sobre').select('url').eq('sobre_id', sobreId).order('created_at').limit(3);

  await imprimirComprobanteObjeto({
    numero: s.numero,
    fechaHora: new Date(s.fecha_entrada + 'T00:00:00').toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' }),
    vendedora: (pagos && pagos[0] && pagos[0].vendedora) || '',
    canal: s.canal,
    cliente: s.clientes ? s.clientes.nombre : '',
    telefono: s.clientes ? s.clientes.telefono : '',
    trabajo: s.descripcion,
    cantidad: 1,
    paraElDia: s.para_el_dia,
    total: s.precio_total,
    sena: sena,
    medioPago: (pagos && pagos[0] && pagos[0].medio_pago) || '',
    destino: s.orfebre,
    fotos: (fotosExtra || []).map(f => f.url)
  });
}
window.reimprimirComprobante = reimprimirComprobante;

let _timeoutBuscarSobresEtapa = null;

async function buscarSobresPendientesEtapa(idInput, idResultado, idDestino, esRegreso) {
  clearTimeout(_timeoutBuscarSobresEtapa);
  const termino = document.getElementById(idInput).value.trim();
  const resBox = document.getElementById(idResultado);
  if (termino.length < 2) { resBox.innerHTML = ''; return; }

  _timeoutBuscarSobresEtapa = setTimeout(async () => {
    resBox.innerHTML = `<div class="msg">Buscando...</div>`;

    let consulta = sb.from('sobres').select('numero, descripcion, clientes(nombre)').is('fecha_salida', null).limit(8);
    consulta = esRegreso ? consulta.not('baja_taller', 'is', null).is('listo', null) : consulta.is('baja_taller', null);

    const { data: porNumero } = await consulta.ilike('numero', '%' + termino + '%');

    let porCliente = [];
    if (isNaN(termino)) {
      const { data: clientesMatch } = await sb.from('clientes').select('id').ilike('nombre', '%' + termino + '%').limit(10);
      if (clientesMatch && clientesMatch.length > 0) {
        const ids = clientesMatch.map(c => c.id);
        let consulta2 = sb.from('sobres').select('numero, descripcion, clientes(nombre)').is('fecha_salida', null).in('cliente_id', ids).limit(8);
        consulta2 = esRegreso ? consulta2.not('baja_taller', 'is', null).is('listo', null) : consulta2.is('baja_taller', null);
        const { data } = await consulta2;
        porCliente = data || [];
      }
    }

    const combinados = [...(porNumero || []), ...porCliente];
    const vistos = new Set();
    const unicos = combinados.filter(s => vistos.has(s.numero) ? false : (vistos.add(s.numero), true));

    if (unicos.length === 0) { resBox.innerHTML = `<div class="vacio">Sin resultados</div>`; return; }

    resBox.innerHTML = unicos.map(s => `
      <div class="lista-sobre" style="cursor:pointer; padding:8px 10px;" onclick="agregarNumeroASobres('${idDestino}', '${s.numero}')">
        <div class="nro" style="font-size:14px;">#${s.numero} — ${s.clientes ? s.clientes.nombre : ''}</div>
        <div class="cli" style="font-size:12px;">${s.descripcion || ''}</div>
      </div>
    `).join('');
  }, 250);
}
window.buscarSobresPendientesEtapa = buscarSobresPendientesEtapa;

async function cargarTodosPendientesEtapa(idResultado, idDestino, esRegreso) {
  const resBox = document.getElementById(idResultado);

  let consulta = sb.from('sobres').select('numero, descripcion, clientes(nombre)').is('fecha_salida', null);
  consulta = esRegreso ? consulta.not('baja_taller', 'is', null).is('listo', null) : consulta.is('baja_taller', null);
  const { data, error } = await consulta.order('created_at');

  if (error) { resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  if (!data || data.length === 0) { resBox.innerHTML = `<div class="vacio">No hay ninguno pendiente 🎉</div>`; return; }

  resBox.innerHTML = data.map(s => `

async function bajarATallerLote() {

  const numeros = [...new Set(document.getElementById('bt-sobres').value.trim().split(/[\s,]+/).filter(n => n))];

  if (numeros.length === 0) { resBox.innerHTML = `<div class="msg msg-error">Escribí al menos un N° de sobre.</div>`; return; }

  _bajarTallerLoteEnCurso = true;
  resBox.innerHTML = `<div class="msg">⏳ Guardando... no vuelvas a tocar el botón</div>`;
  // ok = se bajaron ahora mismo. yaEstaban = no hizo falta nada, ya estaban bien (no es un error).
  // errores = de verdad no se pudieron bajar (no existen, ya retirados, falla de guardado).
  const ok = [], yaEstaban = [], errores = [];

  for (const numero of numeros) {
    const { data: sobre, error: errBuscar } = await sb
      .from('sobres')
      .select('id, baja_taller, fecha_salida')
      .eq('numero', normalizarSobre(numero))
      .maybeSingle();

    if (errBuscar || !sobre) { errores.push(numero + ' (no existe)'); continue; }
    if (sobre.fecha_salida) { errores.push(numero + ' (ya retirado)'); continue; }
    if (sobre.baja_taller) { yaEstaban.push(numero); continue; }

    const { error } = await sb
      .from('sobres')
      .update({ baja_taller: new Date().toISOString(), orfebre: orfebre })
      .eq('id', sobre.id);

    if (error) { errores.push(numero + ' (error al guardar)'); continue; }

    await sb.from('historial_sobres').insert({
      sobre_id: sobre.id,
      evento: 'BAJA A TALLER',
      detalle: 'Asignado a ' + orfebre + ' (lo bajó: ' + usuarioActual.nombre + ')'
    });
    ok.push(numero);
  }

  resBox.innerHTML = `
    ${ok.length > 0 ? `<div class="msg msg-ok">✅ Bajados a ${orfebre}: ${ok.join(', ')}</div>` : ''}
    ${yaEstaban.length > 0 ? `<div class="msg" style="background:#eef3ea; color:#3a5a2c;">ℹ️ Ya estaban bajados (no hacía falta hacer nada): ${yaEstaban.join(', ')}</div>` : ''}
    ${errores.length > 0 ? `<div class="msg msg-error">⚠️ No se pudieron bajar: ${errores.join(', ')}</div>` : ''}
  `;
  document.getElementById('bt-sobres').value = '';
  _bajarTallerLoteEnCurso = false;
}
window.bajarATallerLote = bajarATallerLote;

async function marcarListo(sobreId, numero) {
  const msgBox = document.getElementById('msg-' + sobreId);
  const retorno = document.getElementById('retorno-' + sobreId).checked;
  const derivaInput = document.getElementById('deriva-' + sobreId);
  const deriva = derivaInput ? derivaInput.value : '';
  const precioInput = document.getElementById('precio-' + sobreId);
  const itemsInput = document.getElementById('items-' + sobreId);

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  if (retorno) {
    await sb.from('historial_sobres').insert({
      sobre_id: sobreId,
      evento: 'RETORNO',
      detalle: 'Vuelve con el mismo orfebre (controlado por ' + usuarioActual.nombre + ')'
    });
    msgBox.innerHTML = `<div class="msg msg-ok">✅ Registrado, vuelve a taller.</div>`;
    return;
  }

  // Deriva a otro orfebre/etapa (Daniel, Pachula, Diseño, Grabado o Laureano): no queda "listo"
  // todavía, solo cambia quién lo tiene ahora. Sigue en la cola de "Regreso" hasta que ese
  // orfebre lo termine y alguien lo controle de nuevo.
  if (deriva) {
    const { error } = await sb.from('sobres').update({ orfebre: deriva }).eq('id', sobreId);
    if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
    await sb.from('historial_sobres').insert({
      sobre_id: sobreId,
      evento: 'REASIGNADO',
      detalle: 'Pasó a ' + deriva + ' (controlado por ' + usuarioActual.nombre + ')'
    });
    msgBox.innerHTML = `<div class="msg msg-ok">✅ Sobre ${numero} pasó a ${deriva}.</div>`;
    return;
  }

  let items = [];
  let precio = precioInput ? parseFloat(precioInput.value) || null : null;
  if (itemsInput && itemsInput.value.trim()) {
    const lineas = itemsInput.value.split('\n').map(l => l.trim()).filter(l => l);
    items = lineas.map(linea => {
      const m = linea.match(/^(.*\S)\s*[-–:]?\s*([\d.,]*\d)\s*$/);
      if (!m) return { descripcion: linea, precio: 0 };
      const descripcion = m[1].replace(/[-–:]\s*$/, '').trim();
      const precioNum = parseFloat(m[2].replace(/\./g, '').replace(',', '.')) || 0;
      return { descripcion: descripcion, precio: precioNum };
    });
    precio = items.reduce((acc, it) => acc + it.precio, 0);
  }

  const cambios = { listo: new Date().toISOString(), controlado_por: usuarioActual.nombre };
  if (precio) cambios.precio_total = precio;

  const { error } = await sb.from('sobres').update(cambios).eq('id', sobreId);
  if (error) {
    msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`;
    return;
  }

  // Si se cargó o cambió un precio acá (por ejemplo, un sobre que entró sin precio definido),
  // y ese sobre está a cuenta corriente, hay que actualizar también el monto del movimiento de
  // caja — si no, la deuda real nunca queda reflejada (quedaba en $0 aunque el sobre ya tuviera
  // precio puesto).
  if (precio) {
    const { data: movCta } = await sb.from('movimientos_caja').select('id').eq('sobre_id', sobreId).eq('medio_pago', 'CUENTA CORRIENTE').maybeSingle();
    if (movCta) {
      await sb.from('movimientos_caja').update({ monto: precio }).eq('id', movCta.id);
    }
  }

  if (items.length > 0) {
    await sb.from('items_sobre').insert(items.map(it => ({ sobre_id: sobreId, descripcion: it.descripcion, precio: it.precio })));
  }

  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'LISTO PARA RETIRAR',
    detalle: 'Controlado por ' + usuarioActual.nombre
  });

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Sobre ${numero} marcado como listo.</div>`;
}
window.marcarListo = marcarListo;

function filaRetiro(s, pagadoPorSobre) {
  const total = Number(s.precio_total) || 0;
  const pagado = pagadoPorSobre[s.id] || 0;
  const saldo = Math.max(0, total - pagado);
  return `
    <div class="lista-sobre" id="fila-${s.id}">
      <div class="nro">#${s.numero}</div>
      <div class="cli">${s.clientes ? s.clientes.nombre : '(sin cliente)'}</div>
      <div class="desc">${s.descripcion || ''}</div>
      <div style="font-weight:700; margin-bottom:8px;">Saldo: $${saldo.toLocaleString('es-AR')}</div>
      <select id="medio-${s.id}">
        <option>EFECTIVO</option>
        <option>TARJETA FISER</option>
        <option>TRANSFERENCIA SANTANDER</option>
        <option>MERCADO PAGO FISER</option>
        <option>MERCADO PAGO LAUREANO</option>
        <option>UALA CARLA</option>
        <option>CUENTA CORRIENTE</option>
      </select>
      <button class="btn btn-verde" onclick='confirmarRetiro(${JSON.stringify(s.id)}, ${JSON.stringify(s.numero)}, ${saldo}, ${JSON.stringify(s.tipo_cliente || 'CONSUMIDOR_FINAL')}, ${JSON.stringify(s.clientes ? s.clientes.nombre : '')}, ${JSON.stringify(s.clientes ? s.clientes.telefono : '')})'>Confirmar cobro y entregar</button>
      <div id="msg-${s.id}"></div>
    </div>
  `;
}

async function pagadoPorSobres(ids) {
  if (!ids || ids.length === 0) return {};
  // OJO: excluimos medio_pago = 'CUENTA CORRIENTE' porque ese registro es la venta a
  // crédito en sí (se crea en Nueva Entrada para que quede contabilizado el monto),
  // no un cobro real. Si lo contáramos, el saldo de Retiro daría $0 en sobres que
  // en realidad el cliente todavía debe.
  const { data: pagos } = await sb.from('movimientos_caja').select('sobre_id, monto').in('sobre_id', ids).eq('ingresa_egresa', 'INGRESA').neq('medio_pago', 'CUENTA CORRIENTE');
  const mapa = {};
  (pagos || []).forEach(p => { mapa[p.sobre_id] = (mapa[p.sobre_id] || 0) + Number(p.monto); });
  return mapa;
}

let _timeoutBuscarRetiro = null;

function buscarSobresListosParaRetiro() {
  clearTimeout(_timeoutBuscarRetiro);
  const termino = document.getElementById('rt-buscar').value.trim();
  const resBox = document.getElementById('rt-resultado');
  document.getElementById('rt-todos').innerHTML = '';
  if (termino.length < 2) { resBox.innerHTML = ''; return; }

  _timeoutBuscarRetiro = setTimeout(async () => {
    resBox.innerHTML = `<div class="msg">Buscando...</div>`;

    let consulta = sb.from('sobres').select('id, numero, descripcion, precio_total, tipo_cliente, clientes(nombre, telefono)')
      .is('fecha_salida', null).limit(8);
    const { data: porNumero } = await consulta.ilike('numero', '%' + termino + '%');

    let porCliente = [];
    if (isNaN(termino)) {
      const { data: clientesMatch } = await sb.from('clientes').select('id').ilike('nombre', '%' + termino + '%').limit(10);
      if (clientesMatch && clientesMatch.length > 0) {
        const ids = clientesMatch.map(c => c.id);
        const { data } = await sb.from('sobres').select('id, numero, descripcion, precio_total, tipo_cliente, clientes(nombre, telefono)')
          .is('fecha_salida', null).in('cliente_id', ids).limit(8);
        porCliente = data || [];
      }
    }

    const combinados = [...(porNumero || []), ...porCliente];
    const vistos = new Set();
    const sobres = combinados.filter(s => vistos.has(s.id) ? false : (vistos.add(s.id), true));

    if (sobres.length === 0) { resBox.innerHTML = `<div class="vacio">Sin resultados</div>`; return; }

    const pagadoPorSobre = await pagadoPorSobres(sobres.map(s => s.id));
    resBox.innerHTML = sobres.map(s => filaRetiro(s, pagadoPorSobre)).join('');
  }, 250);
}
window.buscarSobresListosParaRetiro = buscarSobresListosParaRetiro;

async function confirmarRetiro(sobreId, numero, saldo, tipoCliente, nombreCliente, telefonoCliente) {
  const msgBox = document.getElementById('msg-' + sobreId);
  const medioPago = document.getElementById('medio-' + sobreId).value;
  const esCuentaCorriente = medioPago === 'CUENTA CORRIENTE';
  const montoCobrado = esCuentaCorriente ? 0 : saldo;

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { data: sobreData, error: errFecha } = await sb
    .from('sobres')
    .update({ fecha_salida: new Date().toISOString() })
    .eq('id', sobreId)
    .select('cliente_id')
    .single();

  if (errFecha) {
    msgBox.innerHTML = `<div class="msg msg-error">${errFecha.message}</div>`;
    return;
  }

  let errorCobro = null;
  if (montoCobrado > 0) {
    const { error: errCobro } = await sb.from('movimientos_caja').insert({
      vendedora: usuarioActual.nombre,
      descripcion: 'cobro saldo sobre ' + numero,
      ingresa_egresa: 'INGRESA',
      tipo_cliente: tipoCliente,
      medio_pago: medioPago,
      monto: montoCobrado,
      cliente_id: sobreData.cliente_id,
      sobre_id: sobreId
    });
    errorCobro = errCobro;
  }

  if (errorCobro) {
    msgBox.innerHTML = `<div class="msg msg-error">⚠️ El sobre se marcó como retirado, PERO el cobro de $${montoCobrado.toLocaleString('es-AR')} NO se guardó (${errorCobro.message}). Avisale a Mauricio para que lo cargue a mano.</div>`;
    return;
  }

  const detalle = esCuentaCorriente
    ? 'Se lo llevó, queda en cuenta corriente'
    : (montoCobrado > 0 ? 'Retirado y cobrado $' + montoCobrado : 'Retirado, sin saldo pendiente');

  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'RETIRADO',
    detalle: detalle + ' (entregó: ' + usuarioActual.nombre + ')'
  });

  const mensajeWa = esCuentaCorriente
    ? `Hola${nombreCliente ? ' ' + nombreCliente : ''}! Te avisamos que tu pedido N° ${numero} en Joyería Tándem fue retirado. Queda un saldo de $${saldo.toLocaleString('es-AR')} en tu cuenta corriente. 💍`
    : `Hola${nombreCliente ? ' ' + nombreCliente : ''}! Te avisamos que tu pedido N° ${numero} en Joyería Tándem fue retirado y pagado correctamente. ¡Gracias por tu confianza! 💍`;

  document.getElementById('fila-' + sobreId).innerHTML = `

let _timeoutBusquedaCC = null;

function buscarClienteCC() {
  clearTimeout(_timeoutBusquedaCC);
  const nombre = document.getElementById('cc-buscar').value.trim();
  const resBox = document.getElementById('cc-resultado');

  if (!nombre) { resBox.innerHTML = ''; return; }
  if (nombre.length < 2) { resBox.innerHTML = ''; return; }

  // Pequeña espera para no disparar una búsqueda por cada tecla
  _timeoutBusquedaCC = setTimeout(async () => {
    resBox.innerHTML = `<div class="msg">Buscando...</div>`;

    const { data, error } = await sb
      .from('clientes')
      .select('id, nombre, tipo_cliente')
      .ilike('nombre', '%' + nombre + '%')
      .order('nombre')
      .limit(10);

    if (error) {
      resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`;
      return;
    }
    if (data.length === 0) {
      resBox.innerHTML = `<div class="vacio">Ningún cliente coincide con "${nombre}"</div>`;
      return;
    }

    resBox.innerHTML = data.map(c => `
      <div class="lista-sobre" style="cursor:pointer;" onclick="verCuentaCliente('${c.id}', '${c.nombre.replace(/'/g, "\\'")}')">

  }, 250);
}
