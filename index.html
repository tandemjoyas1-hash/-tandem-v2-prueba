// ============================================================
// NUEVO: cada vez que se cambia de pantalla, se guarda una "foto"
// de lo que había antes en el historial del navegador. Así, si
// alguien toca el botón "atrás" del celu/navegador, vuelve a la
// pantalla anterior DENTRO de la app, en vez de salir de golpe.
// ============================================================
let _historialHTML = [];
let _restaurandoHistorial = false;

// ============================================================
// Limpia un N° de sobre: saca cualquier símbolo (#, N°, espacios, etc.)
// y los ceros a la izquierda, para que quede solo el número puro
// (ej: "#0801" -> "801"). Igual que hacía el sistema viejo, para que
// no queden dos sobres "distintos" por un cero o un símbolo de más.
// ============================================================
function normalizarSobre(v) {
  const soloDigitos = String(v || '').replace(/\D/g, '');
  if (!soloDigitos) return String(v || '').trim();
  return String(parseInt(soloDigitos, 10));
}

function render(html) {
  if (!_restaurandoHistorial) {
    _historialHTML.push(app.innerHTML);
    history.pushState({ idx: _historialHTML.length }, '');
  }
  app.innerHTML = html;
}

window.addEventListener('popstate', () => {
  if (_historialHTML.length > 0) {
    _restaurandoHistorial = true;
    app.innerHTML = _historialHTML.pop();
    _restaurandoHistorial = false;
  }
});

// ============================================================
// AUXILIAR: arma un link de WhatsApp a partir de un teléfono
// (asume números argentinos guardados como 10 dígitos, ej:
// 3511234567) y un mensaje. Devuelve null si no hay teléfono.
// ============================================================
function linkWhatsApp(telefono, mensaje) {
  if (!telefono) return null;
  let limpio = String(telefono).replace(/\D/g, '');
  if (!limpio) return null;
  if (limpio.startsWith('0')) limpio = limpio.slice(1);
  if (!limpio.startsWith('54')) limpio = '549' + limpio;
  return 'https://wa.me/' + limpio + '?text=' + encodeURIComponent(mensaje);
}

function botonWhatsApp(telefono, mensaje) {
  const link = linkWhatsApp(telefono, mensaje);
  if (!link) return `<small>Este cliente no tiene teléfono cargado, no se puede avisar por WhatsApp.</small>`;
  return `<a href="${link}" target="_blank" class="btn btn-outline" style="display:block; text-align:center; text-decoration:none; margin-top:8px;">📱 Avisar por WhatsApp</a>`;
}

async function pantallaLogin() {
  render(`<div class="card"><p>Cargando usuarios...</p></div>`);
  const { data, error } = await sb
    .from('usuarios')
    .select('id, nombre, rol')
    .eq('activo', true)
    .order('nombre');

  if (error) {
    render(`<div class="card"><p class="msg msg-error">No se pudo conectar: ${error.message}</p></div>`);
    return;
  }

  const opciones = data.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('');
  render(`
    <div class="card">
      <h1>Joyería Tándem</h1>
      <div class="sub">Sistema nuevo — versión de prueba</div>
      <label>¿Quién sos?</label>
      <select id="sel-usuario">${opciones}</select>
      <label>Tu PIN (2 números)</label>
      <input type="tel" inputmode="numeric" maxlength="2" id="pin-input" placeholder="••">
      <button class="btn btn-verde" onclick="intentarLogin()">Entrar</button>
      <div id="login-msg"></div>
      <small>Si es tu primera vez, escribí el PIN que quieras usar de ahora en más.</small>
    </div>
  `);
}

async function intentarLogin() {
  const usuarioId = document.getElementById('sel-usuario').value;
  const pin = document.getElementById('pin-input').value.trim();
  const msgBox = document.getElementById('login-msg');

  if (!/^\d{2}$/.test(pin)) {
    msgBox.innerHTML = `<div class="msg msg-error">El PIN tiene que ser de 2 números.</div>`;
    return;
  }

  const { data: usuario, error } = await sb
    .from('usuarios')
    .select('id, nombre, rol, pin')
    .eq('id', usuarioId)
    .single();

  if (error || !usuario) {
    msgBox.innerHTML = `<div class="msg msg-error">No se encontró el usuario.</div>`;
    return;
  }

  if (!usuario.pin) {
    // Primera vez: se guarda el PIN que acaba de escribir
    const { error: errUpdate } = await sb
      .from('usuarios')
      .update({ pin: pin })
      .eq('id', usuarioId);
    if (errUpdate) {
      msgBox.innerHTML = `<div class="msg msg-error">No se pudo guardar el PIN: ${errUpdate.message}</div>`;
      return;
    }
    usuario.pin = pin;
  }

  if (usuario.pin !== pin) {
    msgBox.innerHTML = `<div class="msg msg-error">PIN incorrecto.</div>`;
    return;
  }

  usuarioActual = { id: usuario.id, nombre: usuario.nombre, rol: usuario.rol };
  pantallaNuevaEntrada();
}
window.intentarLogin = intentarLogin;

  msgBox.innerHTML = `<div class="msg">Aplicando a todos los productos, un momento...</div>`;

async function sugerirCodigoNuevo() {
  const cat = document.getElementById('ap-cat').value;
  const codInput = document.getElementById('ap-cod');
  codInput.value = 'Calculando...';

  const { data } = await sb.schema('public')
    .from('products')
    .select('cod, orden_num')
    .eq('cat', cat)
    .not('cod', 'is', null)
    .order('orden_num', { ascending: false, nullsFirst: false })
    .limit(1);

  if (data && data.length > 0 && data[0].cod) {
    const codActual = data[0].cod;
    const match = codActual.match(/^(.*?)(\d+)(\D*)$/);
    if (match) {
      const prefijo = match[1];
      const digitos = match[2];
      const sufijo = match[3];
      const siguienteNum = (parseInt(digitos, 10) + 1).toString().padStart(digitos.length, '0');
      codInput.value = prefijo + siguienteNum + sufijo;
      return;
    }
  }
  codInput.value = '';
}
window.sugerirCodigoNuevo = sugerirCodigoNuevo;

async function compartirFotosSeleccionadas() {
  const seleccionados = [...document.querySelectorAll('.cat-chk-compartir:checked')];
  if (seleccionados.length === 0) return;

  try {
    const archivos = await Promise.all(seleccionados.map(async (chk, i) => {
      const dataUri = _fotosProductosActuales[chk.dataset.cod];
      const resp = await fetch(dataUri);
      const blob = await resp.blob();
      const ext = blob.type.split('/')[1] || 'png';
      const nombreLimpio = (chk.dataset.desc || 'producto').replace(/[^a-zA-Z0-9 ]/g, '').trim().slice(0, 30).replace(/\s+/g, '-');
      return new File([blob], nombreLimpio + '.' + ext, { type: blob.type });
    }));

    // En celu: intenta abrir directo el menú de compartir (WhatsApp, etc.)
    if (navigator.canShare && navigator.canShare({ files: archivos })) {
      const descripciones = seleccionados.map(chk => chk.dataset.desc).join(', ');
      await navigator.share({ files: archivos, text: 'Joyería Tándem: ' + descripciones });
      return;
    }

    // En compu (o si el celu no soporta compartir archivos): descarga todas las fotos elegidas
    // de una sola vez, para adjuntarlas juntas en WhatsApp Web (📎 → Fotos y videos → elegís varias).
    archivos.forEach((archivo, i) => {
      setTimeout(() => {
        const url = URL.createObjectURL(archivo);
        const a = document.createElement('a');
        a.href = url;
        a.download = archivo.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, i * 200); // un pequeño espacio entre cada descarga para que el navegador no las bloquee
    });

    alert('Se descargaron ' + archivos.length + ' foto(s). Ahora abrí WhatsApp Web → 📎 (adjuntar) → Fotos y videos, y elegí esos archivos de tu carpeta de Descargas — se pueden mandar todas juntas en un mismo mensaje.');
  } catch (err) {
    if (err.name !== 'AbortError') alert('No se pudo descargar: ' + err.message);
  }
}
window.compartirFotosSeleccionadas = compartirFotosSeleccionadas;

async function buscarEnCatalogo(categoriaExacta) {
  const termino = document.getElementById('cat-buscar').value.trim();
  const resBox = document.getElementById('cat-resultado');
  if (!termino && !categoriaExacta) { resBox.innerHTML = ''; return; }
  resBox.innerHTML = `<div class="msg">Buscando...</div>`;

  try {
    if (_precioGramoActual === null) {
      const { data: config, error: errConfig } = await sb.schema('public').from('settings').select('precio_gramo').limit(1).maybeSingle();
      if (errConfig) throw errConfig;
      _precioGramoActual = config ? Number(config.precio_gramo) || 0 : 0;
    }

    let consulta = sb.schema('public')
      .from('products')
      .select('cod, cat, descripcion, medidas, peso, labor, foto')
      .limit(categoriaExacta ? 40 : 10);

    consulta = categoriaExacta
      ? consulta.eq('cat', categoriaExacta).order('cod', { ascending: true })
      : consulta.or('descripcion.ilike.%' + termino + '%,cod.ilike.%' + termino + '%').order('foto', { ascending: false, nullsFirst: false });

    const { data: productos, error } = await consulta;

    if (error) throw error;

    if (!productos || productos.length === 0) {
      resBox.innerHTML = `<div class="vacio">Sin resultados para "${categoriaExacta || termino}"</div>`;
      return;
    }

    resBox.innerHTML = `
      <div id="cat-compartir-barra" style="display:none; position:sticky; top:0; z-index:5; background:#2f6d1f; color:white; padding:10px 14px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <span id="cat-compartir-cantidad" style="font-weight:700; font-size:13px;"></span>
        <button type="button" onclick="compartirFotosSeleccionadas()" style="background:white; color:#2f6d1f; border:none; border-radius:8px; padding:8px 14px; font-weight:700; font-size:13px;">📤 Enviar / descargar fotos</button>
      </div>
      <div class="cat-grid">` + productos.map(p => {
      const metal = (Number(p.peso) || 0) * _precioGramoActual;
      const zipiur = metal + (Number(p.labor) || 0);
      const mayor = zipiur * 1.2;
      const redes = mayor * 1.4;
      const menor = mayor * 1.67;

      const boton = (etiqueta, precio) => `
        <button type="button" class="btn btn-outline" style="margin-top:5px; padding:7px 4px; font-size:12px;"
          onclick='elegirProductoCatalogo(${JSON.stringify(p.cod)}, ${JSON.stringify(p.cat)}, ${JSON.stringify(p.descripcion)}, ${Math.round(precio)}, ${JSON.stringify(etiqueta)})'>
          ${etiqueta}: $${Math.round(precio).toLocaleString('es-AR')}
        </button>
      `;

      const foto = p.foto ? `<img src="${p.foto}" style="width:100%; max-height:130px; object-fit:contain; border-radius:8px; background:#fff; margin-bottom:8px; cursor:pointer;" onclick='pantallaDetalleProducto(${JSON.stringify(p.cod)})'>` : '';

      return `
        <div class="lista-sobre">
          ${p.foto ? `
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; font-size:12px; margin-bottom:4px;">
              <input type="checkbox" class="cat-chk-compartir" data-cod="${p.cod}" data-desc="${(p.descripcion || '').replace(/"/g, '&quot;')}" onchange="actualizarBarraCompartir()" style="width:auto;">
              Elegir para enviar
            </label>
          ` : ''}
          ${foto}
          <div class="nro" style="font-size:13px; cursor:pointer;" onclick='pantallaDetalleProducto(${JSON.stringify(p.cod)})'>${p.descripcion} ${p.medidas ? '(' + p.medidas + ')' : ''}</div>
          <div class="cli" style="font-size:11.5px;">${p.cat} · cód. ${p.cod}<br>M.Obra: $${(Number(p.labor) || 0).toLocaleString('es-AR')}</div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:4px;">
            ${boton('Zipiur', zipiur)}
            ${boton('Mayor', mayor)}
            ${boton('Redes', redes)}
            ${boton('Menor', menor)}
          </div>
          <button type="button" class="btn btn-outline" style="margin-top:6px; padding:6px; font-size:11.5px;" onclick='pantallaEditarProducto(${JSON.stringify(p.cod)})'>✏️ Editar</button>
        </div>
      `;
    }).join('') + `</div>`;

    _fotosProductosActuales = {};
    productos.forEach(p => { if (p.foto) _fotosProductosActuales[p.cod] = p.foto; });
  } catch (err) {
    resBox.innerHTML = `<div class="msg msg-error">No se pudo buscar: ${err.message || err}</div>`;
  }
}

function archivoABase64(archivo) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = () => resolve(lector.result.split(',')[1]);
    lector.onerror = reject;
    lector.readAsDataURL(archivo);
  });
}

async function leerFotoSobre() {
  const input = document.getElementById('ne-foto');
  const msgBox = document.getElementById('ne-foto-msg');
  const archivo = input.files[0];
  if (!archivo) return;

  msgBox.innerHTML = `<div class="msg">📷 Leyendo la foto, esperá unos segundos...</div>`;

  try {
    const base64 = await archivoABase64(archivo);
    const resp = await fetch(SUPABASE_FUNCIONES_URL + '/leer-sobre', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imagen: base64 })
    });
    const datos = await resp.json();

    if (datos.error) {
      msgBox.innerHTML = `<div class="msg msg-error">${datos.error}</div>`;
      return;

    if (datos.numero_sobre) document.getElementById('ne-sobre').value = datos.numero_sobre;
    if (datos.cliente) document.getElementById('ne-cliente').value = datos.cliente;
    if (datos.telefono) document.getElementById('ne-telefono').value = datos.telefono;
    if (datos.trabajo) document.getElementById('ne-trabajo').value = datos.trabajo;
    if (datos.total) document.getElementById('ne-total').value = datos.total;
    if (datos.senia) document.getElementById('ne-sena').value = datos.senia;

    msgBox.innerHTML = `<div class="msg msg-ok">✅ Listo, revisá los datos antes de guardar.</div>`;
  } catch (err) {

}

async function guardarNuevaEntrada() {
  const msgBox = document.getElementById('ne-msg');
  const numeroSobre = normalizarSobre(document.getElementById('ne-sobre').value.trim());
  const nombreCliente = document.getElementById('ne-cliente').value.trim();
  const tipoCliente = document.getElementById('ne-tipo-cliente').value;
  const trabajo = document.getElementById('ne-trabajo').value.trim();
  const tipoProducto = document.getElementById('ne-tipo-producto').value;
  const cantidad = parseInt(document.getElementById('ne-cantidad').value) || 1;
  const proveedorId = document.getElementById('ne-proveedor').value || null;
  const telefono = document.getElementById('ne-telefono').value.trim();
  const total = parseFloat(document.getElementById('ne-total').value) || null;
  const sena = parseFloat(document.getElementById('ne-sena').value) || 0;
  const medioPago = document.getElementById('ne-medio-pago').value;

  if (!numeroSobre) {
    msgBox.innerHTML = `<div class="msg msg-error">Falta el N° de sobre.</div>`;
    return;
  }
  if (!nombreCliente) {
    msgBox.innerHTML = `<div class="msg msg-error">Falta el nombre del cliente.</div>`;
    return;
  }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  // IMPORTANTE: todo el guardado va envuelto en try/catch. Si se corta la conexión a mitad de
  // camino (wifi débil, etc.), esto lo agarra y avisa bien claro en vez de dejar la pantalla en
  // un estado ambiguo donde no se sabe si se guardó o no.
  try {

  // 1) Buscar si el cliente ya existe (por nombre, sin importar mayúsc/minúsc)
  let clienteId;
  const { data: clienteExistente } = await sb
    .from('clientes')
    .select('id')
    .ilike('nombre', nombreCliente)
    .limit(1)
    .maybeSingle();

  if (clienteExistente) {
    clienteId = clienteExistente.id;
    if (telefono) {
      // Solo completa el teléfono si el cliente no tenía uno cargado (no pisa uno ya existente)
      await sb.from('clientes').update({ telefono: telefono }).eq('id', clienteId).is('telefono', null);
    }
  } else {
    const { data: clienteNuevo, error: errCliente } = await sb
      .from('clientes')
      .insert({ nombre: nombreCliente, tipo_cliente: tipoCliente, telefono: telefono || null })
      .select('id')
      .single();
    if (errCliente) {
      msgBox.innerHTML = `<div class="msg msg-error">Error creando cliente: ${errCliente.message}</div>`;
      return;
    }
    clienteId = clienteNuevo.id;
  }

  // 2) Crear el sobre
  const { data: sobreNuevo, error: errSobre } = await sb
    .from('sobres')
    .insert({
      numero: numeroSobre,
      cliente_id: clienteId,
      descripcion: trabajo,
      precio_total: total,
      tipo_cliente: tipoCliente,
      categoria_producto: _productoSeleccionado ? _productoSeleccionado.cat : null,
      cod_producto: _productoSeleccionado ? _productoSeleccionado.cod : null
    })
    .select('id')
    .single();

  if (errSobre) {
    const mensaje = errSobre.code === '23505'
      ? 'Ya existe un sobre con ese número.'
      : errSobre.message;
    msgBox.innerHTML = `<div class="msg msg-error">${mensaje}</div>`;
    return;
  }

  // 2.1) Verificación extra: confirmamos que el sobre quedó de verdad en la base antes de decir
  // que se guardó. Esto agarra el caso raro de que la conexión se corte justo después de que
  // Supabase confirme el guardado pero antes de que la respuesta llegue completa al navegador.
  const { data: chequeo } = await sb.from('sobres').select('id').eq('id', sobreNuevo.id).maybeSingle();
  if (!chequeo) {
    msgBox.innerHTML = `<div class="msg msg-error">⚠️ No se pudo confirmar el guardado (puede haberse cortado la conexión). Probá buscar el sobre ${numeroSobre} antes de cargarlo de nuevo.</div>`;
    return;
  }

  // 3) Registrar el movimiento de caja.
  //    - Si es CUENTA CORRIENTE: se registra con el precio total como monto (aunque no se haya
  //      cobrado nada en el momento) — así queda la deuda reflejada en Caja del Día.
  //    - Para cualquier otro caso (incluso si sena = 0, ej: consumidor final que paga recién al
  //      retirar): SIEMPRE se registra el movimiento igual, con el monto que corresponda (puede
  //      ser $0). Así el sobre aparece en Caja del Día desde el momento de la entrada, y no recién
  //      cuando el cliente viene a pagar y retirar.
  if (medioPago === 'CUENTA CORRIENTE' && total > 0) {
    await sb.from('movimientos_caja').insert({
      vendedora: usuarioActual.nombre,
      descripcion: trabajo || ('sobre ' + numeroSobre),
      ingresa_egresa: 'INGRESA',
      tipo_cliente: tipoCliente,
      medio_pago: 'CUENTA CORRIENTE',
      monto: total,
      cantidad: cantidad,
      cliente_id: clienteId,
      sobre_id: sobreNuevo.id,
      codigo: tipoProducto ? parseInt(tipoProducto) : null,
      proveedor_id: proveedorId
    });
  } else {
    await sb.from('movimientos_caja').insert({
      vendedora: usuarioActual.nombre,
      descripcion: sena > 0 ? ('seña sobre ' + numeroSobre) : ('sobre ' + numeroSobre + ' - sin seña, paga al retirar'),
      ingresa_egresa: 'INGRESA',
      tipo_cliente: tipoCliente,
      medio_pago: medioPago,
      monto: sena,
      cantidad: cantidad,
      cliente_id: clienteId,
      sobre_id: sobreNuevo.id,
      codigo: tipoProducto ? parseInt(tipoProducto) : null,
      proveedor_id: proveedorId
    });
  }

  // 4) Historial
  await sb.from('historial_sobres').insert({
    sobre_id: sobreNuevo.id,
    evento: 'ENTRADA',
    detalle: 'Ingresó al local (dio entrada: ' + usuarioActual.nombre + ')'
  });

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Sobre ${numeroSobre} guardado correctamente.</div>`;
  document.getElementById('ne-sobre').value = '';
  document.getElementById('ne-cliente').value = '';
  document.getElementById('ne-trabajo').value = '';
  document.getElementById('ne-total').value = '';
  document.getElementById('ne-sena').value = '';
  document.getElementById('ne-telefono').value = '';
  document.getElementById('ne-tipo-producto').value = '';
  document.getElementById('ne-cantidad').value = '1';
  document.getElementById('ne-proveedor').value = '';
  
  _productoSeleccionado = null;

  } catch (err) {
    msgBox.innerHTML = `<div class="msg msg-error">⚠️ Se cortó la conexión mientras guardaba. Puede que NO se haya guardado — buscá el sobre ${numeroSobre} antes de cargarlo de nuevo, para no duplicarlo. (${err.message || err})</div>`;
  }
}
window.guardarNuevaEntrada = guardarNuevaEntrada;

let _timeoutBuscarSobresEtapa = null;

async function buscarSobresPendientesEtapa(idInput, idResultado, idDestino, esRegreso) {
  clearTimeout(_timeoutBuscarSobresEtapa);
  const termino = document.getElementById(idInput).value.trim();
  const resBox = document.getElementById(idResultado);
  if (termino.length < 2) { resBox.innerHTML = ''; return; }

  _timeoutBuscarSobresEtapa = setTimeout(async () => {
    resBox.innerHTML = `<div class="msg">Buscando...</div>`;

    let consulta = sb.from('sobres').select('numero, descripcion, clientes(nombre)').is('fecha_salida', null).limit(8);
    consulta = esRegreso ? consulta.not('baja_taller', 'is', null).is('listo', null) : consulta.is('baja_taller', null);

    const { data: porNumero } = await consulta.ilike('numero', '%' + termino + '%');

    let porCliente = [];
    if (isNaN(termino)) {
      const { data: clientesMatch } = await sb.from('clientes').select('id').ilike('nombre', '%' + termino + '%').limit(10);
      if (clientesMatch && clientesMatch.length > 0) {
        const ids = clientesMatch.map(c => c.id);
        let consulta2 = sb.from('sobres').select('numero, descripcion, clientes(nombre)').is('fecha_salida', null).in('cliente_id', ids).limit(8);
        consulta2 = esRegreso ? consulta2.not('baja_taller', 'is', null).is('listo', null) : consulta2.is('baja_taller', null);
        const { data } = await consulta2;
        porCliente = data || [];
      }
    }

    const combinados = [...(porNumero || []), ...porCliente];
    const vistos = new Set();
    const unicos = combinados.filter(s => vistos.has(s.numero) ? false : (vistos.add(s.numero), true));

    if (unicos.length === 0) { resBox.innerHTML = `<div class="vacio">Sin resultados</div>`; return; }

    resBox.innerHTML = unicos.map(s => `
      <div class="lista-sobre" style="cursor:pointer; padding:8px 10px;" onclick="agregarNumeroASobres('${idDestino}', '${s.numero}')">
        <div class="nro" style="font-size:14px;">#${s.numero} — ${s.clientes ? s.clientes.nombre : ''}</div>
        <div class="cli" style="font-size:12px;">${s.descripcion || ''}</div>
      </div>
    `).join('');
  }, 250);
}
window.buscarSobresPendientesEtapa = buscarSobresPendientesEtapa;

async function cargarTodosPendientesEtapa(idResultado, idDestino, esRegreso) {
  const resBox = document.getElementById(idResultado);
  resBox.innerHTML = `<div class="msg">Cargando...</div>`;

  let consulta = sb.from('sobres').select('numero, descripcion, clientes(nombre)').is('fecha_salida', null);
  consulta = esRegreso ? consulta.not('baja_taller', 'is', null).is('listo', null) : consulta.is('baja_taller', null);
  const { data, error } = await consulta.order('created_at');

  if (error) { resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  if (!data || data.length === 0) { resBox.innerHTML = `<div class="vacio">No hay ninguno pendiente 🎉</div>`; return; }

  resBox.innerHTML = data.map(s => `
    <div class="lista-sobre" style="cursor:pointer; padding:8px 10px;" onclick="agregarNumeroASobres('${idDestino}', '${s.numero}')">
      <div class="nro" style="font-size:14px;">#${s.numero} — ${s.clientes ? s.clientes.nombre : ''}</div>
      <div class="cli" style="font-size:12px;">${s.descripcion || ''}</div>
    </div>
  `).join('');
}
window.cargarTodosPendientesEtapa = cargarTodosPendientesEtapa;

async function bajarATallerLote() {
  const resBox = document.getElementById('bt-resultado');
  const numeros = document.getElementById('bt-sobres').value.trim().split(/[\s,]+/).filter(n => n);
  const orfebre = document.getElementById('bt-orfebre').value;

  if (numeros.length === 0) { resBox.innerHTML = `<div class="msg msg-error">Escribí al menos un N° de sobre.</div>`; return; }

  resBox.innerHTML = `<div class="msg">Guardando...</div>`;
  const ok = [], errores = [];

  for (const numero of numeros) {
    const { data: sobre, error: errBuscar } = await sb
      .from('sobres')
      .select('id, baja_taller, fecha_salida')
      .eq('numero', normalizarSobre(numero))
      .maybeSingle();

    if (errBuscar || !sobre) { errores.push(numero + ' (no existe)'); continue; }
    if (sobre.fecha_salida) { errores.push(numero + ' (ya retirado)'); continue; }
    if (sobre.baja_taller) { errores.push(numero + ' (ya estaba en taller)'); continue; }

    const { error } = await sb
      .from('sobres')
      .update({ baja_taller: new Date().toISOString(), orfebre: orfebre })
      .eq('id', sobre.id);

    if (error) { errores.push(numero + ' (error al guardar)'); continue; }

    await sb.from('historial_sobres').insert({
      sobre_id: sobre.id,
      evento: 'BAJA A TALLER',
      detalle: 'Asignado a ' + orfebre + ' (lo bajó: ' + usuarioActual.nombre + ')'
    });
    ok.push(numero);
  }

  resBox.innerHTML = `
    ${ok.length > 0 ? `<div class="msg msg-ok">✅ Bajados a ${orfebre}: ${ok.join(', ')}</div>` : ''}
    ${errores.length > 0 ? `<div class="msg msg-error">⚠️ No se pudieron bajar: ${errores.join(', ')}</div>` : ''}
  `;
  document.getElementById('bt-sobres').value = '';
}

async function marcarListo(sobreId, numero) {
  const msgBox = document.getElementById('msg-' + sobreId);
  const retorno = document.getElementById('retorno-' + sobreId).checked;
  const derivaInput = document.getElementById('deriva-' + sobreId);
  const deriva = derivaInput ? derivaInput.value : '';
  const precioInput = document.getElementById('precio-' + sobreId);
  const itemsInput = document.getElementById('items-' + sobreId);

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  if (retorno) {
    await sb.from('historial_sobres').insert({
      sobre_id: sobreId,
      evento: 'RETORNO',
      detalle: 'Vuelve con el mismo orfebre (controlado por ' + usuarioActual.nombre + ')'
    });
    msgBox.innerHTML = `<div class="msg msg-ok">✅ Registrado, vuelve a taller.</div>`;
    return;
  }

  // Deriva a otro orfebre/etapa (Daniel, Pachula, Diseño, Grabado o Laureano): no queda "listo"
  // todavía, solo cambia quién lo tiene ahora. Sigue en la cola de "Regreso" hasta que ese
  // orfebre lo termine y alguien lo controle de nuevo.
  if (deriva) {
    const { error } = await sb.from('sobres').update({ orfebre: deriva }).eq('id', sobreId);
    if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
    await sb.from('historial_sobres').insert({
      sobre_id: sobreId,
      evento: 'REASIGNADO',
      detalle: 'Pasó a ' + deriva + ' (controlado por ' + usuarioActual.nombre + ')'
    });
    msgBox.innerHTML = `<div class="msg msg-ok">✅ Sobre ${numero} pasó a ${deriva}.</div>`;
    return;
  }

  let items = [];
  let precio = precioInput ? parseFloat(precioInput.value) || null : null;
  if (itemsInput && itemsInput.value.trim()) {
    const lineas = itemsInput.value.split('\n').map(l => l.trim()).filter(l => l);
    items = lineas.map(linea => {
      const m = linea.match(/^(.*\S)\s*[-–:]?\s*([\d.,]*\d)\s*$/);
      if (!m) return { descripcion: linea, precio: 0 };
      const descripcion = m[1].replace(/[-–:]\s*$/, '').trim();
      const precioNum = parseFloat(m[2].replace(/\./g, '').replace(',', '.')) || 0;
      return { descripcion: descripcion, precio: precioNum };
    });
    precio = items.reduce((acc, it) => acc + it.precio, 0);
  }

  const cambios = { listo: new Date().toISOString(), controlado_por: usuarioActual.nombre };
  if (precio) cambios.precio_total = precio;

  const { error } = await sb.from('sobres').update(cambios).eq('id', sobreId);
  if (error) {
    msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`;
    return;
  }

  if (items.length > 0) {
    await sb.from('items_sobre').insert(items.map(it => ({ sobre_id: sobreId, descripcion: it.descripcion, precio: it.precio })));
  }

  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'LISTO PARA RETIRAR',
    detalle: 'Controlado por ' + usuarioActual.nombre
  });

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Sobre ${numero} marcado como listo.</div>`;
}
window.marcarListo = marcarListo;

function filaRetiro(s, pagadoPorSobre) {
  const total = Number(s.precio_total) || 0;
  const pagado = pagadoPorSobre[s.id] || 0;
  const saldo = Math.max(0, total - pagado);
  return `
    <div class="lista-sobre" id="fila-${s.id}">
      <div class="nro">#${s.numero}</div>
      <div class="cli">${s.clientes ? s.clientes.nombre : '(sin cliente)'}</div>
      <div class="desc">${s.descripcion || ''}</div>
      <div style="font-weight:700; margin-bottom:8px;">Saldo: $${saldo.toLocaleString('es-AR')}</div>
      <select id="medio-${s.id}">
        <option>EFECTIVO</option>
        <option>TARJETA FISER</option>
        <option>TRANSFERENCIA SANTANDER</option>
        <option>MERCADO PAGO FISER</option>
        <option>MERCADO PAGO LAUREANO</option>
        <option>UALA CARLA</option>
        <option>LEMON LAUREANO</option>
        <option>CUENTA CORRIENTE</option>
      </select>
      <button class="btn btn-verde" onclick='confirmarRetiro(${JSON.stringify(s.id)}, ${JSON.stringify(s.numero)}, ${saldo}, ${JSON.stringify(s.tipo_cliente || 'CONSUMIDOR_FINAL')}, ${JSON.stringify(s.clientes ? s.clientes.nombre : '')}, ${JSON.stringify(s.clientes ? s.clientes.telefono : '')})'>Confirmar cobro y entregar</button>
      <div id="msg-${s.id}"></div>
    </div>
  `;
}

async function pagadoPorSobres(ids) {
  if (!ids || ids.length === 0) return {};
  const { data: pagos } = await sb.from('movimientos_caja').select('sobre_id, monto').in('sobre_id', ids).eq('ingresa_egresa', 'INGRESA');
  const mapa = {};
  (pagos || []).forEach(p => { mapa[p.sobre_id] = (mapa[p.sobre_id] || 0) + Number(p.monto); });
  return mapa;
}

let _timeoutBuscarRetiro = null;

function buscarSobresListosParaRetiro() {
  clearTimeout(_timeoutBuscarRetiro);
  const termino = document.getElementById('rt-buscar').value.trim();
  const resBox = document.getElementById('rt-resultado');
  document.getElementById('rt-todos').innerHTML = '';
  if (termino.length < 2) { resBox.innerHTML = ''; return; }

  _timeoutBuscarRetiro = setTimeout(async () => {
    resBox.innerHTML = `<div class="msg">Buscando...</div>`;

    let consulta = sb.from('sobres').select('id, numero, descripcion, precio_total, tipo_cliente, clientes(nombre, telefono)')
      .is('fecha_salida', null).limit(8);
    const { data: porNumero } = await consulta.ilike('numero', '%' + termino + '%');

    let porCliente = [];
    if (isNaN(termino)) {
      const { data: clientesMatch } = await sb.from('clientes').select('id').ilike('nombre', '%' + termino + '%').limit(10);
      if (clientesMatch && clientesMatch.length > 0) {
        const ids = clientesMatch.map(c => c.id);
        const { data } = await sb.from('sobres').select('id, numero, descripcion, precio_total, tipo_cliente, clientes(nombre, telefono)')
          .is('fecha_salida', null).in('cliente_id', ids).limit(8);
        porCliente = data || [];
      }
    }

    const combinados = [...(porNumero || []), ...porCliente];
    const vistos = new Set();
    const sobres = combinados.filter(s => vistos.has(s.id) ? false : (vistos.add(s.id), true));

    if (sobres.length === 0) { resBox.innerHTML = `<div class="vacio">Sin resultados</div>`; return; }

    const pagadoPorSobre = await pagadoPorSobres(sobres.map(s => s.id));
    resBox.innerHTML = sobres.map(s => filaRetiro(s, pagadoPorSobre)).join('');
  }, 250);
}
window.buscarSobresListosParaRetiro = buscarSobresListosParaRetiro;

async function mostrarTodosLosListos() {
  const box = document.getElementById('rt-todos');
  box.innerHTML = `<div class="msg">Cargando...</div>`;

  const { data: sobres, error } = await sb
    .from('sobres')
    .select('id, numero, descripcion, precio_total, tipo_cliente, clientes(nombre, telefono)')
    .is('fecha_salida', null)
    .order('created_at');

  if (error) { box.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  if (sobres.length === 0) { box.innerHTML = `<div class="vacio">No hay sobres pendientes de retirar 🎉</div>`; return; }

  const pagadoPorSobre = await pagadoPorSobres(sobres.map(s => s.id));
  box.innerHTML = sobres.map(s => filaRetiro(s, pagadoPorSobre)).join('');
}
window.mostrarTodosLosListos = mostrarTodosLosListos;

async function confirmarRetiro(sobreId, numero, saldo, tipoCliente, nombreCliente, telefonoCliente) {
  const msgBox = document.getElementById('msg-' + sobreId);
  const medioPago = document.getElementById('medio-' + sobreId).value;
  const esCuentaCorriente = medioPago === 'CUENTA CORRIENTE';
  const montoCobrado = esCuentaCorriente ? 0 : saldo;

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { data: sobreData, error: errFecha } = await sb
    .from('sobres')
    .update({ fecha_salida: new Date().toISOString() })
    .eq('id', sobreId)
    .select('cliente_id')
    .single();

  if (errFecha) {
    msgBox.innerHTML = `<div class="msg msg-error">${errFecha.message}</div>`;
    return;
  }

  if (montoCobrado > 0) {
    await sb.from('movimientos_caja').insert({
      vendedora: usuarioActual.nombre,
      descripcion: 'cobro saldo sobre ' + numero,
      ingresa_egresa: 'INGRESA',
      tipo_cliente: tipoCliente,
      medio_pago: medioPago,
      monto: montoCobrado,
      cliente_id: sobreData.cliente_id,
      sobre_id: sobreId
    });
  }

  const detalle = esCuentaCorriente
    ? 'Se lo llevó, queda en cuenta corriente'
    : (montoCobrado > 0 ? 'Retirado y cobrado $' + montoCobrado : 'Retirado, sin saldo pendiente');

  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'RETIRADO',
    detalle: detalle + ' (entregó: ' + usuarioActual.nombre + ')'
  });

  const mensajeWa = esCuentaCorriente
    ? `Hola${nombreCliente ? ' ' + nombreCliente : ''}! Te avisamos que tu pedido N° ${numero} en Joyería Tándem fue retirado. Queda un saldo de $${saldo.toLocaleString('es-AR')} en tu cuenta corriente. 💍`
    : `Hola${nombreCliente ? ' ' + nombreCliente : ''}! Te avisamos que tu pedido N° ${numero} en Joyería Tándem fue retirado y pagado correctamente. ¡Gracias por tu confianza! 💍`;

  document.getElementById('fila-' + sobreId).innerHTML = `
    <div class="msg msg-ok">✅ Sobre ${numero} retirado.</div>
    ${botonWhatsApp(telefonoCliente, mensajeWa)}
  `;
}
window.confirmarRetiro = confirmarRetiro;

async function verCuentaCliente(clienteId, nombreCliente) {
  render(`${pintarUsuarioActual()}<div class="card"><p>Cargando cuenta de ${nombreCliente}...</p></div>`);

  // "COMPRÓ" = TODOS los sobres de este cliente, tengan o no saldo pendiente hoy
  // (igual que la planilla vieja: la columna DEBE suma el total de cada trabajo,
  // independientemente de si ya se retiró o no).
  const { data: sobres } = await sb
    .from('sobres')
    .select('id, numero, descripcion, precio_total, fecha_entrada')
    .eq('cliente_id', clienteId)
    .order('fecha_entrada');

  // "FUE PAGANDO" = todos los pagos a cuenta (código 502), sea que se hayan
  // aplicado a un sobre puntual o como pago suelto.
  const { data: pagos } = await sb
    .from('movimientos_caja')
    .select('monto, fecha, descripcion, sobre_id')
    .eq('cliente_id', clienteId)
    .eq('ingresa_egresa', 'INGRESA')
    .eq('codigo', 502)
    .order('fecha');

  const debe = (sobres || []).reduce((acc, s) => acc + (Number(s.precio_total) || 0), 0);
  const haber = (pagos || []).reduce((acc, p) => acc + Number(p.monto), 0);
  const saldo = debe - haber;

  const filasCompras = (sobres || []).length === 0
    ? `<div class="vacio">Sin compras registradas</div>`
    : sobres.map(s => `
        <div class="lista-sobre">
          <div class="nro">#${s.numero} — $${(Number(s.precio_total) || 0).toLocaleString('es-AR')}</div>
          <div class="cli">${s.fecha_entrada ? new Date(s.fecha_entrada).toLocaleDateString('es-AR') : ''}</div>
          <div class="desc">${s.descripcion || ''}</div>
        </div>
      `).join('');

  const filasPagos = (pagos || []).length === 0
    ? `<div class="vacio">Sin pagos registrados</div>`
    : pagos.map(p => `
        <div class="lista-sobre">
          <div class="nro">$${Number(p.monto).toLocaleString('es-AR')}</div>
          <div class="cli">${new Date(p.fecha).toLocaleDateString('es-AR')}</div>
          <div class="desc">${p.descripcion || ''}</div>
        </div>
      `).join('');

  render(`
    ${pintarUsuarioActual()}
    <div class="card">
      <h1>${nombreCliente}</h1>
      <div class="sub">Cuenta corriente</div>

      <div class="lista-sobre" style="background:#f7f7f7;">
        <div>Le vendimos a crédito (debe): <strong>$${debe.toLocaleString('es-AR')}</strong></div>
        <div>Nos pagó (haber): <strong>$${haber.toLocaleString('es-AR')}</strong></div>
        <div style="font-size:20px; font-weight:700; color:${saldo > 0 ? '#993c1d' : '#27500a'}; margin-top:6px;">
          ${saldo > 0 ? 'Saldo que nos debe: $' + saldo.toLocaleString('es-AR') : (saldo < 0 ? 'Tiene a favor: $' + Math.abs(saldo).toLocaleString('es-AR') : 'Cuenta al día ($0)')}
        </div>
      </div>

      <label style="margin-top:18px;">🛒 Compró (a crédito)</label>
      ${filasCompras}

      <label style="margin-top:18px;">💵 Fue pagando</label>
      ${filasPagos}

      <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">

      <label>Registrar un pago a cuenta</label>
      <input type="number" id="cc-monto" placeholder="Monto que paga">
      <select id="cc-medio">
        <option>EFECTIVO</option>
        <option>TARJETA FISER</option>
        <option>TRANSFERENCIA SANTANDER</option>
        <option>MERCADO PAGO FISER</option>
        <option>MERCADO PAGO LAUREANO</option>
        <option>UALA CARLA</option>
        <option>LEMON LAUREANO</option>
      </select>
      <button class="btn btn-verde" onclick="registrarPagoCC('${clienteId}', '${nombreCliente.replace(/'/g, "\\'")}')">Registrar pago</button>
      <div id="cc-pago-msg"></div>

      <button class="btn btn-outline" style="margin-top:10px;" onclick="pantallaCuentaCorriente()">← Buscar otro cliente</button>
    </div>
  `);
}

async function mostrarSobresParaBoleta(clienteId, nombreCliente, telefono) {
  const resBox = document.getElementById('gb-resultado');
  resBox.innerHTML = `<div class="msg">Cargando sobres de ${nombreCliente}...</div>`;

  const { data: sobres } = await sb
    .from('sobres')
    .select('id, numero, descripcion, precio_total')
    .eq('cliente_id', clienteId)
    .is('fecha_salida', null);

  if (!sobres || sobres.length === 0) {
    resBox.innerHTML = `<div class="vacio">${nombreCliente} no tiene sobres pendientes de retirar.</div>`;
    return;
  }

  const { data: pagos } = await sb
    .from('movimientos_caja')
    .select('sobre_id, monto')
    .in('sobre_id', sobres.map(s => s.id))
    .eq('ingresa_egresa', 'INGRESA');

  const pagadoPorSobre = {};
  (pagos || []).forEach(p => { pagadoPorSobre[p.sobre_id] = (pagadoPorSobre[p.sobre_id] || 0) + Number(p.monto); });

  const filas = sobres.map(s => {
    const saldo = Math.max(0, (Number(s.precio_total) || 0) - (pagadoPorSobre[s.id] || 0));
    return `
      <div class="lista-sobre">
        <label style="font-weight:400; display:flex; align-items:center; gap:8px;">
          <input type="checkbox" class="chk-boleta" data-sobre="${s.id}" data-saldo="${saldo}" style="width:auto;">
          <span><strong>#${s.numero}</strong> — ${s.descripcion || ''} — $${saldo.toLocaleString('es-AR')}</span>
        </label>
      </div>
    `;
  }).join('');

  resBox.innerHTML = `
    ${filas}
    <button class="btn btn-verde" style="margin-top:10px;"
      onclick='confirmarGenerarBoleta(${JSON.stringify(clienteId)}, ${JSON.stringify(nombreCliente)}, ${JSON.stringify(telefono)})'>
      Generar boleta con los seleccionados
    </button>
    <div id="gb-msg"></div>
  `;
}
window.mostrarSobresParaBoleta = mostrarSobresParaBoleta;

async function confirmarGenerarBoleta(clienteId, nombreCliente, telefono) {
  const msgBox = document.getElementById('gb-msg');
  const seleccionados = [...document.querySelectorAll('.chk-boleta:checked')];

  if (seleccionados.length === 0) {
    msgBox.innerHTML = `<div class="msg msg-error">Marcá al menos un sobre.</div>`;
    return;
  }

  msgBox.innerHTML = `<div class="msg">Generando...</div>`;

  const total = seleccionados.reduce((acc, el) => acc + Number(el.dataset.saldo), 0);

  const { data: boleta, error } = await sb
    .from('boletas')
    .insert({ cliente_id: clienteId, total: total, telefono: telefono, estado: 'PENDIENTE' })
    .select('id, numero')
    .single();

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  const filas = seleccionados.map(el => ({ boleta_id: boleta.id, sobre_id: el.dataset.sobre }));
  await sb.from('boleta_sobres').insert(filas);

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Boleta N° ${boleta.numero} generada — Total: $${total.toLocaleString('es-AR')}</div>`;
}

async function marcarBoletaRetirada(boletaId, numeroBoleta, clienteId, nombreCliente, telefonoCliente, totalBoleta) {
  const msgBox = document.getElementById('bb-msg');
  const medioPago = document.getElementById('bb-medio').value;
  const esCuentaCorriente = medioPago === 'CUENTA CORRIENTE';
  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { data: relaciones } = await sb
    .from('boleta_sobres')
    .select('sobres(id, numero, precio_total, tipo_cliente, fecha_salida)')
    .eq('boleta_id', boletaId);

  for (const r of relaciones) {
    const s = r.sobres;
    if (s.fecha_salida) continue;

    await sb.from('sobres').update({ fecha_salida: new Date().toISOString() }).eq('id', s.id);

    const { data: pagos } = await sb.from('movimientos_caja').select('monto').eq('sobre_id', s.id).eq('ingresa_egresa', 'INGRESA');
    const pagado = (pagos || []).reduce((acc, m) => acc + Number(m.monto), 0);
    const saldo = Math.max(0, (Number(s.precio_total) || 0) - pagado);
    const montoCobrado = esCuentaCorriente ? 0 : saldo;

    if (montoCobrado > 0) {
      await sb.from('movimientos_caja').insert({
        vendedora: usuarioActual.nombre,
        descripcion: 'cobro saldo sobre ' + s.numero + ' (boleta ' + numeroBoleta + ')',
        ingresa_egresa: 'INGRESA',
        tipo_cliente: s.tipo_cliente,
        medio_pago: medioPago,
        monto: montoCobrado,
        cliente_id: clienteId,
        sobre_id: s.id
      });
    }

    await sb.from('historial_sobres').insert({
      sobre_id: s.id,
      evento: 'RETIRADO',
      detalle: 'Retirado como parte de la boleta ' + numeroBoleta + ' (entregó: ' + usuarioActual.nombre + ')'
    });
  }

  await sb.from('boletas').update({ estado: 'RETIRADA' }).eq('id', boletaId);

  const mensajeWa = esCuentaCorriente
    ? `Hola${nombreCliente ? ' ' + nombreCliente : ''}! Te avisamos que tu boleta N° ${numeroBoleta} en Joyería Tándem fue retirada. Queda un saldo de $${totalBoleta.toLocaleString('es-AR')} en tu cuenta corriente. 💍`
    : `Hola${nombreCliente ? ' ' + nombreCliente : ''}! Te avisamos que tu boleta N° ${numeroBoleta} en Joyería Tándem fue retirada y pagada correctamente. ¡Gracias por tu confianza! 💍`;

  msgBox.innerHTML = `
    <div class="msg msg-ok">✅ Boleta completa, todos los sobres retirados.</div>
    ${botonWhatsApp(telefonoCliente, mensajeWa)}
  `;
}
window.marcarBoletaRetirada = marcarBoletaRetirada;

function etiquetaTipoCliente(tipo) {
  if (tipo === 'MAYORISTA') return 'Mayorista';
  if (tipo === 'TALLER') return 'Taller';
  if (tipo === 'CONSUMIDOR_FINAL') return 'Por menor';
  return '';
}

function fechaHoyISO() {
  const hoy = new Date();
  const offset = hoy.getTimezoneOffset();
  const local = new Date(hoy.getTime() - offset * 60000);
  return local.toISOString().slice(0, 10);
}

function toggleAperturaCaja() {
  const box = document.getElementById('cd-apertura-box');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

// Guarda cuánto efectivo había en el cajón al arrancar el día. Se registra como un movimiento
// especial (código 100, igual que en el sistema viejo de Sheets) para que se sume solo al
// "Efectivo en caja" del día, sin mezclarse con las ventas reales del día.
async function guardarAperturaCaja() {
  const fecha = document.getElementById('cd-fecha').value;
  const monto = parseFloat(document.getElementById('cd-apertura-monto').value);
  const msgBox = document.getElementById('cd-apertura-msg');
  if (isNaN(monto) || monto < 0) { msgBox.innerHTML = `<div class="msg msg-error">Poné un monto válido.</div>`; return; }

  // ARREGLADO (03/09/2026): si la app quedó abierta desde el día anterior sin recargar,
  // el campo de fecha se queda pegado en la fecha vieja. Antes esto guardaba la apertura
  // en la fecha equivocada sin ningún aviso (pasó el 3/9: se guardó con fecha 2/9).
  // Ahora, si la fecha elegida no es la de HOY, se pide confirmación explícita antes de guardar.
  const fechaReal = fechaHoyISO();
  if (fecha !== fechaReal) {
    const seguro = confirm(`Ojo: vas a guardar la apertura para el ${fecha.split('-').reverse().join('/')}, pero HOY es ${fechaReal.split('-').reverse().join('/')}.\n\n¿Seguro que querés guardarla en esa fecha? (Si la app quedó abierta desde ayer, tocá Cancelar, recargá la página y volvé a intentar.)`);
    if (!seguro) { msgBox.innerHTML = `<div class="msg msg-error">Cancelado. Recargá la página (👆 deslizá para actualizar o tocá el botón atrás y volvé a entrar) para que tome la fecha de hoy.</div>`; return; }
  }

  // Si ya había una apertura cargada ese día, la reemplaza (borra la vieja, guarda la nueva)
  await sb.from('movimientos_caja').delete().eq('fecha', fecha).eq('codigo', 100);

  const { error } = await sb.from('movimientos_caja').insert({
    fecha: fecha,
    vendedora: usuarioActual.nombre,
    descripcion: 'Apertura de caja',
    ingresa_egresa: 'INGRESA',
    medio_pago: 'EFECTIVO',
    monto: monto,
    codigo: 100
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  msgBox.innerHTML = `<div class="msg msg-ok">✅ Apertura guardada: $${monto.toLocaleString('es-AR')}</div>`;
  document.getElementById('cd-apertura-box').style.display = 'none';
  cargarCajaDelDia();
}
window.toggleAperturaCaja = toggleAperturaCaja;
window.guardarAperturaCaja = guardarAperturaCaja;

        <tbody>${filasTabla}</tbody>
      </table>
    </div>
  `;
  return { lista: filasMovimientos, tabla };
}

function filtrarCajaDelDia() {
  const inputEl = document.getElementById('cd-buscar');
  const q = (inputEl ? inputEl.value : '').trim().toLowerCase();
  const todos = window._movimientosCajaActual || [];
  const filtrados = q === '' ? todos : todos.filter(m => {
    const nombreCliente = m.clientes ? m.clientes.nombre.toLowerCase() : '';
    const vendedora = (m.vendedora || '').toLowerCase();
    const desc = (m.descripcion || '').toLowerCase();
    return nombreCliente.includes(q) || vendedora.includes(q) || desc.includes(q);
  });
  const { lista, tabla } = renderFilasMovimientosCD(filtrados);
  const contador = document.getElementById('cd-contador');
  if (contador) contador.textContent = `Movimientos (${filtrados.length}${q ? ' de ' + todos.length : ''})`;
  const listaBox = document.getElementById('cd-lista-movimientos');
  if (listaBox) listaBox.innerHTML = lista;
  const tablaBox = document.getElementById('cd-tabla-movimientos');
  if (tablaBox) tablaBox.innerHTML = tabla;
}
window.filtrarCajaDelDia = filtrarCajaDelDia;

  }

  const { data: provs } = await sb.from('proveedores').select('id, nombre').order('nombre');
  const selProv = document.getElementById('em-proveedor');
  if (provs) {
    selProv.innerHTML = '<option value="">— Sin especificar —</option>' +

window.pantallaEditarMovimiento = pantallaEditarMovimiento;

async function guardarCorreccionMovimiento(id) {
  const msgBox = document.getElementById('em-msg');
  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const tipoProducto = document.getElementById('em-tipo-producto').value;
  const proveedorId = document.getElementById('em-proveedor').value || null;

  const { error } = await sb.from('movimientos_caja').update({
    descripcion: document.getElementById('em-descripcion').value.trim(),
    monto: parseFloat(document.getElementById('em-monto').value) || 0,
    cantidad: parseInt(document.getElementById('em-cantidad').value) || 1,
    medio_pago: document.getElementById('em-medio').value,
    codigo: tipoProducto ? parseInt(tipoProducto) : null,
    proveedor_id: proveedorId
  }).eq('id', id);

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  msgBox.innerHTML = `<div class="msg msg-ok">✅ Corregido.</div>`;
}
window.guardarCorreccionMovimiento = guardarCorreccionMovimiento;

async function confirmarBorrarMovimiento(id) {
  if (!confirm('¿Seguro que querés borrar este movimiento? No se puede deshacer.')) return;
  const { error } = await sb.from('movimientos_caja').delete().eq('id', id);
  if (error) { document.getElementById('em-msg').innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  pantallaCajaDelDia();
}
window.confirmarBorrarMovimiento = confirmarBorrarMovimiento;

async function cargarCajaDelDia() {
  const fecha = document.getElementById('cd-fecha').value;
  const resBox = document.getElementById('cd-resultado');
  resBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const { data: movimientos, error } = await sb
    .from('movimientos_caja')
    .select('id, vendedora, descripcion, ingresa_egresa, medio_pago, monto, cantidad, codigo, tipo_cliente, created_at, clientes(nombre)')
    .eq('fecha', fecha)
    .order('created_at');

  if (error) {
    resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`;
    return;
  }

  if (!movimientos || movimientos.length === 0) {
    resBox.innerHTML = `<div class="vacio">Sin movimientos registrados ese día</div>`;
    return;
  }

  let totalIngresa = 0, totalEgresa = 0, totalRetiros = 0, apertura = 0;
  const porMedioIngresa = {};
  const porMedioEgresa = {};
  movimientos.forEach(m => {
    const monto = Number(m.monto) || 0;
    const medio = m.medio_pago || '(sin medio)';
    if (Number(m.codigo) === 100) {
      apertura += monto;
      return; // la apertura no cuenta como "venta del día", solo suma al efectivo en caja
    }
    if (m.ingresa_egresa === 'INGRESA') {
      totalIngresa += monto;
      porMedioIngresa[medio] = (porMedioIngresa[medio] || 0) + monto;
    } else {
      totalEgresa += monto;
      porMedioEgresa[medio] = (porMedioEgresa[medio] || 0) + monto;
      if (Number(m.codigo) === 550) totalRetiros += monto;
    }
  });

  const efectivoNetoHoy = apertura + (porMedioIngresa['EFECTIVO'] || 0) - (porMedioEgresa['EFECTIVO'] || 0);

  const todosLosMedios = [...new Set([...Object.keys(porMedioIngresa), ...Object.keys(porMedioEgresa)])];
  const filasMedios = todosLosMedios.length === 0
    ? ''
    : todosLosMedios.map(medio => {
        const neto = (porMedioIngresa[medio] || 0) - (porMedioEgresa[medio] || 0);
        return `
        <div style="display:flex; justify-content:space-between; padding:4px 0;">
          <span>${medio}</span><strong>$${neto.toLocaleString('es-AR')}</strong>
        </div>
      `;
      }).join('');

  window._movimientosCajaActual = movimientos;
  const { lista: filasMovimientos, tabla: tablaCaja } = renderFilasMovimientosCD(movimientos);

  window._efectivoNetoHoyActual = efectivoNetoHoy;
  window._fechaCajaActual = fecha;

  resBox.innerHTML = `
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
      <div class="lista-sobre" style="text-align:center; padding:12px;">
        <div style="font-size:11px; color:#8a8378; margin-bottom:4px;">Total de ingresos hoy</div>
        <div style="font-size:19px; font-weight:700; color:#2f6d1f;">$${totalIngresa.toLocaleString('es-AR')}</div>
      </div>
      <div class="lista-sobre" style="text-align:center; padding:12px;">
        <div style="font-size:11px; color:#8a8378; margin-bottom:4px;">Total de egresos hoy</div>
        <div style="font-size:19px; font-weight:700; color:#9a3a1e;">$${totalEgresa.toLocaleString('es-AR')}</div>
      </div>
      <div class="lista-sobre" style="text-align:center; padding:12px;">
        <div style="font-size:11px; color:#8a8378; margin-bottom:4px;">Retiros de efectivo hoy</div>
        <div style="font-size:19px; font-weight:700; color:#9a3a1e;">$${totalRetiros.toLocaleString('es-AR')}</div>
      </div>
      <div style="background:#1a1a1a; border-radius:14px; padding:12px; text-align:center;">
        <div style="font-size:11px; color:#d4af6a; margin-bottom:4px;">Efectivo en caja hoy</div>
        <div style="font-size:19px; font-weight:700; color:#d4af6a;">$${efectivoNetoHoy.toLocaleString('es-AR')}</div>
      </div>
    </div>

    <div style="text-align:right; font-size:13px; color:#8a8378; margin-top:8px;">
      ${apertura > 0 ? `Apertura del día: <strong>$${apertura.toLocaleString('es-AR')}</strong> · ` : ''}Neto del día: <strong style="color:#2c2c2a;">$${(totalIngresa - totalEgresa).toLocaleString('es-AR')}</strong>
    </div>

    <label style="margin-top:16px;">Por medio de pago (ya descontando gastos/retiros de ese medio)</label>
    <div class="lista-sobre">${filasMedios}</div>

    <label style="margin-top:16px;">🔎 Buscar por nombre de cliente</label>
    <input type="text" id="cd-buscar" placeholder="Escribí el nombre..." oninput="filtrarCajaDelDia()">

    <label id="cd-contador" style="margin-top:16px;">Movimientos (${movimientos.length})</label>
    <div class="lista-movil-caja" id="cd-lista-movimientos">${filasMovimientos}</div>
    <div id="cd-tabla-movimientos">${tablaCaja}</div>

    <div style="text-align:center; margin-top:20px;">
      <a href="#" onclick="document.getElementById('cd-contar-box').style.display='block'; this.style.display='none'; return false;" style="font-size:13px; color:#8a8378;">
        🔍 ¿Cambio de turno o fin del día? Contar la caja física
      </a>
    </div>

    <div id="cd-contar-box" class="lista-sobre" style="display:none; margin-top:10px;">
      <div style="font-weight:700; margin-bottom:8px;">🔍 Contar caja física</div>
      <label>¿Cuánto efectivo hay realmente en el cajón?</label>
      <input type="number" id="cd-contado" placeholder="0" oninput="if(this.value) document.getElementById('cd-billetes-box').style.display='none';">

      <div style="text-align:right; margin-top:4px;">
        <a href="#" onclick="document.getElementById('cd-billetes-box').style.display='block'; return false;" style="font-size:13px; color:#3b6d11;">🧮 Contar billete por billete</a>
      </div>

      <div id="cd-billetes-box" style="display:none; margin-top:10px; padding:10px; background:#fafafa; border-radius:8px;">
        ${[20000, 10000, 2000, 1000, 500, 200, 100].map(valor => `
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
            <span style="width:70px; font-weight:600;">$${valor.toLocaleString('es-AR')}</span>
            <span>×</span>
            <input type="number" min="0" class="cd-billete-cantidad" data-valor="${valor}" placeholder="0" oninput="actualizarTotalBilletes()" style="flex:1; padding:8px;">
          </div>
        `).join('')}
        <div style="font-weight:700; margin-top:8px; text-align:right;">Total: $<span id="cd-total-billetes">0</span></div>
        <button class="btn btn-outline" style="margin-top:8px;" onclick="usarTotalBilletes()">Usar este total</button>
      </div>

      <button class="btn btn-outline" style="margin-top:10px;" onclick="compararCaja()">Comparar</button>
      <div id="cd-diferencia-msg"></div>
    </div>
  `;
}
window.cargarCajaDelDia = cargarCajaDelDia;

async function compararCaja() {
  const msgBox = document.getElementById('cd-diferencia-msg');
  const contado = parseFloat(document.getElementById('cd-contado').value);
  if (isNaN(contado)) { msgBox.innerHTML = `<div class="msg msg-error">Poné cuánto contaste.</div>`; return; }

  const esperado = window._efectivoNetoHoyActual || 0;
  const diferencia = contado - esperado;

  if (diferencia === 0) {
    msgBox.innerHTML = `<div class="msg msg-ok">✅ Coincide perfecto, no hay diferencia.</div>`;
    return;
  }

  const tipo = diferencia > 0 ? 'sobra' : 'falta';
  msgBox.innerHTML = `
    <div class="msg msg-error">
      ⚠️ ${tipo === 'sobra' ? 'Sobran' : 'Faltan'} $${Math.abs(diferencia).toLocaleString('es-AR')}
      <div style="margin-top:8px;">
        <button class="btn btn-outline" onclick="registrarDiferenciaCaja(${diferencia})">Registrar esta diferencia</button>
      </div>
    </div>
  `;
}
window.compararCaja = compararCaja;

function actualizarTotalBilletes() {
  const inputs = document.querySelectorAll('.cd-billete-cantidad');
  let total = 0;
  inputs.forEach(inp => {
    const cantidad = parseInt(inp.value) || 0;
    const valor = parseInt(inp.dataset.valor);
    total += cantidad * valor;
  });
  document.getElementById('cd-total-billetes').textContent = total.toLocaleString('es-AR');
}
window.actualizarTotalBilletes = actualizarTotalBilletes;

function usarTotalBilletes() {
  const total = document.getElementById('cd-total-billetes').textContent.replace(/\./g, '');
  document.getElementById('cd-contado').value = total;
  document.getElementById('cd-billetes-box').style.display = 'none';
}
window.usarTotalBilletes = usarTotalBilletes;

async function registrarDiferenciaCaja(diferencia) {
  const msgBox = document.getElementById('cd-diferencia-msg');
  const esFaltante = diferencia < 0;

  const { error } = await sb.from('movimientos_caja').insert({
    vendedora: usuarioActual.nombre,
    codigo: 500,
    descripcion: 'Diferencia de caja detectada (' + (esFaltante ? 'faltante' : 'sobrante') + ')',
    ingresa_egresa: esFaltante ? 'EGRESA' : 'INGRESA',
    medio_pago: 'EFECTIVO',
    monto: Math.abs(diferencia),
    fecha: window._fechaCajaActual
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Diferencia registrada.</div>`;
  cargarCajaDelDia();
}
window.registrarDiferenciaCaja = registrarDiferenciaCaja;

// PANTALLA 10: Pago Parcial — un cliente paga una parte de un
// sobre que TODAVÍA NO retira (no es cuenta corriente, es una
// seña extra sobre un trabajo puntual que sigue en el local).
// ============================================================
function pantallaPagoParcial() {
  render(`
    ${pintarUsuarioActual()}
    <div class="card">
      <h1>Pago parcial</h1>
      <div class="sub">Para un sobre que sigue en el local y el cliente va pagando de a poco</div>
      <label>N° de sobre</label>
      <input type="text" id="pp-numero" placeholder="Ej: 4801">
      <button class="btn btn-verde" onclick="buscarSobreParaPagoParcial()">Buscar</button>
      <div id="pp-resultado"></div>
    </div>
  `);
}
window.pantallaPagoParcial = pantallaPagoParcial;

async function buscarSobreParaPagoParcial() {
  const numero = document.getElementById('pp-numero').value.trim();
  const resBox = document.getElementById('pp-resultado');
  if (!numero) { resBox.innerHTML = ''; return; }
  resBox.innerHTML = `<div class="msg">Buscando...</div>`;

  const { data: s, error } = await sb
    .from('sobres')
    .select('id, numero, descripcion, precio_total, fecha_salida, clientes(nombre)')
    .eq('numero', normalizarSobre(numero))
    .maybeSingle();

  if (error) { resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  if (!s) { resBox.innerHTML = `<div class="vacio">No se encontró ningún sobre con ese número.</div>`; return; }
  if (s.fecha_salida) { resBox.innerHTML = `<div class="msg msg-error">Ese sobre ya fue retirado. Un pago sobre un sobre ya entregado se maneja por Cuenta Corriente, no acá.</div>`; return; }

  const { data: pagos } = await sb
    .from('movimientos_caja')
    .select('monto')
    .eq('sobre_id', s.id)
    .eq('ingresa_egresa', 'INGRESA');

  const pagado = (pagos || []).reduce((acc, p) => acc + Number(p.monto), 0);
  const precioTotal = Number(s.precio_total) || 0;
  const saldo = precioTotal > 0 ? Math.max(0, precioTotal - pagado) : null;

  resBox.innerHTML = `
    <div style="margin-top:16px;">
      <div class="nro" style="font-size:18px;">#${s.numero} — ${s.clientes ? s.clientes.nombre : ''}</div>
      <div class="desc">${s.descripcion || ''}</div>
      <div style="font-weight:700; margin:8px 0;">
        ${precioTotal > 0 ? 'Precio total: $' + precioTotal.toLocaleString('es-AR') + ' · Pagado: $' + pagado.toLocaleString('es-AR') + ' · Saldo: $' + saldo.toLocaleString('es-AR') : 'Este sobre todavía no tiene precio cargado'}
      </div>

      <label>Monto que paga ahora</label>
      <input type="number" id="pp-monto">
      <label>Medio de pago</label>
      <select id="pp-medio">
        <option>EFECTIVO</option>
        <option>TARJETA FISER</option>
        <option>TRANSFERENCIA SANTANDER</option>
        <option>MERCADO PAGO FISER</option>
        <option>MERCADO PAGO LAUREANO</option>
        <option>UALA CARLA</option>
        <option>LEMON LAUREANO</option>
      </select>
      <button class="btn btn-verde" onclick='confirmarPagoParcial(${JSON.stringify(s.id)}, ${JSON.stringify(s.numero)}, ${saldo})'>Registrar pago</button>
      <div id="pp-msg"></div>
    </div>
  `;
}
window.buscarSobreParaPagoParcial = buscarSobreParaPagoParcial;

async function confirmarPagoParcial(sobreId, numero, saldoActual) {
  const msgBox = document.getElementById('pp-msg');
  const monto = parseFloat(document.getElementById('pp-monto').value) || 0;
  const medioPago = document.getElementById('pp-medio').value;

  if (monto <= 0) { msgBox.innerHTML = `<div class="msg msg-error">Poné un monto mayor a cero.</div>`; return; }
  if (saldoActual !== null && monto > saldoActual) {
    msgBox.innerHTML = `<div class="msg msg-error">Ese monto es mayor al saldo pendiente ($${saldoActual.toLocaleString('es-AR')}). Si paga todo, usá Retiro.</div>`;
    return;
  }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { data: sobreData } = await sb.from('sobres').select('cliente_id, tipo_cliente').eq('id', sobreId).single();

  const { error } = await sb.from('movimientos_caja').insert({
    vendedora: usuarioActual.nombre,
    descripcion: 'pago parcial sobre ' + numero,
    ingresa_egresa: 'INGRESA',
    tipo_cliente: sobreData ? sobreData.tipo_cliente : null,
    medio_pago: medioPago,
    monto: monto,
    cliente_id: sobreData ? sobreData.cliente_id : null,
    sobre_id: sobreId
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  const nuevoSaldo = saldoActual !== null ? Math.max(0, saldoActual - monto) : null;

  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'PAGO PARCIAL',
    detalle: 'Pagó $' + monto + ' (' + medioPago + ') — cargado por ' + usuarioActual.nombre + (nuevoSaldo !== null ? '. Saldo restante: $' + nuevoSaldo : '')
  });

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Pago de $${monto.toLocaleString('es-AR')} registrado.${nuevoSaldo !== null ? ' Saldo restante: $' + nuevoSaldo.toLocaleString('es-AR') : ''}</div>`;
}
window.confirmarPagoParcial = confirmarPagoParcial;

async function cargarProveedores(prefix) {
  const select = document.getElementById(prefix + '-proveedor');
  if (!select) return;
  const { data } = await sb.from('proveedores').select('id, nombre').order('nombre');

  select.innerHTML = '<option value="">— Sin especificar —</option>' +
    data.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
}

function toggleNuevoProveedor(prefix) {
  const box = document.getElementById(prefix + '-nuevo-proveedor-box');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  if (box.style.display === 'block') document.getElementById(prefix + '-nuevo-proveedor-nombre').focus();
}
window.toggleNuevoProveedor = toggleNuevoProveedor;

async function guardarNuevoProveedor(prefix) {
  const nombre = document.getElementById(prefix + '-nuevo-proveedor-nombre').value.trim();
  const telefono = document.getElementById(prefix + '-nuevo-proveedor-telefono').value.trim();
  const msgBox = document.getElementById(prefix + '-nuevo-proveedor-msg');
  if (!nombre) { msgBox.innerHTML = `<div class="msg msg-error">Escribí un nombre.</div>`; return; }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { data: existente } = await sb.from('proveedores').select('id').ilike('nombre', nombre).limit(1).maybeSingle();
  if (existente) {
    msgBox.innerHTML = `<div class="msg msg-error">Ya existe un proveedor con ese nombre.</div>`;
    return;
  }

  const { data: nuevo, error } = await sb.from('proveedores').insert({ nombre: nombre, telefono: telefono || null }).select('id').single();
  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Proveedor "${nombre}" agregado.</div>`;
  document.getElementById(prefix + '-nuevo-proveedor-nombre').value = '';
  document.getElementById(prefix + '-nuevo-proveedor-telefono').value = '';
  await cargarProveedores(prefix);
  document.getElementById(prefix + '-proveedor').value = nuevo.id;
  document.getElementById(prefix + '-nuevo-proveedor-box').style.display = 'none';
}

async function guardarEgreso() {
  const msgBox = document.getElementById('eg-msg');
  const codigo = parseInt(document.getElementById('eg-tipo').value) || null;
  const descripcion = document.getElementById('eg-descripcion').value.trim();
  const proveedorId = document.getElementById('eg-proveedor').value || null;
  const monto = parseFloat(document.getElementById('eg-monto').value) || 0;
  const medioPago = document.getElementById('eg-medio').value;

  if (!descripcion) { msgBox.innerHTML = `<div class="msg msg-error">Falta la descripción.</div>`; return; }
  if (monto <= 0) { msgBox.innerHTML = `<div class="msg msg-error">Poné un monto mayor a cero.</div>`; return; }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { error } = await sb.from('movimientos_caja').insert({
    vendedora: usuarioActual.nombre,
    codigo: codigo || null,
    descripcion: descripcion,
    ingresa_egresa: 'EGRESA',
    medio_pago: medioPago,
    monto: monto,
    canal: 'LOCAL',
    proveedor_id: proveedorId
  });

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Egreso de $${monto.toLocaleString('es-AR')} registrado.</div>`;

  document.getElementById('eg-proveedor').value = '';

const MEDIOS_FACTURABLES = ['TARJETA FISER', 'MERCADO PAGO FISER', 'TRANSFERENCIA SANTANDER'];

function mesActualISO() {

async function guardarGastoFijo() {
  const msgBox = document.getElementById('gf-nuevo-msg');
  const nombre = document.getElementById('gf-nombre').value.trim();
  const monto = parseFloat(document.getElementById('gf-monto').value) || null;
  const dia = parseInt(document.getElementById('gf-dia').value) || null;

  if (!nombre) { msgBox.innerHTML = `<div class="msg msg-error">Falta el nombre.</div>`; return; }

function rangoDelMes(mesISO) {
  const [anio, mes] = mesISO.split('-').map(Number);
  const desde = anio + '-' + String(mes).padStart(2, '0') + '-01';
  const siguiente = mes === 12 ? (anio + 1) + '-01-01' : anio + '-' + String(mes + 1).padStart(2, '0') + '-01';
  return { desde, hasta: siguiente };
}

async function cargarReportes() {
  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const resBox = document.getElementById('rp-resumen');
  resBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: movimientos, error } = await sb
    .from('movimientos_caja')
    .select('ingresa_egresa, medio_pago, monto')
    .gte('fecha', desde)
    .lt('fecha', hasta);

  if (error) { resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  const { data: sobresDelMes } = await sb
    .from('sobres')
    .select('id, canal, precio_total')
    .gte('fecha_entrada', desde)
    .lt('fecha_entrada', hasta);

  let ingresos = 0, egresos = 0, facturable = 0, noFacturable = 0;
  (movimientos || []).forEach(m => {
    const monto = Number(m.monto) || 0;
    if (m.ingresa_egresa === 'INGRESA') {
      ingresos += monto;
      if (MEDIOS_FACTURABLES.includes(m.medio_pago)) facturable += monto; else noFacturable += monto;
    } else {
      egresos += monto;
    }
  });

  const porCanal = { LOCAL: { cantidad: 0, total: 0 }, REDES: { cantidad: 0, total: 0 } };
  (sobresDelMes || []).forEach(s => {
    const canal = (s.canal === 'REDES') ? 'REDES' : 'LOCAL';
    porCanal[canal].cantidad += 1;
    porCanal[canal].total += Number(s.precio_total) || 0;
  });

  resBox.innerHTML = `
    <div class="lista-sobre" style="background:#f7f7f7; margin-top:10px;">
      <div>Sobres nuevos este mes: <strong>${(sobresDelMes || []).length}</strong></div>
      <div>Ingresos: <strong style="color:#27500a;">$${ingresos.toLocaleString('es-AR')}</strong></div>
      <div>Egresos: <strong style="color:#993c1d;">$${egresos.toLocaleString('es-AR')}</strong></div>
      <div style="font-size:18px; font-weight:700; margin-top:6px;">Neto: $${(ingresos - egresos).toLocaleString('es-AR')}</div>
    </div>
    <div class="lista-sobre" style="margin-top:10px;">
      <div>💳 Facturable (Tarjeta, MP Fiser, Transferencia): <strong>$${facturable.toLocaleString('es-AR')}</strong></div>
      <div>💵 No facturable (Efectivo, Uala, MP Laureano, etc.): <strong>$${noFacturable.toLocaleString('es-AR')}</strong></div>
    </div>
    <div class="lista-sobre" style="margin-top:10px;">
      <div style="font-weight:700; margin-bottom:6px;">📍 Por canal</div>
      <div>🏪 Local: <strong>${porCanal.LOCAL.cantidad} sobres — $${porCanal.LOCAL.total.toLocaleString('es-AR')}</strong></div>
      <div>📱 Redes: <strong>${porCanal.REDES.cantidad} sobres — $${porCanal.REDES.total.toLocaleString('es-AR')}</strong></div>
    </div>
  `;
}
window.cargarReportes = cargarReportes;

async function cargarMejoresClientes() {
  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const clientesBox = document.getElementById('rp-clientes');
  clientesBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: sobresDelMes, error } = await sb
    .from('sobres')
    .select('precio_total, clientes(id, nombre)')
    .gte('fecha_entrada', desde)
    .lt('fecha_entrada', hasta);

  if (error) { clientesBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  const totalesPorCliente = {};
  (sobresDelMes || []).forEach(s => {
    if (!s.clientes) return;
    const nombre = s.clientes.nombre;
    totalesPorCliente[nombre] = (totalesPorCliente[nombre] || 0) + (Number(s.precio_total) || 0);
  });

  const ranking = Object.entries(totalesPorCliente)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10);

  if (ranking.length === 0) {
    clientesBox.innerHTML = `<div class="vacio">Sin sobres cargados ese mes todavía</div>`;
    return;
  }

  clientesBox.innerHTML = ranking.map(([nombre, total], i) => `
    <div class="lista-sobre">
      <div class="nro">${i + 1}. ${nombre} — $${total.toLocaleString('es-AR')}</div>
    </div>
  `).join('');
}
window.cargarMejoresClientes = cargarMejoresClientes;

async function cargarPorCategoria() {
  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const catBox = document.getElementById('rp-categorias');
  catBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: sobresDelMes, error } = await sb
    .from('sobres')
    .select('categoria_producto, precio_total')
    .gte('fecha_entrada', desde)
    .lt('fecha_entrada', hasta)
    .not('categoria_producto', 'is', null);

  if (error) { catBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  if (!sobresDelMes || sobresDelMes.length === 0) {
    catBox.innerHTML = `<div class="vacio">Sin ventas del catálogo cargadas este mes (esto solo cuenta lo cargado usando "Buscar en el catálogo" en Nueva Entrada)</div>`;
    return;
  }

  const porCategoria = {};
  sobresDelMes.forEach(s => {
    const cat = s.categoria_producto;
    if (!porCategoria[cat]) porCategoria[cat] = { cantidad: 0, total: 0 };
    porCategoria[cat].cantidad += 1;
    porCategoria[cat].total += Number(s.precio_total) || 0;
  });

  const ranking = Object.entries(porCategoria).sort((a, b) => b[1].cantidad - a[1].cantidad);

  catBox.innerHTML = ranking.map(([cat, datos]) => `
    <div class="lista-sobre">
      <div class="nro">${cat}: ${datos.cantidad} ${datos.cantidad === 1 ? 'unidad' : 'unidades'}</div>
      <div class="cli">$${datos.total.toLocaleString('es-AR')}</div>
    </div>
  `).join('');
}
window.cargarPorCategoria = cargarPorCategoria;

async function cargarPorTipoProducto() {
  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const box = document.getElementById('rp-tipo-producto');
  box.innerHTML = `<div class="msg">Cargando...</div>`;

  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: movs, error } = await sb
    .from('movimientos_caja')
    .select('codigo, cantidad, monto')
    .gte('fecha', desde)
    .lt('fecha', hasta)
    .not('codigo', 'is', null);

  if (error) { box.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  if (!movs || movs.length === 0) {
    box.innerHTML = `<div class="vacio">Sin ventas con tipo de producto cargado este mes</div>`;
    return;
  }

  const { data: codigos } = await sb.from('codigos_producto').select('codigo, descripcion');
  const nombreDeCodigo = {};
  (codigos || []).forEach(c => { nombreDeCodigo[c.codigo] = c.descripcion; });

  const porTipo = {};
  movs.forEach(m => {
    const cod = m.codigo;
    if (!porTipo[cod]) porTipo[cod] = { cantidad: 0, total: 0 };
    porTipo[cod].cantidad += Number(m.cantidad) || 1;
    porTipo[cod].total += Number(m.monto) || 0;
  });

  const ranking = Object.entries(porTipo).sort((a, b) => b[1].cantidad - a[1].cantidad);

  box.innerHTML = ranking.map(([cod, datos]) => `
    <div class="lista-sobre">
      <div class="nro">${nombreDeCodigo[cod] || ('Código ' + cod)}: ${datos.cantidad} ${datos.cantidad === 1 ? 'unidad' : 'unidades'}</div>
      <div class="cli">$${datos.total.toLocaleString('es-AR')}</div>
    </div>
  `).join('');
}
window.cargarPorTipoProducto = cargarPorTipoProducto;

async function cargarGastosFijos() {
  const listaBox = document.getElementById('gf-lista');
  listaBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: gastos, error } = await sb.from('gastos_fijos').select('id, nombre, monto_estimado, dia_vencimiento').eq('activo', true).order('nombre');
  if (error) { listaBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  if (!gastos || gastos.length === 0) {
    listaBox.innerHTML = `<div class="vacio">Todavía no cargaste ningún gasto fijo.</div>`;
    return;
  }

  const { data: pagosDelMes } = await sb
    .from('movimientos_caja')
    .select('gasto_fijo_id, monto')
    .not('gasto_fijo_id', 'is', null)
    .gte('fecha', desde)
    .lt('fecha', hasta);

  const pagadoPorGasto = {};
  (pagosDelMes || []).forEach(p => { pagadoPorGasto[p.gasto_fijo_id] = (pagadoPorGasto[p.gasto_fijo_id] || 0) + Number(p.monto); });

  listaBox.innerHTML = gastos.map(g => {
    const pagado = pagadoPorGasto[g.id];
    return `
      <div class="lista-sobre">
        <div class="nro">${g.nombre} ${g.monto_estimado ? '— aprox $' + Number(g.monto_estimado).toLocaleString('es-AR') : ''}</div>
        ${g.dia_vencimiento ? `<div class="cli">Vence el día ${g.dia_vencimiento}</div>` : ''}
        ${pagado
          ? `<div class="msg msg-ok" style="margin-top:6px;">✅ Pagado este mes: $${pagado.toLocaleString('es-AR')}</div>`
          : `
            <div style="display:flex; gap:8px; margin-top:8px;">
              <input type="number" id="gf-pago-${g.id}" placeholder="Monto pagado" style="flex:1;">
              <select id="gf-medio-${g.id}" style="flex:1;">
                <option>EFECTIVO</option>
                <option>TRANSFERENCIA SANTANDER</option>
                <option>MERCADO PAGO FISER</option>
                <option>MERCADO PAGO LAUREANO</option>
                <option>UALA CARLA</option>
              </select>
            </div>
            <button class="btn btn-verde" style="margin-top:8px;" onclick="marcarGastoFijoPagado('${g.id}', '${g.nombre.replace(/'/g, "\\'")}')">Marcar pagado</button>
          `
        }
        <div id="gf-msg-${g.id}"></div>
      </div>
    `;
  }).join('');
}
window.cargarGastosFijos = cargarGastosFijos;

async function marcarGastoFijoPagado(gastoId, nombre) {
  const msgBox = document.getElementById('gf-msg-' + gastoId);
  const monto = parseFloat(document.getElementById('gf-pago-' + gastoId).value) || 0;
  const medioPago = document.getElementById('gf-medio-' + gastoId).value;

  if (monto <= 0) { msgBox.innerHTML = `<div class="msg msg-error">Poné un monto mayor a cero.</div>`; return; }
  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { error } = await sb.from('movimientos_caja').insert({
    vendedora: usuarioActual.nombre,
    descripcion: nombre,
    ingresa_egresa: 'EGRESA',
    medio_pago: medioPago,
    monto: monto,
    gasto_fijo_id: gastoId
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  cargarGastosFijos();
}
window.marcarGastoFijoPagado = marcarGastoFijoPagado;
