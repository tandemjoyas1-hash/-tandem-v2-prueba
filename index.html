async function verCuentaCliente(clienteId, nombreCliente, verTodo = false) {
  render(`${pintarUsuarioActual()}<div class="card"><p>Cargando cuenta de ${nombreCliente}...</p></div>`);
  await cargarPreciosMateriales();

  // "COMPRÓ" = TODOS los sobres de este cliente, tengan o no saldo pendiente hoy
  // (igual que la planilla vieja: la columna DEBE suma el total de cada trabajo,
  // independientemente de si ya se retiró o no).
  const { data: sobresTodos } = await sb
    .from('sobres')
    .select('id, numero, descripcion, precio_total, fecha_entrada')
    .eq('cliente_id', clienteId)
    .order('fecha_entrada');

  // "FUE PAGANDO" = TODOS los pagos reales que hizo el cliente (código 502 sueltos
  // + señas/cobros de saldo ligados a un sobre puntual), excluyendo lo que quedó
  // anotado como CUENTA CORRIENTE (eso es deuda, no pago).
  // Corregido 15/09/2026: antes solo contaba código 502 y se perdían los pagos
  // hechos en efectivo/tarjeta al retirar un sobre (quedaban "debiendo" aunque
  // ya estaban pagados).
  const { data: pagosTodos } = await sb
    .from('movimientos_caja')
    .select('monto, fecha, descripcion, sobre_id')
    .eq('cliente_id', clienteId)
    .eq('ingresa_egresa', 'INGRESA')
    .neq('medio_pago', 'CUENTA CORRIENTE')
    .or('sobre_id.not.is.null,codigo.eq.502')
    .order('fecha');

  // NUEVO (05/09/2026): el saldo en $ SIEMPRE se calcula con el historial completo (si no, se
  // vería un saldo mal calculado). Lo que se COLAPSA por defecto, para no tener que scrollear
  // meses y meses en clientes viejos, es la LISTA detallada de sobres y pagos: por defecto solo
  // se listan los del mes actual, con un botón para desplegar el historial completo si hace falta.
  const inicioMes = new Date(); inicioMes.setDate(1); inicioMes.setHours(0,0,0,0);
  const esDeEsteMes = (fechaStr) => fechaStr && new Date(fechaStr) >= inicioMes;

  const sobres = verTodo ? (sobresTodos || []) : (sobresTodos || []).filter(s => esDeEsteMes(s.fecha_entrada));
  const pagos = verTodo ? (pagosTodos || []) : (pagosTodos || []).filter(p => esDeEsteMes(p.fecha));
  const hayHistorialViejo = !verTodo && ((sobresTodos || []).length > sobres.length || (pagosTodos || []).length > pagos.length);

  const debe = (sobresTodos || []).reduce((acc, s) => acc + (Number(s.precio_total) || 0), 0);
  const haber = (pagosTodos || []).reduce((acc, p) => acc + Number(p.monto), 0);
  const saldo = debe - haber;

  const filasCompras = sobres.length === 0
    ? `<div class="vacio">Sin compras ${verTodo ? '' : 'este mes '}registradas</div>`
    : sobres.map(s => `
        <div class="lista-sobre">
          <div class="nro">#${s.numero} — $${(Number(s.precio_total) || 0).toLocaleString('es-AR')}</div>
          <div class="cli">${s.fecha_entrada ? new Date(s.fecha_entrada).toLocaleDateString('es-AR') : ''}</div>
          <div class="desc">${s.descripcion || ''}</div>
        </div>
      `).join('');

  const filasPagos = pagos.length === 0
    ? `<div class="vacio">Sin pagos ${verTodo ? '' : 'este mes '}registrados</div>`
    : pagos.map(p => `
        <div class="lista-sobre">
          <div class="nro">$${Number(p.monto).toLocaleString('es-AR')}</div>
          <div class="cli">${new Date(p.fecha).toLocaleDateString('es-AR')}</div>
          <div class="desc">${p.descripcion || ''}</div>
        </div>
      `).join('');

  // NUEVO (05/09/2026): metal en consignación — mayoristas que entregan su propio metal y solo
  // se les cobra la mano de obra. Se suma con cada entrega y se resta con cada trabajo realizado.
  const { data: movsMetal } = await sb
    .from('metal_clientes')
    .select('id, fecha, tipo, material, gramos, nota, sobres(numero)')
    .eq('cliente_id', clienteId)
    .order('fecha', { ascending: false });

  const saldosMetal = {};
  (movsMetal || []).forEach(m => {
    const g = Number(m.gramos) || 0;
    saldosMetal[m.material] = (saldosMetal[m.material] || 0) + (m.tipo === 'ENTREGA' ? g : -g);
  });
  const materialesConSaldo = Object.keys(saldosMetal);

  const movsMetalMostrar = verTodo ? (movsMetal || []) : (movsMetal || []).filter(m => esDeEsteMes(m.fecha));
  const filasMetal = movsMetalMostrar.length === 0
    ? `<div class="vacio">Sin movimientos de metal ${verTodo ? '' : 'este mes '}</div>`
    : movsMetalMostrar.map(m => `
        <div class="lista-sobre">
          <div class="nro">${m.tipo === 'ENTREGA' ? '➕' : '➖'} ${Number(m.gramos).toLocaleString('es-AR')}g ${etiquetaMaterial(m.material)}</div>
          <div class="cli">${new Date(m.fecha + 'T12:00:00').toLocaleDateString('es-AR')}${m.sobres ? ' · sobre #' + m.sobres.numero : ''}</div>
          ${m.nota ? `<div class="desc">${m.nota}</div>` : ''}
        </div>
      `).join('');

  render(`
    ${pintarUsuarioActual()}
    <div class="card">
      <h1>${nombreCliente}</h1>
      <div class="sub">Cuenta corriente</div>

      <label>🥈 Metal en consignación</label>
      ${materialesConSaldo.length > 0 ? `
        <div class="lista-sobre" style="background:#f7f7f7;">
          ${materialesConSaldo.map(mat => `<div>${etiquetaMaterial(mat)}: <strong>${saldosMetal[mat].toLocaleString('es-AR')}g</strong> disponible${saldosMetal[mat] !== 1 ? 's' : ''}</div>`).join('')}
        </div>
      ` : ''}
      ${filasMetal}

      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn btn-outline" style="width:auto; flex:1; font-size:13px; padding:10px;" onclick="mostrarFormMetal('${clienteId}', '${nombreCliente.replace(/'/g, "\\'")}', 'ENTREGA')">➕ Entregó metal</button>
        <button class="btn btn-outline" style="width:auto; flex:1; font-size:13px; padding:10px;" onclick="mostrarFormMetal('${clienteId}', '${nombreCliente.replace(/'/g, "\\'")}', 'USO')">➖ Se usó en un sobre</button>
      </div>
      <div id="cc-metal-form"></div>

      <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">

      <div class="lista-sobre" style="background:#f7f7f7;">
        <div>Le vendimos a crédito (debe): <strong>$${debe.toLocaleString('es-AR')}</strong></div>
        <div>Nos pagó (haber): <strong>$${haber.toLocaleString('es-AR')}</strong></div>
        <div style="font-size:20px; font-weight:700; color:${saldo > 0 ? '#993c1d' : '#27500a'}; margin-top:6px;">
          ${saldo > 0 ? 'Saldo que nos debe: $' + saldo.toLocaleString('es-AR') : (saldo < 0 ? 'Tiene a favor: $' + Math.abs(saldo).toLocaleString('es-AR') : 'Cuenta al día ($0)')}
        </div>
      </div>

      <div class="sub" style="margin-top:10px;">${verTodo ? 'Mostrando el historial completo' : 'Mostrando solo este mes'}</div>
      ${hayHistorialViejo ? `<button class="btn btn-outline" style="margin-top:6px;" onclick="verCuentaCliente('${clienteId}', '${nombreCliente.replace(/'/g, "\\'")}', true)">📂 Ver historial completo (meses anteriores)</button>` : ''}
      ${verTodo ? `<button class="btn btn-outline" style="margin-top:6px;" onclick="verCuentaCliente('${clienteId}', '${nombreCliente.replace(/'/g, "\\'")}', false)">🔼 Ver solo este mes</button>` : ''}

      <label style="margin-top:18px;">🛒 Compró (a crédito)</label>
      ${filasCompras}

      <label style="margin-top:18px;">💵 Fue pagando</label>
      ${filasPagos}

      <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">

      <label>Registrar un pago a cuenta</label>
      <input type="number" id="cc-monto" placeholder="Monto que paga">
      <select id="cc-medio">
        <option>EFECTIVO</option>
        <option>TARJETA FISER</option>
        <option>TRANSFERENCIA SANTANDER</option>
        <option>MERCADO PAGO FISER</option>
        <option>MERCADO PAGO LAUREANO</option>
        <option>UALA CARLA</option>
      </select>
      <button class="btn btn-verde" onclick="registrarPagoCC('${clienteId}', '${nombreCliente.replace(/'/g, "\\'")}')">Registrar pago</button>
      <div id="cc-pago-msg"></div>

      <button class="btn btn-outline" style="margin-top:10px;" onclick="pantallaCuentaCorriente()">← Buscar otro cliente</button>
    </div>
  `);
}
window.verCuentaCliente = verCuentaCliente;

async function registrarPagoCC(clienteId, nombreCliente) {
  const msgBox = document.getElementById('cc-pago-msg');
  const monto = parseFloat(document.getElementById('cc-monto').value) || 0;
  const medioPago = document.getElementById('cc-medio').value;

  if (monto <= 0) {
    msgBox.innerHTML = `<div class="msg msg-error">Poné un monto mayor a cero.</div>`;
    return;
  }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  // NUEVO (05/09/2026): mismo aviso de posible duplicado que en Venta Directa, para pagos a
  // cuenta (evita que dos vendedoras carguen el mismo pago dos veces sin saberlo).
  const { data: pagosDuplicados } = await sb.from('movimientos_caja')
    .select('vendedora, created_at')
    .eq('ingresa_egresa', 'INGRESA')
    .eq('codigo', 502)
    .eq('cliente_id', clienteId)
    .eq('monto', monto)
    .eq('fecha', fechaHoyISO());

  if (pagosDuplicados && pagosDuplicados.length > 0) {
    const anterior = pagosDuplicados[0];
    const hora = new Date(anterior.created_at).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    const seguir = confirm(`⚠️ POSIBLE PAGO DUPLICADO\n\n${anterior.vendedora || 'Alguien'} ya cargó hoy a las ${hora} un pago de $${monto.toLocaleString('es-AR')} de ${nombreCliente}.\n\n¿Es un pago distinto y hay que cargarlo igual?\n\nAceptar = SÍ, cargar de nuevo\nCancelar = NO, no cargar (era el mismo)`);
    if (!seguir) { msgBox.innerHTML = `<div class="msg msg-error">No se guardó — se detectó como posible duplicado.</div>`; return; }
  }

  const { error } = await sb.from('movimientos_caja').insert({
    vendedora: usuarioActual.nombre,
    codigo: 502,
    descripcion: 'Pago a cuenta - ' + nombreCliente,
    ingresa_egresa: 'INGRESA',
    medio_pago: medioPago,
    monto: monto,
    cliente_id: clienteId
  });

  if (error) {
    msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`;
    return;
  }

  verCuentaCliente(clienteId, nombreCliente);
}
window.registrarPagoCC = registrarPagoCC;

// NUEVO (05/09/2026): "Metal en consignación" — mayoristas que traen su propio metal para que

// cuenta corriente en pesos: acá se lleva la cuenta en gramos por tipo de material.

  const mapa = _preciosMaterialesActual || {};

function opcionesMaterialMetal(seleccionado) {
  const mapa = _preciosMaterialesActual || {};
  const ids = Object.keys(mapa);
  if (ids.length === 0) return `<option value="PLATA">Plata</option>`;
  return ids.map(id => `<option value="${id}" ${id === seleccionado ? 'selected' : ''}>${mapa[id].nombre}</option>`).join('');
}

async function guardarMovMetal(clienteId, nombreCliente, tipo) {
  const msgBox = document.getElementById('cm-msg');
  const fecha = document.getElementById('cm-fecha').value;
  const material = document.getElementById('cm-material').value;
  const gramos = parseFloat(document.getElementById('cm-gramos').value);
  const nota = document.getElementById('cm-nota').value.trim();
  const inputSobre = document.getElementById('cm-sobre');
  const numeroSobre = inputSobre ? inputSobre.value.trim() : '';

  if (!fecha || isNaN(gramos) || gramos <= 0) {
    msgBox.innerHTML = `<div class="msg msg-error">Poné una fecha y una cantidad de gramos válida.</div>`;
    return;
  }

  let sobreId = null;
  if (numeroSobre) {
    const { data: s } = await sb.from('sobres').select('id').eq('numero', normalizarSobre(numeroSobre)).maybeSingle();
    if (!s) { msgBox.innerHTML = `<div class="msg msg-error">No se encontró el sobre ${numeroSobre}.</div>`; return; }
    sobreId = s.id;
  }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { error } = await sb.from('metal_clientes').insert({
    cliente_id: clienteId, fecha: fecha, tipo: tipo, material: material,
    gramos: gramos, sobre_id: sobreId, nota: nota || null
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  verCuentaCliente(clienteId, nombreCliente);
}
window.guardarMovMetal = guardarMovMetal;

// NUEVO (21/09/2026): pantalla pública para el CLIENTE cuando escanea el QR de su comprobante.
// No lee nada de la base de datos: solo muestra el N° de sobre y el botón para consultar por WhatsApp.
// ============================================================
// NUEVO (21/09/2026): además del botón de WhatsApp, esta pantalla ahora muestra el
// estado real del sobre (en proceso / en taller / listo / retirado) y, si tiene saldo
// pendiente, cuánto es — así el cliente lo ve al toque, sin tener que escribir.
async function pantallaClienteSobre(numero) {
  const link = linkWhatsApp(WHATSAPP_LOCAL, 'Hola, consulto por mi sobre N° ' + numero);
  const cabecera = `
      <div style="font-family:Georgia,'Times New Roman',serif; font-size:32px; font-weight:700; letter-spacing:2px;">TANDEM</div>
      <div style="font-family:Georgia,'Times New Roman',serif; font-size:13px; letter-spacing:5px; border-top:1px solid #111; width:55%; margin:4px auto 0; padding-top:3px;">JOYAS</div>
      <div style="margin-top:26px; font-size:13px; letter-spacing:2px; color:#8a8378; text-transform:uppercase;">Tu pedido</div>
      <div style="font-family:Georgia,'Times New Roman',serif; font-size:44px; font-weight:700; margin:4px 0 22px;">Sobre N° ${numero}</div>`;
  const pie = `
      <div style="margin-top:22px; font-size:13px; color:#555;">Vélez Sarsfield 156 · Córdoba</div>
      <div style="margin-top:4px; font-size:13px;"><a href="${INSTAGRAM_LOCAL_URL}" style="color:#555;">Instagram @${INSTAGRAM_USUARIO}</a></div>
      <div style="margin-top:34px;"><a href="#" onclick="pantallaLogin(); return false;" style="font-size:12px; color:#b5ac9b;">Soy del equipo — ingresar</a></div>`;

  app.innerHTML = `<div class="card" style="text-align:center; padding-top:34px;">${cabecera}<p style="color:#8a8378;">Buscando tu pedido…</p>${pie}</div>`;

  // NUEVO (22/09/2026): se consulta a través de estado_sobre_publico (una función acotada,
  // pensada para que cualquiera pueda consultar SU sobre por número sin poder leer el resto
  // de la base — ya no se leen las tablas de sobres/movimientos_caja directo desde afuera).
  let fila = null;
  try {
    const { data } = await sb.rpc('estado_sobre_publico', { p_numero: numero });
    fila = (data && data[0]) || null;
  } catch (e) { fila = null; }

  let bloqueEstado = '';
  if (fila) {
    const ETIQUETAS = {
      retirado: ['✅ Retirado', '#4a7c59'],
      listo: ['📦 Listo para retirar', '#4a7c59'],
      en_taller: ['🔧 En el taller', '#a67c3d'],
      en_proceso: ['📋 En proceso', '#a67c3d'],
    };
    const [estado, color] = ETIQUETAS[fila.estado] || ['', '#555'];
    const total = Number(fila.total) || 0;
    const saldo = Number(fila.saldo) || 0;
    const filaSaldo = total > 0
      ? (saldo > 0
          ? `<div style="margin-top:14px; padding:12px; background:#fbeeea; border-radius:8px;"><div style="font-size:12px; color:#8a5a3d;">SALDO A PAGAR</div><div style="font-size:26px; font-weight:700; color:#8a3d1f;">$${saldo.toLocaleString('es-AR')}</div></div>`
          : `<div style="margin-top:14px; padding:12px; background:#eaf5ec; border-radius:8px; color:#2f5c3d; font-size:14px;">Sin saldo pendiente</div>`)
      : '';
    const filaFecha = (fila.estado !== 'retirado' && fila.para_el_dia)
      ? `<div style="margin-top:10px; font-size:13px; color:#555;">Fecha estimada: ${new Date(fila.para_el_dia + 'T00:00:00').toLocaleDateString('es-AR')}</div>`
      : '';

// ============================================================
// NUEVO (21/09/2026): escanear con la cámara el QR del comprobante y abrir ese sobre.
// Usa el lector nativo del celu (BarcodeDetector) si existe; si no, carga la librería jsQR.
// Un lector de códigos USB/bluetooth también sirve: "tipea" el N° en el buscador y manda Enter.
// ============================================================
// Saca el N° de sobre de lo que leyó el QR: el link nuevo (…/?s=33837) o un número suelto (comprobantes anteriores).
function numeroDesdeQR(texto) {
  const t = String(texto || '').trim();
  try { const s = new URL(t).searchParams.get('s'); if (s) return normalizarSobre(s); } catch (e) {}
  const m = t.match(/[?&]s=(\d+)/);
  if (m) return normalizarSobre(m[1]);
  return t;
}
window.numeroDesdeQR = numeroDesdeQR;

let _escanerStream = null;
let _escanerActivo = false;

function cerrarEscanerSobre() {
  _escanerActivo = false;
  if (_escanerStream) { _escanerStream.getTracks().forEach(t => t.stop()); _escanerStream = null; }
  const m = document.getElementById('escaner-modal');
  if (m) m.remove();
}
window.cerrarEscanerSobre = cerrarEscanerSobre;

function cargarLectorJsQR() {
  return new Promise((resolve, reject) => {
    if (window.jsQR) return resolve(window.jsQR);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = () => resolve(window.jsQR);
    s.onerror = () => reject(new Error('No se pudo cargar el lector de QR (¿hay internet?)'));
    document.head.appendChild(s);
  });
}

async function escanearSobre() {
  cerrarEscanerSobre();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Este navegador no permite usar la cámara. Abrí la app directo en Chrome (no desde un link dentro de WhatsApp o Instagram).');
    return;
  }
  const modal = document.createElement('div');
  modal.id = 'escaner-modal';
  modal.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.92); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; overflow:auto;';
  modal.innerHTML = `
    <div style="color:white; font-size:16px; font-weight:700; margin-bottom:10px; text-align:center;">📷 Apuntá al código QR del comprobante</div>
    <video id="escaner-video" playsinline muted style="width:100%; max-width:420px; border-radius:12px; background:#000;"></video>
    <div id="escaner-msg" style="color:#ddd; font-size:13px; margin-top:10px; text-align:center;">Abriendo la cámara...</div>
    <div style="width:100%; max-width:420px; margin-top:14px; display:flex; gap:8px;">
      <input type="tel" inputmode="numeric" id="escaner-manual" placeholder="O escribí el N° de sobre" style="flex:1; margin:0;">
      <button type="button" class="btn btn-verde" style="width:auto; margin:0; padding:0 16px;" onclick="var v=document.getElementById('escaner-manual').value.trim(); if(v){ window._escanerAlLeer(v); }">Buscar</button>
    </div>
    <button type="button" class="btn btn-outline" style="max-width:420px; margin-top:12px; background:white;" onclick="cerrarEscanerSobre()">Cancelar</button>`;
  document.body.appendChild(modal);
  const video = document.getElementById('escaner-video');
  const msg = document.getElementById('escaner-msg');

  const alLeer = (texto) => {
    cerrarEscanerSobre();
    const numero = numeroDesdeQR(texto);
    const input = document.getElementById('bs-numero');
    if (input) { input.value = numero; buscarSobreDetalle(); return; }
    const inputRetiro = document.getElementById('rt-buscar');
    if (inputRetiro) { inputRetiro.value = numero; buscarSobresListosParaRetiro(); }
  };
  window._escanerAlLeer = alLeer;

  try {
    try {
      _escanerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    } catch (e1) {
      if (e1 && (e1.name === 'NotAllowedError' || e1.name === 'SecurityError')) throw e1;
      _escanerStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }
    video.srcObject = _escanerStream;
    await video.play();
  } catch (err) {
    msg.textContent = (err && err.name === 'NotAllowedError')
      ? 'La cámara está bloqueada. Tocá el candado 🔒 de la barra de arriba → Permisos → Cámara → Permitir, y probá de nuevo. Mientras tanto podés escribir el número acá abajo.'
      : 'No se pudo abrir la cámara. Podés escribir el número de sobre acá abajo.';
    return;
  }
  _escanerActivo = true;
  msg.textContent = 'Buscando el código... Acercá el comprobante y buscá buena luz (si es una pantalla, subile el brillo).';

  let detector = null;
  if ('BarcodeDetector' in window) {
    try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; }
  }
  // El lector jsQR se carga siempre: si el del celu no llega a leer, este lo intenta con la imagen completa.
  let jsQR = null;
  const promesaJsQR = cargarLectorJsQR().then(l => { jsQR = l; }).catch(() => {});
  if (!detector) {
    await promesaJsQR;
    if (!jsQR) { msg.textContent = 'No se pudo cargar el lector de QR (¿hay internet?). Podés escribir el número acá abajo.'; return; }
  }
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const ciclo = async () => {
    if (!_escanerActivo) return;
    try {
      if (video.readyState >= 2 && video.videoWidth > 0) {
        if (detector) {
          const codigos = await detector.detect(video);
          if (codigos.length > 0) return alLeer(codigos[0].rawValue);
        }
        if (jsQR) {
          const escala = Math.min(1, 1280 / video.videoWidth);
          canvas.width = Math.round(video.videoWidth * escala);
          canvas.height = Math.round(video.videoHeight * escala);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
          if (r && r.data) return alLeer(r.data);
        }
      }
    } catch (e) { /* sigue intentando */ }
    setTimeout(ciclo, 200);
  };
  ciclo();
}
window.escanearSobre = escanearSobre;

function estadoDeSobre(s) {
  if (s.fecha_salida) return '✅ Retirado';
  if (s.listo) return '🟢 Listo para retirar';
  if (s.baja_taller) return '🛠 En taller (' + (s.orfebre || '') + ')';
  return '🆕 Recién ingresado';
}

async function buscarSobreDetalle() {
  const numero = document.getElementById('bs-numero').value.trim();
  const resBox = document.getElementById('bs-resultado');
  if (!numero) { resBox.innerHTML = ''; return; }
  resBox.innerHTML = `<div class="msg">Buscando...</div>`;

  const { data: s, error } = await sb
    .from('sobres')
    .select('id, numero, descripcion, precio_total, fecha_entrada, baja_taller, orfebre, listo, controlado_por, fecha_salida, foto_referencia, cliente_id, clientes(nombre, telefono)')
    .eq('numero', normalizarSobre(numero))
    .maybeSingle();

  if (error) {
    resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`;
    return;
  }
  if (!s) {
    const { data: clientesMatch } = await sb.from('clientes').select('id').ilike('nombre', '%' + numero + '%').limit(15);
    let porCliente = [];
    if (clientesMatch && clientesMatch.length > 0) {
      const ids = clientesMatch.map(c => c.id);
      const { data } = await sb
        .from('sobres')
        .select('numero, descripcion, baja_taller, orfebre, listo, fecha_salida, fecha_entrada, clientes(nombre)')
        .in('cliente_id', ids)
        .order('fecha_entrada', { ascending: false })
        .limit(20);
      porCliente = data || [];
    }
    if (porCliente.length === 0) {
      resBox.innerHTML = `<div class="vacio">No se encontró ningún sobre con ese número o cliente.</div>`;
      return;
    }
    if (porCliente.length === 1) {
      document.getElementById('bs-numero').value = porCliente[0].numero;
      return buscarSobreDetalle();
    }
    resBox.innerHTML = porCliente.map(s2 => `
      <div class="lista-sobre" onclick="document.getElementById('bs-numero').value='${s2.numero}'; buscarSobreDetalle(); window.scrollTo({top:0, behavior:'smooth'});" style="cursor:pointer;">
        <div class="nro">#${s2.numero} — ${s2.clientes ? s2.clientes.nombre : ''}</div>
        <div class="cli">${estadoDeSobre(s2)}</div>

    .from('historial_sobres')

    .order('fecha_hora');

    .from('movimientos_caja')

    .from('items_sobre')
    .select('descripcion, precio')

  // NUEVO (05/09/2026): fotos adicionales del sobre (varias, se pueden agregar en cualquier momento,
  // ej. cliente manda después la foto de los laterales de un sello). Se guardan en la tabla
  // tandem.fotos_sobre + bucket de Storage "fotos-sobres". No reemplaza a foto_referencia (la foto
  // original del OCR de entrada), se suman aparte.
  const { data: fotosExtra } = await sb
    .from('fotos_sobre')
    .select('id, url, path, etiqueta')
    .eq('sobre_id', s.id)
    .order('created_at');

  const galeriaFotos = (() => {
  window._fotosPendientes = [];
  return `
    <div id="bs-galeria-fotos" style="display:flex; flex-wrap:wrap; gap:10px; margin:10px 0;">
      ${(fotosExtra || []).map(f => `
        <div style="width:100px;">
          <div style="position:relative;">
            <img src="${f.url}" onclick="window.open('${f.url}','_blank')" style="width:100px; height:100px; object-fit:cover; border-radius:8px; border:1px solid #e6ddc9; cursor:pointer;">
            <span onclick="borrarFotoSobre('${f.id}', '${f.path}')" style="position:absolute; top:-6px; right:-6px; background:#b23b3b; color:#fff; border-radius:50%; width:20px; height:20px; font-size:13px; line-height:20px; text-align:center; cursor:pointer;">✕</span>
          </div>
          <input type="text" value="${f.etiqueta || ''}" placeholder="Ej: lateral izq." style="font-size:11px; padding:4px; margin-top:3px; width:100%; box-sizing:border-box;" onchange="guardarEtiquetaFoto('${f.id}', this.value)">
        </div>
      `).join('')}
    </div>
    <div id="bs-pendientes" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px;"></div>
    <input type="file" id="bs-fotos-input" accept="image/*" style="display:none;" onchange="agregarFotoPendiente('${s.id}')">
    <button class="btn btn-outline" style="width:auto; display:inline-block; padding:10px 18px; font-size:14px; margin-top:8px;" onclick="document.getElementById('bs-fotos-input').click()">➕ Elegir foto</button>
    <button id="bs-btn-subir" class="btn btn-verde" style="width:auto; padding:8px 16px; font-size:13px; display:none;" onclick="subirFotosSobre('${s.id}')">📷 Subir fotos elegidas</button>
    <div id="bs-fotos-msg"></div>
  `;
  })();

  const pagado = (movimientos || []).reduce((acc, m) => acc + Number(m.monto), 0);
  const saldo = Math.max(0, (Number(s.precio_total) || 0) - pagado);

  const filasHistorial = (historial || []).length === 0
    ? `<div class="vacio">Sin eventos registrados todavía</div>`
    : historial.map(h => `
        <div class="lista-sobre">
          <div class="nro">${h.evento}</div>
          <div class="cli">${new Date(h.fecha_hora).toLocaleString('es-AR')}</div>
          <div class="desc">${h.detalle || ''}</div>
        </div>
      `).join('');

  const filasPagos = (movimientos || []).length === 0
    ? `<div class="vacio">Sin pagos registrados todavía</div>`
    : movimientos.map(m => `
        <div class="lista-sobre">
          <div class="nro">$${Number(m.monto).toLocaleString('es-AR')} — ${m.medio_pago || ''}</div>
          <div class="cli">${new Date(m.fecha).toLocaleDateString('es-AR')}</div>
          <div class="desc">${m.descripcion || ''}</div>
        </div>
      `).join('');

  resBox.innerHTML = `
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid #eee;">
      ${s.foto_referencia ? `
        <div style="text-align:center; margin-bottom:14px;">

          <div style="font-size:12px; color:#8a8378; margin-top:4px;">📎 Foto que mandó el cliente</div>
        </div>
      ` : ''}
      <div class="nro" style="font-size:18px;">#${s.numero} — ${s.clientes ? s.clientes.nombre : '(sin cliente)'}</div>
      <div class="desc">${s.descripcion || ''}</div>
      ${!s.fecha_salida ? `<button type="button" class="btn btn-oro" style="margin:8px 0;" onclick="irARetiroConSobre('${s.numero}')">💰 Dar salida (Retiro)</button>` : ''}
      <button type="button" class="btn btn-outline" style="margin:8px 0;" onclick="reimprimirComprobante('${s.id}')">🖨️ Reimprimir comprobante</button>
      <div style="display:flex; align-items:center; justify-content:space-between; margin:8px 0;">
        <div style="font-weight:600;">${estadoDeSobre(s)}</div>
        ${!s.fecha_salida ? `<button type="button" onclick="toggleCancelarSobre()" style="width:auto; margin-top:0; padding:6px 10px; font-size:12px; border:1px solid #b23b3b; color:#b23b3b; background:#fff; border-radius:6px; cursor:pointer;">❌ Cancelar sobre</button>` : ''}
      </div>
      <div id="bs-cancelar-box" class="lista-sobre" style="display:none; margin-bottom:10px;">
        <div style="font-weight:700; margin-bottom:8px; color:#b23b3b;">❌ Cancelar sobre ${s.numero}</div>
        <label>¿Cuánto hay que devolverle al cliente? (dejá 0 si no se devuelve nada)</label>
        <input type="number" id="bs-cancelar-monto" value="${pagado}">
        <label>Medio por el que se devuelve</label>
        <select id="bs-cancelar-medio">
          <option value="EFECTIVO">Efectivo</option>
          <option value="TRANSFERENCIA SANTANDER">Transferencia Santander</option>
          <option value="MERCADO PAGO FISER">Mercado Pago Fiser</option>
          <option value="MERCADO PAGO LAUREANO">Mercado Pago Laureano</option>
          <option value="UALA CARLA">Uala Carla</option>
          <option value="TARJETA FISER">Tarjeta Fiser</option>
        </select>
        <label>Motivo de la cancelación</label>
        <input type="text" id="bs-cancelar-motivo" placeholder="Ej: el material no era plata">
        <button class="btn" style="background:#b23b3b; color:#fff; margin-top:10px;" onclick="confirmarCancelarSobre('${s.id}', '${s.numero}', ${s.cliente_id ? "'" + s.cliente_id + "'" : 'null'})">Confirmar cancelación</button>
        <div id="bs-cancelar-msg"></div>

      <label style="margin-top:14px;">📷 Fotos del sobre</label>

function toggleCancelarSobre() {
  const box = document.getElementById('bs-cancelar-box');

  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}
window.toggleCancelarSobre = toggleCancelarSobre;

async function confirmarCancelarSobre(sobreId, numero, clienteId) {
  const monto = Number(document.getElementById('bs-cancelar-monto').value) || 0;
  const medio = document.getElementById('bs-cancelar-medio').value;
  const motivo = document.getElementById('bs-cancelar-motivo').value.trim();
  const msgBox = document.getElementById('bs-cancelar-msg');

  if (!motivo) {
    msgBox.innerHTML = `<div class="msg msg-error">Contá el motivo de la cancelación.</div>`;
    return;
  }
  if (!confirm(`¿Confirmás cancelar el sobre ${numero}${monto > 0 ? ' y devolver $' + monto.toLocaleString('es-AR') : ''}? Esto no se puede deshacer desde acá.`)) return;

  if (monto > 0) {
    const { error: errDevol } = await sb.from('movimientos_caja').insert({
      vendedora: usuarioActual.nombre,
      descripcion: 'Devolución seña sobre ' + numero + ' (cancelado: ' + motivo + ')',
      ingresa_egresa: 'EGRESA',
      medio_pago: medio,
      monto: monto,
      cliente_id: clienteId
    });
    if (errDevol) {
      msgBox.innerHTML = `<div class="msg msg-error">⚠️ No se pudo registrar la devolución (${errDevol.message}). No se canceló el sobre, intentá de nuevo.</div>`;
      return;
    }
  }

  await sb.from('sobres').update({ fecha_salida: new Date().toISOString() }).eq('id', sobreId);
  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'CANCELADO',
    detalle: motivo + (monto > 0 ? ' — se devolvió $' + monto.toLocaleString('es-AR') + ' por ' + medio : ' — sin devolución')
  });

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Sobre ${numero} cancelado.</div>`;
  setTimeout(() => buscarSobreDetalle(), 800);
}
window.confirmarCancelarSobre = confirmarCancelarSobre;

// NUEVO (05/09/2026, v2): en vez de depender del selector "multiple" de la galería (que en
// varios celulares como Samsung/Xiaomi no deja tildar varias fotos a la vez), se agregan de a
// una: cada vez que se elige una foto se guarda en una lista pendiente en memoria con su
// vista previa, y recién al tocar "Subir fotos elegidas" se mandan todas juntas al servidor.
window._fotosPendientes = window._fotosPendientes || [];

function agregarFotoPendiente(sobreId) {
  const input = document.getElementById('bs-fotos-input');
  const archivo = input.files && input.files[0];
  if (!archivo) return;

  window._fotosPendientes.push({ archivo: archivo, etiqueta: '' });
  pintarFotosPendientes();
  input.value = ''; // limpia para poder elegir otra foto después (aunque sea la "misma")
}
window.agregarFotoPendiente = agregarFotoPendiente;

function quitarFotoPendiente(indice) {
  window._fotosPendientes.splice(indice, 1);
  pintarFotosPendientes();
}
window.quitarFotoPendiente = quitarFotoPendiente;

function pintarFotosPendientes() {
  const cont = document.getElementById('bs-pendientes');
  const btnSubir = document.getElementById('bs-btn-subir');
  if (!cont) return;
  cont.innerHTML = window._fotosPendientes.map((item, i) => `
    <div style="width:90px;">
      <div style="position:relative;">
        <img src="${URL.createObjectURL(item.archivo)}" style="width:90px; height:90px; object-fit:cover; border-radius:8px; border:2px dashed #d4af6a;">

// Sube todas las fotos que se fueron juntando en la lista pendiente al bucket "fotos-sobres" y
// guarda cada URL + etiqueta en tandem.fotos_sobre. Al terminar, refresca el detalle del sobre.
async function subirFotosSobre(sobreId) {
  const msgBox = document.getElementById('bs-fotos-msg');
  const pendientes = window._fotosPendientes || [];
  if (pendientes.length === 0) { msgBox.innerHTML = `<div class="msg msg-error">Elegí al menos una foto primero.</div>`; return; }

  msgBox.innerHTML = `<div class="msg">Subiendo ${pendientes.length} foto(s)...</div>`;

  let subidas = 0;
  for (const item of pendientes) {
    const archivo = item.archivo;
    const nombreArchivo = `${sobreId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${archivo.name}`;
    const { error: errorSubida } = await sb.storage.from('fotos-sobres').upload(nombreArchivo, archivo);
    if (errorSubida) { msgBox.innerHTML = `<div class="msg msg-error">Error subiendo ${archivo.name}: ${errorSubida.message}</div>`; continue; }

    const { data: urlData } = sb.storage.from('fotos-sobres').getPublicUrl(nombreArchivo);
    await sb.from('fotos_sobre').insert({ sobre_id: sobreId, url: urlData.publicUrl, path: nombreArchivo, etiqueta: item.etiqueta || null });
    subidas++;
  }

  window._fotosPendientes = [];
  msgBox.innerHTML = subidas > 0 ? `<div class="msg msg-exito">${subidas} foto(s) agregada(s) ✅</div>` : '';
  buscarSobreDetalle();
}
window.subirFotosSobre = subirFotosSobre;

    .from('sobres')

    .is('fecha_salida', null);

async function marcarBoletaRetirada(boletaId, numeroBoleta, clienteId, nombreCliente, telefonoCliente, totalBoleta) {
  const msgBox = document.getElementById('bb-msg');
  const medioPago = document.getElementById('bb-medio').value;
  const esCuentaCorriente = medioPago === 'CUENTA CORRIENTE';
  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { data: relaciones } = await sb
    .from('boleta_sobres')
    .select('sobres(id, numero, precio_total, tipo_cliente, fecha_salida)')
    .eq('boleta_id', boletaId);

  const errores = [];
  for (const r of relaciones) {
    const s = r.sobres;
    if (s.fecha_salida) continue;

    await sb.from('sobres').update({ fecha_salida: new Date().toISOString() }).eq('id', s.id);

    const { data: pagos } = await sb.from('movimientos_caja').select('monto').eq('sobre_id', s.id).eq('ingresa_egresa', 'INGRESA').neq('medio_pago', 'CUENTA CORRIENTE');
    const pagado = (pagos || []).reduce((acc, m) => acc + Number(m.monto), 0);
    const saldo = Math.max(0, (Number(s.precio_total) || 0) - pagado);
    const montoCobrado = esCuentaCorriente ? 0 : saldo;

    if (montoCobrado > 0) {
      const { error: errCobro } = await sb.from('movimientos_caja').insert({
        vendedora: usuarioActual.nombre,
        descripcion: 'cobro saldo sobre ' + s.numero + ' (boleta ' + numeroBoleta + ')',
        ingresa_egresa: 'INGRESA',
        tipo_cliente: s.tipo_cliente,
        medio_pago: medioPago,
        monto: montoCobrado,
        cliente_id: clienteId,
        sobre_id: s.id
      });
      if (errCobro) errores.push('#' + s.numero + ' ($' + montoCobrado.toLocaleString('es-AR') + ')');
    }

    await sb.from('historial_sobres').insert({
      sobre_id: s.id,
      evento: 'RETIRADO',
      detalle: 'Retirado como parte de la boleta ' + numeroBoleta + ' (entregó: ' + usuarioActual.nombre + ')'
    });
  }

  await sb.from('boletas').update({ estado: 'RETIRADA' }).eq('id', boletaId);

  const mensajeWa = esCuentaCorriente
    ? `Hola${nombreCliente ? ' ' + nombreCliente : ''}! Te avisamos que tu boleta N° ${numeroBoleta} en Joyería Tándem fue retirada. Queda un saldo de $${totalBoleta.toLocaleString('es-AR')} en tu cuenta corriente. 💍`
    : `Hola${nombreCliente ? ' ' + nombreCliente : ''}! Te avisamos que tu boleta N° ${numeroBoleta} en Joyería Tándem fue retirada y pagada correctamente. ¡Gracias por tu confianza! 💍`;

  msgBox.innerHTML = `
    <div class="msg msg-ok">✅ Boleta completa, todos los sobres retirados.</div>
    ${errores.length > 0 ? `<div class="msg msg-error">⚠️ El cobro de ${errores.join(', ')} NO se guardó. Avisale a Mauricio para cargarlo a mano.</div>` : ''}
    ${botonWhatsApp(telefonoCliente, mensajeWa)}
  `;
}

function etiquetaTipoCliente(tipo) {
  if (tipo === 'MAYORISTA') return 'Mayorista';
  if (tipo === 'TALLER') return 'Taller';
  if (tipo === 'CONSUMIDOR_FINAL') return 'Por menor';
  return '';
}

function fechaHoyISO() {
  const hoy = new Date();
  const offset = hoy.getTimezoneOffset();
  const local = new Date(hoy.getTime() - offset * 60000);
  return local.toISOString().slice(0, 10);
}

// Suma "dias" días hábiles (de lunes a viernes, sin contar sábados ni domingos)
// a partir de una fecha ISO ("2026-09-04"). Se usa para calcular sola la fecha
// que se le pide al taller que tenga listo el sobre (5 días hábiles de margen).
function sumarDiasHabiles(fechaISO, dias) {
  const partes = fechaISO.split('-').map(Number);
  const fecha = new Date(partes[0], partes[1] - 1, partes[2]);
  let sumados = 0;
  while (sumados < dias) {
    fecha.setDate(fecha.getDate() + 1);
    const diaSemana = fecha.getDay(); // 0 = domingo, 6 = sábado
    if (diaSemana !== 0 && diaSemana !== 6) sumados++;
  }
  const y = fecha.getFullYear();
  const m = String(fecha.getMonth() + 1).padStart(2, '0');
  const d = String(fecha.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

// Convierte una fecha-only ISO ("2026-09-03") a DD/MM/AAAA sin pasar por
// new Date(), que interpreta ese string como UTC y en Argentina puede
// mostrar el día anterior. Usar siempre esta función para fechas sin hora.
function fechaCortaAR(fechaISO) {
  if (!fechaISO) return '';
  const partes = String(fechaISO).slice(0, 10).split('-');
  if (partes.length !== 3) return fechaISO;
  const [y, m, d] = partes;
  return `${d}/${m}/${y}`;
}

// Guarda cuánto efectivo había en el cajón al arrancar el día. Se registra como un movimiento
// especial (código 100, igual que en el sistema viejo de Sheets) para que se sume solo al
// "Efectivo en caja" del día, sin mezclarse con las ventas reales del día.
async function guardarAperturaCaja() {
  const fecha = document.getElementById('cd-fecha').value;
  const monto = parseFloat(document.getElementById('cd-apertura-monto').value);
  const msgBox = document.getElementById('cd-apertura-msg');
  if (isNaN(monto) || monto < 0) { msgBox.innerHTML = `<div class="msg msg-error">Poné un monto válido.</div>`; return; }

  // ARREGLADO (03/09/2026): si la app quedó abierta desde el día anterior sin recargar,
  // el campo de fecha se queda pegado en la fecha vieja. Antes esto guardaba la apertura
  // en la fecha equivocada sin ningún aviso (pasó el 3/9: se guardó con fecha 2/9).
  // Ahora, si la fecha elegida no es la de HOY, se pide confirmación explícita antes de guardar.
  const fechaReal = fechaHoyISO();
  if (fecha !== fechaReal) {
    const seguro = confirm(`Ojo: vas a guardar la apertura para el ${fecha.split('-').reverse().join('/')}, pero HOY es ${fechaReal.split('-').reverse().join('/')}.\n\n¿Seguro que querés guardarla en esa fecha? (Si la app quedó abierta desde ayer, tocá Cancelar, recargá la página y volvé a intentar.)`);
    if (!seguro) { msgBox.innerHTML = `<div class="msg msg-error">Cancelado. Recargá la página (👆 deslizá para actualizar o tocá el botón atrás y volvé a entrar) para que tome la fecha de hoy.</div>`; return; }
  }

  // Si ya había una apertura cargada ese día, la reemplaza (borra la vieja, guarda la nueva)
  await sb.from('movimientos_caja').delete().eq('fecha', fecha).eq('codigo', 100);

  const { error } = await sb.from('movimientos_caja').insert({
    fecha: fecha,
    vendedora: usuarioActual.nombre,
    descripcion: 'Apertura de caja',
    ingresa_egresa: 'INGRESA',
    medio_pago: 'EFECTIVO',
    monto: monto,
    codigo: 100
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

// NUEVO (05/09/2026): busca o crea un cliente, con AVISO si ya existe uno con nombre muy
// parecido pero escrito distinto (con/sin tilde, una letra distinta, etc.) — para no terminar
// con "Federico Sebastián Palavecino" y "federico sebastian palavecino" como dos clientes
// separados (pasó el 05/09/2026, generó una venta duplicada). Reutiliza normalizarNombreCliente
// y distanciaLevenshtein, que ya existían para el Chequeo del día.
async function buscarOCrearCliente(nombreCliente, tipoCliente, telefono) {
  const telLimpio = normalizarTelefono(telefono);

  // 0) Si nos dieron un teléfono, es la forma MÁS confiable de reconocer al cliente —
  // más que el nombre, que se escribe distinto cada vez. Si ya existe alguien con ese
  // mismo teléfono, es esa persona seguro, aunque el nombre esté escrito diferente.
  if (telLimpio.length >= 8) {
    const { data: porTelefono } = await sb.from('clientes').select('id, nombre').eq('telefono', telLimpio).limit(1).maybeSingle();
    if (porTelefono) return porTelefono.id;
  }

  // 1) Coincidencia exacta (sin importar mayúsc/minúsc) — camino normal, no molesta a nadie.
  const { data: exacto } = await sb.from('clientes').select('id').ilike('nombre', nombreCliente).limit(1).maybeSingle();
  if (exacto) {
    if (telLimpio) await sb.from('clientes').update({ telefono: telLimpio }).eq('id', exacto.id).is('telefono', null);
    return exacto.id;
  }

  // 2) No hubo exacta (buscando tal cual, con o sin tilde): comparamos contra TODOS los clientes,
  // ignorando tildes/mayúsculas con distanciaLevenshtein. ANTES esto solo traía candidatos cuyo
  // nombre coincidiera LETRA POR LETRA (con tilde y todo) con la primera palabra escrita — por eso
  // "maria" (sin tilde) no encontraba a "María" (con tilde) y se duplicaba el cliente. Corregido
  // el 17/09/2026: se trae la lista completa (son ~400, no pesa nada) y se compara ya sin tildes.
  const normEscrito = normalizarNombreCliente(nombreCliente);
  const { data: todos } = await sb.from('clientes').select('id, nombre');
  const candidatos = todos || [];
  let parecido = null;
  for (const c of candidatos) {
    const normExistente = normalizarNombreCliente(c.nombre);
    if (normExistente === normEscrito) { parecido = c; break; } // idéntico salvo tildes/mayúsc — no hace falta preguntar
    if (Math.min(normExistente.length, normEscrito.length) >= 5 && distanciaLevenshtein(normExistente, normEscrito) <= 2) {
      parecido = c; // similar pero no idéntico — este sí conviene confirmar
    }
  }

  if (parecido) {
    const esIdentico = normalizarNombreCliente(parecido.nombre) === normEscrito;
    const usarExistente = esIdentico || confirm(`Ya existe un cliente cargado como "${parecido.nombre}".\n\n¿Es la misma persona que "${nombreCliente}"?\n\nAceptar = usar "${parecido.nombre}" (recomendado)\nCancelar = crear "${nombreCliente}" como cliente nuevo y distinto`);
    if (usarExistente) {
      if (telLimpio) await sb.from('clientes').update({ telefono: telLimpio }).eq('id', parecido.id).is('telefono', null);
      return parecido.id;
    }
  }

  // 3) Ningún parecido (o el usuario confirmó que es alguien distinto): se crea nuevo.
  // Se guarda siempre limpio: sin tildes y con Mayúscula Inicial, no como se haya escrito/leído.
  const nombreLimpio = limpiarNombreParaGuardar(nombreCliente);
  const { data: nuevo, error: errCliente } = await sb.from('clientes').insert({ nombre: nombreLimpio, tipo_cliente: tipoCliente, telefono: telLimpio || null }).select('id').single();
  if (errCliente) throw errCliente;
  return nuevo.id;
}
window.buscarOCrearCliente = buscarOCrearCliente;

// Herramientas para comparar nombres de clientes y detectar posibles duplicados
// (ej. "Zipiur" vs "Zipiur Joyas" vs "Zipiun Joyas" — mismo cliente cargado distinto).
function normalizarNombreCliente(n) {
  return (n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
}
function limpiarNombreParaGuardar(n) {
  // Guardamos los nombres de clientes SIEMPRE sin tildes y en formato Título
  // (sin importar cómo lo haya escrito la vendedora o cómo lo haya leído la IA de la foto).
  // OJO: la "ñ" no es una tilde — se preserva (si no, "Ordóñez" quedaría mal como "Ordonez").
  const conEnieProtegida = (n || '').replace(/ñ/gi, m => m === m.toUpperCase() ? '\u0002' : '\u0001');
  const sinTildes = conEnieProtegida.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\u0001/g, 'ñ').replace(/\u0002/g, 'Ñ');
  return sinTildes.toLowerCase().replace(/\s+/g, ' ').trim()
    .replace(/(^|\s)([a-zñ])/g, (m, esp, letra) => esp + letra.toUpperCase());
}
function distanciaLevenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

// Detecta si un texto menciona "foto" o "muestra" (tolerando errores de tipeo
// tipo "mustra" o "ftoo"), usando la misma distancia de escritura que ya
// usamos para detectar clientes duplicados. Ya no depende de "whatsapp"
// porque la foto ahora se adjunta directo al sistema, no se manda más por ahí
// (se deja también whatsapp/wasap por las dudas, para pedidos viejos).
function mencionaMuestraOWhatsapp(texto) {
  if (!texto) return false;
  const normalizado = texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const palabras = normalizado.split(/[^a-z0-9]+/).filter(Boolean);
  for (const palabra of palabras) {
    if (palabra.length >= 4 && distanciaLevenshtein(palabra, 'foto') <= 1) return true;
    if (palabra.length >= 5 && palabra.startsWith('foto')) return true; // ej: "fotos"
    if (palabra.length >= 5 && distanciaLevenshtein(palabra, 'muestra') <= 2) return true;
    if (palabra.length >= 4) {
      for (const variante of ['whatsapp', 'wasap', 'wsp', 'watsap']) {
        if (distanciaLevenshtein(palabra, variante) <= 2) return true;
      }
    }
  }
  return false;
}

async function cargarChequeoDelDia(fecha, modo) {
  modo = modo || 'hoy';
  const box = document.getElementById('chq-resultado');
  const itemsHoy = [];
  const itemsCC = [];

  if (modo === 'hoy') {
    const { data: sinMedio } = await sb.from('movimientos_caja').select('id').eq('fecha', fecha).is('medio_pago', null);
    itemsHoy.push({
      ok: !sinMedio || sinMedio.length === 0,
      texto: (!sinMedio || sinMedio.length === 0)
        ? 'Todos los movimientos tienen medio de pago cargado.'
        : `${sinMedio.length} movimiento(s) sin medio de pago — revisalos, si no la caja no va a cerrar bien.`
    });

    const { data: sobresHoy } = await sb.from('sobres').select('numero, cliente_id, descripcion').eq('fecha_entrada', fecha);
    const incompletos = (sobresHoy || []).filter(s => !s.cliente_id || !s.descripcion || s.descripcion.trim() === '');
    itemsHoy.push({
      ok: incompletos.length === 0,
      texto: incompletos.length === 0
        ? `${(sobresHoy || []).length} sobre(s) nuevos hoy, todos con cliente y descripción.`
        : `${incompletos.length} sobre(s) de hoy sin cliente o sin descripción: ${incompletos.map(s => s.numero).join(', ')}`
    });

    const cincoDiasAtras = new Date();
    cincoDiasAtras.setDate(cincoDiasAtras.getDate() - 5);
    const { data: estancados } = await sb.from('sobres')
      .select('numero, orfebre, baja_taller')
      .not('baja_taller', 'is', null)
      .is('salio_taller', null)
      .lt('baja_taller', cincoDiasAtras.toISOString());
    itemsHoy.push({
      ok: !estancados || estancados.length === 0,
      texto: (!estancados || estancados.length === 0)
        ? 'No hay sobres estancados en taller hace más de 5 días.'
        : `${estancados.length} sobre(s) llevan más de 5 días en taller sin volver: ${estancados.map(s => s.numero + ' (' + s.orfebre + ')').join(', ')}`
    });

    const { data: negativos } = await sb.from('movimientos_caja').select('id, descripcion, monto').eq('fecha', fecha).lt('monto', 0);
    itemsHoy.push({
      ok: !negativos || negativos.length === 0,
      texto: (!negativos || negativos.length === 0)
        ? 'Ningún movimiento con monto negativo.'
        : `${negativos.length} movimiento(s) con monto negativo — probablemente un error al tipear.`
    });

    const { data: todosClientes } = await sb.from('clientes').select('id, nombre');
    const listaClientes = (todosClientes || [])
      .map(c => ({ id: c.id, nombre: c.nombre, norm: normalizarNombreCliente(c.nombre) }))
      .filter(c => c.norm.length >= 4);
    const parecidos = [];
    for (let i = 0; i < listaClientes.length; i++) {
      for (let j = i + 1; j < listaClientes.length; j++) {
        const a = listaClientes[i], b = listaClientes[j];
        let sospechoso = false;
        if (a.norm === b.norm) sospechoso = true;
        else if (a.norm.includes(b.norm) || b.norm.includes(a.norm)) sospechoso = true;
        else if (Math.min(a.norm.length, b.norm.length) >= 5 && distanciaLevenshtein(a.norm, b.norm) <= 2) sospechoso = true;
        if (sospechoso) parecidos.push(`"${a.nombre}" ↔ "${b.nombre}"`);
      }
    }
    itemsHoy.push({
      ok: parecidos.length === 0,
      texto: parecidos.length === 0
        ? 'No hay clientes con nombres parecidos cargados como si fueran distintos.'
        : `${parecidos.length} par(es) de clientes con nombres parecidos, revisá si son la misma persona: ${parecidos.join(' · ')}`
    });
  }

  if (modo === 'cc') {
    const { data: clientesCC } = await sb.from('clientes').select('id, nombre, tipo_cliente').in('tipo_cliente', ['MAYORISTA', 'TALLER']);
    const idsCC = (clientesCC || []).map(c => c.id);
    let sobresCC = [], pagosCC = [];
    if (idsCC.length) {
      const r1 = await sb.from('sobres').select('cliente_id, precio_total, fecha_entrada').in('cliente_id', idsCC);
      sobresCC = r1.data || [];
      const r2 = await sb.from('movimientos_caja').select('cliente_id, monto, fecha').in('cliente_id', idsCC).eq('codigo', 502).eq('ingresa_egresa', 'INGRESA');
      pagosCC = r2.data || [];
    }
    const cuentaPorCliente = {};
    (clientesCC || []).forEach(c => { cuentaPorCliente[c.id] = { nombre: c.nombre, debe: 0, haber: 0, ultimaFecha: null }; });
    sobresCC.forEach(s => {
      const c = cuentaPorCliente[s.cliente_id];
      if (!c) return;
      c.debe += Number(s.precio_total) || 0;
      if (s.fecha_entrada && (!c.ultimaFecha || s.fecha_entrada > c.ultimaFecha)) c.ultimaFecha = s.fecha_entrada;
    });
    pagosCC.forEach(p => {
      const c = cuentaPorCliente[p.cliente_id];
      if (!c) return;
      c.haber += Number(p.monto) || 0;
      if (p.fecha && (!c.ultimaFecha || p.fecha > c.ultimaFecha)) c.ultimaFecha = p.fecha;
    });
    const cuentas = Object.values(cuentaPorCliente).map(c => ({ ...c, saldo: c.debe - c.haber }));

    const saldosNegativos = cuentas.filter(c => c.saldo < 0);
    itemsCC.push({
      ok: saldosNegativos.length === 0,
      texto: saldosNegativos.length === 0
        ? 'Ningún cliente de cuenta corriente con saldo negativo.'
        : `${saldosNegativos.length} cliente(s) con saldo negativo (pagaron de más): ${saldosNegativos.map(c => c.nombre + ' ($' + c.saldo.toLocaleString('es-AR') + ')').join(', ')}`
    });

    const pagoSinDeuda = cuentas.filter(c => c.haber > 0 && c.debe === 0);
    itemsCC.push({
      ok: pagoSinDeuda.length === 0,
      texto: pagoSinDeuda.length === 0
        ? 'Todos los pagos de cuenta corriente corresponden a compras registradas.'
        : `${pagoSinDeuda.length} cliente(s) con pagos cargados pero sin ninguna compra registrada — revisá si el pago quedó bien asignado: ${pagoSinDeuda.map(c => c.nombre).join(', ')}`
    });

    const sesentaDiasAtras = new Date();
    sesentaDiasAtras.setDate(sesentaDiasAtras.getDate() - 60);
    const isoSesenta = sesentaDiasAtras.toISOString().slice(0, 10);
    const trabadas = cuentas.filter(c => c.saldo > 0 && c.ultimaFecha && c.ultimaFecha < isoSesenta);
    itemsCC.push({
      ok: trabadas.length === 0,
      texto: trabadas.length === 0
        ? 'No hay deudas de cuenta corriente trabadas (sin movimiento hace más de 60 días).'
        : `${trabadas.length} cuenta(s) con saldo pendiente y sin movimiento hace más de 60 días: ${trabadas.map(c => c.nombre + ' ($' + c.saldo.toLocaleString('es-AR') + ')').join(', ')}`
    });
  }

  const items = modo === 'cc' ? itemsCC : itemsHoy;
  const okCount = items.filter(i => i.ok).length;
  const resumen = okCount === items.length
    ? `<div class="msg msg-ok" style="font-weight:700;">✅ Todo en orden, no hay nada para revisar.</div>`
    : `<div class="msg msg-error" style="font-weight:700;">⚠️ Hay ${items.length - okCount} punto(s) para revisar.</div>`;

  let totalesHtml = '';
  if (modo === 'hoy') {
    const { data: movsHoy } = await sb.from('movimientos_caja').select('ingresa_egresa, monto').eq('fecha', fecha);
    const totalIngresa = (movsHoy || []).filter(m => m.ingresa_egresa === 'INGRESA').reduce((a, m) => a + Number(m.monto || 0), 0);
    const totalEgresa = (movsHoy || []).filter(m => m.ingresa_egresa === 'EGRESA').reduce((a, m) => a + Number(m.monto || 0), 0);
    totalesHtml = `
      <div class="lista-sobre" style="background:#f7f7f7; margin-top:10px;">
        <div>Entró hoy: <strong>$${totalIngresa.toLocaleString('es-AR')}</strong></div>
        <div>Salió hoy: <strong>$${totalEgresa.toLocaleString('es-AR')}</strong></div>
      </div>
    `;
  }

  box.innerHTML = `
    ${resumen}
    ${totalesHtml}
    <div style="margin-top:16px;">
      ${items.map(i => `
        <div class="lista-sobre" style="border-left: 4px solid ${i.ok ? '#3a7d44' : '#c0392b'};">
          <div>${i.ok ? '✅' : '⚠️'} ${i.texto}</div>
        </div>
      `).join('')}
    </div>
  `;
}
window.cargarChequeoDelDia = cargarChequeoDelDia;

async function cargarCajaDelDia() {
  const fecha = document.getElementById('cd-fecha').value;
  const resBox = document.getElementById('cd-resultado');
  resBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const { data: movimientos, error } = await sb
    .from('movimientos_caja')
    .select('id, vendedora, descripcion, ingresa_egresa, medio_pago, monto, cantidad, codigo, tipo_cliente, created_at, clientes(nombre), sobres(numero, descripcion, foto_referencia)')
    .eq('fecha', fecha)
    .order('created_at');

  if (error) {
    resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`;
    return;
  }

  if (!movimientos || movimientos.length === 0) {
    resBox.innerHTML = `<div class="vacio">Sin movimientos registrados ese día</div>`;
    return;
  }

  let totalIngresa = 0, totalEgresa = 0, totalRetiros = 0, apertura = 0;
  const porMedioIngresa = {};
  const porMedioEgresa = {};
  movimientos.forEach(m => {
    const monto = Number(m.monto) || 0;
    const medio = m.medio_pago || '(sin medio)';
    if (Number(m.codigo) === 100) {
      apertura += monto;
      return; // la apertura no cuenta como "venta del día", solo suma al efectivo en caja
    }
    if (m.ingresa_egresa === 'INGRESA') {
      totalIngresa += monto;
      porMedioIngresa[medio] = (porMedioIngresa[medio] || 0) + monto;
    } else {
      totalEgresa += monto;
      porMedioEgresa[medio] = (porMedioEgresa[medio] || 0) + monto;
      if (Number(m.codigo) === 550) totalRetiros += monto;
    }
  });

  const efectivoNetoHoy = apertura + (porMedioIngresa['EFECTIVO'] || 0) - (porMedioEgresa['EFECTIVO'] || 0);

  const todosLosMedios = [...new Set([...Object.keys(porMedioIngresa), ...Object.keys(porMedioEgresa)])];
  const filasMedios = todosLosMedios.length === 0
    ? ''
    : todosLosMedios.map(medio => {
        const neto = (porMedioIngresa[medio] || 0) - (porMedioEgresa[medio] || 0);
        return `
        <div style="display:flex; justify-content:space-between; padding:4px 0;">
          <span>${medio}</span><strong>$${neto.toLocaleString('es-AR')}</strong>
        </div>
      `;
      }).join('');

  window._movimientosCajaActual = movimientos;
  const { lista: filasMovimientos, tabla: tablaCaja } = renderFilasMovimientosCD(movimientos);

  window._efectivoNetoHoyActual = efectivoNetoHoy;
  window._fechaCajaActual = fecha;

  resBox.innerHTML = `
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
      <div class="lista-sobre" style="text-align:center; padding:12px;">
        <div style="font-size:11px; color:#8a8378; margin-bottom:4px;">Total de ingresos hoy</div>
        <div style="font-size:19px; font-weight:700; color:#2f6d1f;">$${totalIngresa.toLocaleString('es-AR')}</div>
      </div>
      <div class="lista-sobre" style="text-align:center; padding:12px;">
        <div style="font-size:11px; color:#8a8378; margin-bottom:4px;">Total de egresos hoy</div>
        <div style="font-size:19px; font-weight:700; color:#9a3a1e;">$${totalEgresa.toLocaleString('es-AR')}</div>
      </div>
      <div class="lista-sobre" style="text-align:center; padding:12px;">
        <div style="font-size:11px; color:#8a8378; margin-bottom:4px;">Retiros de efectivo hoy</div>
        <div style="font-size:19px; font-weight:700; color:#9a3a1e;">$${totalRetiros.toLocaleString('es-AR')}</div>
      </div>
      <div style="background:#1a1a1a; border-radius:14px; padding:12px; text-align:center;">
        <div style="font-size:11px; color:#d4af6a; margin-bottom:4px;">Efectivo en caja hoy</div>
        <div style="font-size:19px; font-weight:700; color:#d4af6a;">$${efectivoNetoHoy.toLocaleString('es-AR')}</div>
      </div>
    </div>

    <div style="text-align:right; font-size:13px; color:#8a8378; margin-top:8px;">
      ${apertura > 0 ? `Apertura del día: <strong>$${apertura.toLocaleString('es-AR')}</strong> · ` : ''}Neto del día: <strong style="color:#2c2c2a;">$${(totalIngresa - totalEgresa).toLocaleString('es-AR')}</strong>
    </div>

    <label style="margin-top:16px;">Por medio de pago (ya descontando gastos/retiros de ese medio)</label>
    <div class="lista-sobre">${filasMedios}</div>

    <label style="margin-top:16px;">🔎 Buscar por nombre de cliente</label>
    <input type="text" id="cd-buscar" placeholder="Escribí el nombre..." oninput="filtrarCajaDelDia()">

    <label id="cd-contador" style="margin-top:16px;">Movimientos (${movimientos.length})</label>
    <div class="lista-movil-caja" id="cd-lista-movimientos">${filasMovimientos}</div>
    <div id="cd-tabla-movimientos">${tablaCaja}</div>

    <div style="text-align:center; margin-top:20px;">
      <a href="#" onclick="document.getElementById('cd-contar-box').style.display='block'; this.style.display='none'; return false;" style="font-size:13px; color:#8a8378;">
        🔍 ¿Cambio de turno o fin del día? Contar la caja física
      </a>
    </div>

    <div id="cd-contar-box" class="lista-sobre" style="display:none; margin-top:10px;">
      <div style="font-weight:700; margin-bottom:8px;">🔍 Contar caja física</div>
      <label>¿Cuánto efectivo hay realmente en el cajón?</label>
      <input type="number" id="cd-contado" placeholder="0" oninput="if(this.value) document.getElementById('cd-billetes-box').style.display='none';">

      <div style="text-align:right; margin-top:4px;">
        <a href="#" onclick="document.getElementById('cd-billetes-box').style.display='block'; return false;" style="font-size:13px; color:#3b6d11;">🧮 Contar billete por billete</a>
      </div>

      <div id="cd-billetes-box" style="display:none; margin-top:10px; padding:10px; background:#fafafa; border-radius:8px;">
        ${[20000, 10000, 2000, 1000, 500, 200, 100, 50].map(valor => `
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
            <span style="width:70px; font-weight:600;">$${valor.toLocaleString('es-AR')}</span>
            <span>×</span>
            <input type="number" min="0" class="cd-billete-cantidad" data-valor="${valor}" placeholder="0" oninput="actualizarTotalBilletes()" style="flex:1; padding:8px;">
          </div>
        `).join('')}
        <div style="font-weight:700; margin-top:8px; text-align:right;">Total: $<span id="cd-total-billetes">0</span></div>
        <button class="btn btn-outline" style="margin-top:8px;" onclick="usarTotalBilletes()">Usar este total</button>
      </div>

      <button class="btn btn-outline" style="margin-top:10px;" onclick="compararCaja()">Comparar</button>
      <div id="cd-diferencia-msg"></div>
    </div>
  `;
}
window.cargarCajaDelDia = cargarCajaDelDia;

async function compararCaja() {
  const msgBox = document.getElementById('cd-diferencia-msg');
  const contado = parseFloat(document.getElementById('cd-contado').value);
  if (isNaN(contado)) { msgBox.innerHTML = `<div class="msg msg-error">Poné cuánto contaste.</div>`; return; }

  const esperado = window._efectivoNetoHoyActual || 0;
  const diferencia = contado - esperado;

  if (diferencia === 0) {
    msgBox.innerHTML = `<div class="msg msg-ok">✅ Coincide perfecto, no hay diferencia.</div>`;
    return;
  }

  const tipo = diferencia > 0 ? 'sobra' : 'falta';
  msgBox.innerHTML = `
    <div class="msg msg-error">
      ⚠️ ${tipo === 'sobra' ? 'Sobran' : 'Faltan'} $${Math.abs(diferencia).toLocaleString('es-AR')}
      <div style="margin-top:8px;">
        <button class="btn btn-outline" onclick="registrarDiferenciaCaja(${diferencia})">Registrar esta diferencia</button>
      </div>
    </div>
  `;
}
window.compararCaja = compararCaja;

function actualizarTotalBilletes() {
  const inputs = document.querySelectorAll('.cd-billete-cantidad');
  let total = 0;
  inputs.forEach(inp => {
    const cantidad = parseInt(inp.value) || 0;
    const valor = parseInt(inp.dataset.valor);
    total += cantidad * valor;
  });
  document.getElementById('cd-total-billetes').textContent = total.toLocaleString('es-AR');
}
window.actualizarTotalBilletes = actualizarTotalBilletes;

function usarTotalBilletes() {

}

async function registrarDiferenciaCaja(diferencia) {
  const msgBox = document.getElementById('cd-diferencia-msg');
  const esFaltante = diferencia < 0;

  const { error } = await sb.from('movimientos_caja').insert({
    vendedora: usuarioActual.nombre,
    codigo: 500,
    descripcion: 'Diferencia de caja detectada (' + (esFaltante ? 'faltante' : 'sobrante') + ')',
    ingresa_egresa: esFaltante ? 'EGRESA' : 'INGRESA',
    medio_pago: 'EFECTIVO',
    monto: Math.abs(diferencia),
    fecha: window._fechaCajaActual
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Diferencia registrada.</div>`;
  cargarCajaDelDia();
}
window.registrarDiferenciaCaja = registrarDiferenciaCaja;

async function buscarSobreParaPagoParcial() {
  const numero = document.getElementById('pp-numero').value.trim();
  const resBox = document.getElementById('pp-resultado');
  if (!numero) { resBox.innerHTML = ''; return; }
  resBox.innerHTML = `<div class="msg">Buscando...</div>`;

  const { data: s, error } = await sb
    .from('sobres')
    .select('id, numero, descripcion, precio_total, fecha_salida, clientes(nombre)')
    .eq('numero', normalizarSobre(numero))
    .maybeSingle();

  if (error) { resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  if (!s) { resBox.innerHTML = `<div class="vacio">No se encontró ningún sobre con ese número.</div>`; return; }
  if (s.fecha_salida) { resBox.innerHTML = `<div class="msg msg-error">Ese sobre ya fue retirado. Un pago sobre un sobre ya entregado se maneja por Cuenta Corriente, no acá.</div>`; return; }

  const { data: pagos } = await sb
    .from('movimientos_caja')
    .select('monto')
    .eq('sobre_id', s.id)
    .eq('ingresa_egresa', 'INGRESA')
    .neq('medio_pago', 'CUENTA CORRIENTE');

  const pagado = (pagos || []).reduce((acc, p) => acc + Number(p.monto), 0);
  const precioTotal = Number(s.precio_total) || 0;
  const saldo = precioTotal > 0 ? Math.max(0, precioTotal - pagado) : null;

  resBox.innerHTML = `
    <div style="margin-top:16px;">
      <div class="nro" style="font-size:18px;">#${s.numero} — ${s.clientes ? s.clientes.nombre : ''}</div>
      <div class="desc">${s.descripcion || ''}</div>
      <div style="font-weight:700; margin:8px 0;">
        ${precioTotal > 0 ? 'Precio total: $' + precioTotal.toLocaleString('es-AR') + ' · Pagado: $' + pagado.toLocaleString('es-AR') + ' · Saldo: $' + saldo.toLocaleString('es-AR') : 'Este sobre todavía no tiene precio cargado'}
      </div>

      <label>Monto que paga ahora</label>
      <input type="number" id="pp-monto">
      <label>Medio de pago</label>
      <select id="pp-medio">
        <option>EFECTIVO</option>
        <option>TARJETA FISER</option>
        <option>TRANSFERENCIA SANTANDER</option>
        <option>MERCADO PAGO FISER</option>
        <option>MERCADO PAGO LAUREANO</option>
        <option>UALA CARLA</option>
      </select>
      <button class="btn btn-verde" onclick='confirmarPagoParcial(${JSON.stringify(s.id)}, ${JSON.stringify(s.numero)}, ${saldo})'>Registrar pago</button>
      <div id="pp-msg"></div>
    </div>
  `;
}
window.buscarSobreParaPagoParcial = buscarSobreParaPagoParcial;

async function confirmarPagoParcial(sobreId, numero, saldoActual) {
  const msgBox = document.getElementById('pp-msg');
  const monto = parseFloat(document.getElementById('pp-monto').value) || 0;
  const medioPago = document.getElementById('pp-medio').value;

  if (monto <= 0) { msgBox.innerHTML = `<div class="msg msg-error">Poné un monto mayor a cero.</div>`; return; }
  if (saldoActual !== null && monto > saldoActual) {
    msgBox.innerHTML = `<div class="msg msg-error">Ese monto es mayor al saldo pendiente ($${saldoActual.toLocaleString('es-AR')}). Si paga todo, usá Retiro.</div>`;
    return;
  }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { data: sobreData } = await sb.from('sobres').select('cliente_id, tipo_cliente').eq('id', sobreId).single();

  const { error } = await sb.from('movimientos_caja').insert({
    vendedora: usuarioActual.nombre,
    descripcion: 'pago parcial sobre ' + numero,
    ingresa_egresa: 'INGRESA',
    tipo_cliente: sobreData ? sobreData.tipo_cliente : null,
    medio_pago: medioPago,
    monto: monto,
    cliente_id: sobreData ? sobreData.cliente_id : null,
    sobre_id: sobreId
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  const nuevoSaldo = saldoActual !== null ? Math.max(0, saldoActual - monto) : null;

  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'PAGO PARCIAL',
    detalle: 'Pagó $' + monto + ' (' + medioPago + ') — cargado por ' + usuarioActual.nombre + (nuevoSaldo !== null ? '. Saldo restante: $' + nuevoSaldo : '')
  });

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Pago de $${monto.toLocaleString('es-AR')} registrado.${nuevoSaldo !== null ? ' Saldo restante: $' + nuevoSaldo.toLocaleString('es-AR') : ''}</div>`;
}
window.confirmarPagoParcial = confirmarPagoParcial;

async function guardarGastoFijo() {
  const msgBox = document.getElementById('gf-nuevo-msg');
  const nombre = document.getElementById('gf-nombre').value.trim();
  const monto = parseFloat(document.getElementById('gf-monto').value) || null;

function rangoDelMes(mesISO) {
  const [anio, mes] = mesISO.split('-').map(Number);
  const desde = anio + '-' + String(mes).padStart(2, '0') + '-01';
  const siguiente = mes === 12 ? (anio + 1) + '-01-01' : anio + '-' + String(mes + 1).padStart(2, '0') + '-01';
  return { desde, hasta: siguiente };
}

async function cargarReportes() {
  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const resBox = document.getElementById('rp-resumen');
  resBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: movimientos, error } = await sb
    .from('movimientos_caja')
    .select('ingresa_egresa, medio_pago, monto')
    .gte('fecha', desde)
    .lt('fecha', hasta);

  if (error) { resBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  const { data: sobresDelMes } = await sb
    .from('sobres')
    .select('id, canal, precio_total')
    .gte('fecha_entrada', desde)
    .lt('fecha_entrada', hasta);

  let ingresos = 0, egresos = 0, facturable = 0, noFacturable = 0;
  (movimientos || []).forEach(m => {
    const monto = Number(m.monto) || 0;
    if (m.ingresa_egresa === 'INGRESA') {
      ingresos += monto;
      if (MEDIOS_FACTURABLES.includes(m.medio_pago)) facturable += monto; else noFacturable += monto;
    } else {
      egresos += monto;
    }
  });

  const porCanal = { LOCAL: { cantidad: 0, total: 0 }, REDES_ENVIO: { cantidad: 0, total: 0 }, REDES_RETIRO: { cantidad: 0, total: 0 } };
  (sobresDelMes || []).forEach(s => {
    // 'REDES' es el valor viejo (antes de separar envío/retiro) — se cuenta como envío.
    let canal = s.canal;
    if (canal === 'REDES') canal = 'REDES_ENVIO';
    if (canal !== 'REDES_ENVIO' && canal !== 'REDES_RETIRO') canal = 'LOCAL';
    porCanal[canal].cantidad += 1;
    porCanal[canal].total += Number(s.precio_total) || 0;
  });

  resBox.innerHTML = `
    <div class="lista-sobre" style="background:#f7f7f7; margin-top:10px;">
      <div>Sobres nuevos este mes: <strong>${(sobresDelMes || []).length}</strong></div>
      <div>Ingresos: <strong style="color:#27500a;">$${ingresos.toLocaleString('es-AR')}</strong></div>
      <div>Egresos: <strong style="color:#993c1d;">$${egresos.toLocaleString('es-AR')}</strong></div>
      <div style="font-size:18px; font-weight:700; margin-top:6px;">Neto: $${(ingresos - egresos).toLocaleString('es-AR')}</div>
    </div>
    <div class="lista-sobre" style="margin-top:10px;">
      <div>💳 Facturable (Tarjeta, MP Fiser, Transferencia): <strong>$${facturable.toLocaleString('es-AR')}</strong></div>
      <div>💵 No facturable (Efectivo, Uala, MP Laureano, etc.): <strong>$${noFacturable.toLocaleString('es-AR')}</strong></div>
    </div>
    <div class="lista-sobre" style="margin-top:10px;">
      <div style="font-weight:700; margin-bottom:6px;">📍 Por canal</div>
      <div>🏪 Local: <strong>${porCanal.LOCAL.cantidad} sobres — $${porCanal.LOCAL.total.toLocaleString('es-AR')}</strong></div>
      <div>📦 Redes — envío: <strong>${porCanal.REDES_ENVIO.cantidad} sobres — $${porCanal.REDES_ENVIO.total.toLocaleString('es-AR')}</strong></div>
      <div>📱 Redes — retiro en local: <strong>${porCanal.REDES_RETIRO.cantidad} sobres — $${porCanal.REDES_RETIRO.total.toLocaleString('es-AR')}</strong></div>
    </div>
  `;
}
window.cargarReportes = cargarReportes;

async function cargarMejoresClientes() {
  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const clientesBox = document.getElementById('rp-clientes');
  clientesBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: sobresDelMes, error } = await sb
    .from('sobres')
    .select('precio_total, clientes(id, nombre)')
    .gte('fecha_entrada', desde)
    .lt('fecha_entrada', hasta);

  if (error) { clientesBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  const totalesPorCliente = {};
  (sobresDelMes || []).forEach(s => {
    if (!s.clientes) return;
    const nombre = s.clientes.nombre;
    totalesPorCliente[nombre] = (totalesPorCliente[nombre] || 0) + (Number(s.precio_total) || 0);
  });

  const ranking = Object.entries(totalesPorCliente)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10);

  if (ranking.length === 0) {
    clientesBox.innerHTML = `<div class="vacio">Sin sobres cargados ese mes todavía</div>`;
    return;
  }

  clientesBox.innerHTML = ranking.map(([nombre, total], i) => `
    <div class="lista-sobre">
      <div class="nro">${i + 1}. ${nombre} — $${total.toLocaleString('es-AR')}</div>
    </div>
  `).join('');
}
window.cargarMejoresClientes = cargarMejoresClientes;

async function cargarPorCategoria() {
  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const catBox = document.getElementById('rp-categorias');
  catBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: sobresDelMes, error } = await sb
    .from('sobres')
    .select('categoria_producto, precio_total')
    .gte('fecha_entrada', desde)
    .lt('fecha_entrada', hasta)
    .not('categoria_producto', 'is', null);

  if (error) { catBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  if (!sobresDelMes || sobresDelMes.length === 0) {
    catBox.innerHTML = `<div class="vacio">Sin ventas del catálogo cargadas este mes (esto solo cuenta lo cargado usando "Buscar en el catálogo" en Nueva Entrada)</div>`;
    return;
  }

  const porCategoria = {};
  sobresDelMes.forEach(s => {
    const cat = s.categoria_producto;
    if (!porCategoria[cat]) porCategoria[cat] = { cantidad: 0, total: 0 };
    porCategoria[cat].cantidad += 1;
    porCategoria[cat].total += Number(s.precio_total) || 0;
  });

  const ranking = Object.entries(porCategoria).sort((a, b) => b[1].cantidad - a[1].cantidad);

  catBox.innerHTML = ranking.map(([cat, datos]) => `
    <div class="lista-sobre">
      <div class="nro">${cat}: ${datos.cantidad} ${datos.cantidad === 1 ? 'unidad' : 'unidades'}</div>
      <div class="cli">$${datos.total.toLocaleString('es-AR')}</div>
    </div>
  `).join('');
}
window.cargarPorCategoria = cargarPorCategoria;

async function cargarPorTipoProducto() {
  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const box = document.getElementById('rp-tipo-producto');
  box.innerHTML = `<div class="msg">Cargando...</div>`;

  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: movs, error } = await sb
    .from('movimientos_caja')
    .select('codigo, cantidad, monto')
    .gte('fecha', desde)
    .lt('fecha', hasta)
    .not('codigo', 'is', null);

  if (error) { box.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  if (!movs || movs.length === 0) {
    box.innerHTML = `<div class="vacio">Sin ventas con tipo de producto cargado este mes</div>`;
    return;
  }

  const { data: codigos } = await sb.from('codigos_producto').select('codigo, descripcion');
  const nombreDeCodigo = {};
  (codigos || []).forEach(c => { nombreDeCodigo[c.codigo] = c.descripcion; });

  const porTipo = {};
  movs.forEach(m => {
    const cod = m.codigo;
    if (!porTipo[cod]) porTipo[cod] = { cantidad: 0, total: 0 };
    porTipo[cod].cantidad += Number(m.cantidad) || 1;
    porTipo[cod].total += Number(m.monto) || 0;
  });

  const ranking = Object.entries(porTipo).sort((a, b) => b[1].cantidad - a[1].cantidad);

  box.innerHTML = ranking.map(([cod, datos]) => `
    <div class="lista-sobre">
      <div class="nro">${nombreDeCodigo[cod] || ('Código ' + cod)}: ${datos.cantidad} ${datos.cantidad === 1 ? 'unidad' : 'unidades'}</div>
      <div class="cli">$${datos.total.toLocaleString('es-AR')}</div>
    </div>
  `).join('');
}
window.cargarPorTipoProducto = cargarPorTipoProducto;

async function cargarGastosFijos() {
  const listaBox = document.getElementById('gf-lista');
  listaBox.innerHTML = `<div class="msg">Cargando...</div>`;

  const mesISO = document.getElementById('rp-mes').value || mesActualISO();
  const { desde, hasta } = rangoDelMes(mesISO);

  const { data: gastos, error } = await sb.from('gastos_fijos').select('id, nombre, monto_estimado, dia_vencimiento').eq('activo', true).order('nombre');
  if (error) { listaBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

  if (!gastos || gastos.length === 0) {
    listaBox.innerHTML = `<div class="vacio">Todavía no cargaste ningún gasto fijo.</div>`;
    return;
  }

  const { data: pagosDelMes } = await sb
    .from('movimientos_caja')
    .select('gasto_fijo_id, monto')
    .not('gasto_fijo_id', 'is', null)
    .gte('fecha', desde)
    .lt('fecha', hasta);

  const pagadoPorGasto = {};
  (pagosDelMes || []).forEach(p => { pagadoPorGasto[p.gasto_fijo_id] = (pagadoPorGasto[p.gasto_fijo_id] || 0) + Number(p.monto); });

  listaBox.innerHTML = gastos.map(g => {
    const pagado = pagadoPorGasto[g.id];
    return `
      <div class="lista-sobre">
        <div class="nro">${g.nombre} ${g.monto_estimado ? '— aprox $' + Number(g.monto_estimado).toLocaleString('es-AR') : ''}</div>
        ${g.dia_vencimiento ? `<div class="cli">Vence el día ${g.dia_vencimiento}</div>` : ''}
        ${pagado
          ? `<div class="msg msg-ok" style="margin-top:6px;">✅ Pagado este mes: $${pagado.toLocaleString('es-AR')}</div>`
          : `
            <div style="display:flex; gap:8px; margin-top:8px;">
              <input type="number" id="gf-pago-${g.id}" placeholder="Monto pagado" style="flex:1;">
              <select id="gf-medio-${g.id}" style="flex:1;">
                <option>EFECTIVO</option>
                <option>TRANSFERENCIA SANTANDER</option>
                <option>MERCADO PAGO FISER</option>
                <option>MERCADO PAGO LAUREANO</option>
                <option>UALA CARLA</option>
              </select>
            </div>
            <button class="btn btn-verde" style="margin-top:8px;" onclick="marcarGastoFijoPagado('${g.id}', '${g.nombre.replace(/'/g, "\\'")}')">Marcar pagado</button>
          `
        }
        <div id="gf-msg-${g.id}"></div>
      </div>
    `;
  }).join('');
}
window.cargarGastosFijos = cargarGastosFijos;

async function marcarGastoFijoPagado(gastoId, nombre) {
  const msgBox = document.getElementById('gf-msg-' + gastoId);
  const monto = parseFloat(document.getElementById('gf-pago-' + gastoId).value) || 0;

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { error } = await sb.from('movimientos_caja').insert({
    vendedora: usuarioActual.nombre,
    descripcion: nombre,
    ingresa_egresa: 'EGRESA',
    medio_pago: medioPago,
    monto: monto,
    gasto_fijo_id: gastoId
  });

  if (error) { msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }

}
window.marcarGastoFijoPagado = marcarGastoFijoPagado;
