<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tándem — Sistema nuevo (prueba)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f1e8;
    margin: 0;
    padding: 16px;
    color: #2c2c2a;
  }
  .card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto 16px auto;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .sub { color: #888; font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px 0; }
  input, select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
  }
  .btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    margin-top: 18px;
    cursor: pointer;
  }
  .btn-verde { background: #3b6d11; color: white; }
  .btn-outline { background: white; border: 1px solid #3b6d11; color: #3b6d11; }
  .pin-grid { display: flex; gap: 8px; margin-top: 10px; }
  .pin-grid input { text-align: center; font-size: 22px; letter-spacing: 4px; }
  .msg { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 14px; }
  .msg-ok { background: #eaf3de; color: #27500a; }
  .msg-error { background: #fcebeb; color: #791f1f; }
  .usuario-actual {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff8ec; border: 1px solid #eecf9a; border-radius: 10px;
    padding: 10px 14px; max-width: 480px; margin: 0 auto 16px auto; font-size: 14px;
  }
  .usuario-actual button { border: none; background: none; color: #993c1d; font-weight: 600; cursor: pointer; }
  small { color: #888; }
  .nav {
    display: flex; gap: 8px; max-width: 480px; margin: 0 auto 16px auto;
  }
  .nav button {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc;
    background: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .lista-sobre {
    border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-bottom: 10px;
  }
  .lista-sobre .nro { font-weight: 700; font-size: 15px; }
  .lista-sobre .cli { color: #555; font-size: 14px; }
  .lista-sobre .desc { color: #888; font-size: 13px; margin-bottom: 8px; }
  .lista-sobre select, .lista-sobre input { margin-bottom: 8px; }
  .vacio { text-align: center; color: #999; padding: 20px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
// ============================================================
// CONEXIÓN a Supabase — proyecto "Catálogo Tándem", cajón tandem
// ============================================================
const SUPABASE_URL = 'https://vbkpczhbudktbkclqncy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wpv2kS2qMJFBhEOlGrWg3g_FWt8IFZn';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  db: { schema: 'tandem' }
});

let usuarioActual = null; // { id, nombre, rol }

const app = document.getElementById('app');

function render(html) {
  app.innerHTML = html;
}

function pintarUsuarioActual() {
  if (!usuarioActual) return '';
  return `
    <div class="usuario-actual">
      <span>👤 <strong>${usuarioActual.nombre}</strong> (${usuarioActual.rol})</span>
      <button onclick="cerrarSesion()">Cambiar</button>
    </div>
    <div class="nav">
      <button onclick="pantallaNuevaEntrada()">➕ Entrada</button>
      <button onclick="pantallaTaller()">🛠 Taller</button>
      <button onclick="pantallaListoLista()">✅ Listo</button>
      <button onclick="pantallaRetiro()">💰 Retiro</button>
    </div>`;
}

function cerrarSesion() {
  usuarioActual = null;
  pantallaLogin();
}
window.cerrarSesion = cerrarSesion;

// ============================================================
// PANTALLA 1: elegir usuario + PIN
// ============================================================
async function pantallaLogin() {
  render(`<div class="card"><p>Cargando usuarios...</p></div>`);
  const { data, error } = await sb
    .from('usuarios')
    .select('id, nombre, rol')
    .eq('activo', true)
    .order('nombre');

  if (error) {
    render(`<div class="card"><p class="msg msg-error">No se pudo conectar: ${error.message}</p></div>`);
    return;
  }

  const opciones = data.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('');
  render(`
    <div class="card">
      <h1>Joyería Tándem</h1>
      <div class="sub">Sistema nuevo — versión de prueba</div>
      <label>¿Quién sos?</label>
      <select id="sel-usuario">${opciones}</select>
      <label>Tu PIN (4 números)</label>
      <input type="tel" inputmode="numeric" maxlength="4" id="pin-input" placeholder="••••">
      <button class="btn btn-verde" onclick="intentarLogin()">Entrar</button>
      <div id="login-msg"></div>
      <small>Si es tu primera vez, escribí el PIN que quieras usar de ahora en más.</small>
    </div>
  `);
}

async function intentarLogin() {
  const usuarioId = document.getElementById('sel-usuario').value;
  const pin = document.getElementById('pin-input').value.trim();
  const msgBox = document.getElementById('login-msg');

  if (!/^\d{4}$/.test(pin)) {
    msgBox.innerHTML = `<div class="msg msg-error">El PIN tiene que ser de 4 números.</div>`;
    return;
  }

  const { data: usuario, error } = await sb
    .from('usuarios')
    .select('id, nombre, rol, pin')
    .eq('id', usuarioId)
    .single();

  if (error || !usuario) {
    msgBox.innerHTML = `<div class="msg msg-error">No se encontró el usuario.</div>`;
    return;
  }

  if (!usuario.pin) {
    // Primera vez: se guarda el PIN que acaba de escribir
    const { error: errUpdate } = await sb
      .from('usuarios')
      .update({ pin: pin })
      .eq('id', usuarioId);
    if (errUpdate) {
      msgBox.innerHTML = `<div class="msg msg-error">No se pudo guardar el PIN: ${errUpdate.message}</div>`;
      return;
    }
    usuario.pin = pin;
  }

  if (usuario.pin !== pin) {
    msgBox.innerHTML = `<div class="msg msg-error">PIN incorrecto.</div>`;
    return;
  }

  usuarioActual = { id: usuario.id, nombre: usuario.nombre, rol: usuario.rol };
  pantallaNuevaEntrada();
}
window.intentarLogin = intentarLogin;

// ============================================================
// PANTALLA 2: Nueva Entrada (cargar un sobre)
// ============================================================
function pantallaNuevaEntrada() {
  render(`
    ${pintarUsuarioActual()}
    <div class="card">
      <h1>Nueva entrada</h1>
      <div class="sub">Cargar un sobre nuevo</div>

      <label>N° de sobre</label>
      <input type="text" id="ne-sobre" placeholder="Ej: 4801">

      <label>Cliente</label>
      <input type="text" id="ne-cliente" placeholder="Nombre del cliente">

      <label>Tipo de cliente</label>
      <select id="ne-tipo-cliente">
        <option value="CONSUMIDOR_FINAL">Consumidor final</option>
        <option value="MAYORISTA">Mayorista</option>
        <option value="TALLER">Taller</option>
      </select>

      <label>Trabajo / descripción</label>
      <input type="text" id="ne-trabajo" placeholder="Ej: arreglo cadena">

      <label>Precio total (si ya lo sabés)</label>
      <input type="number" id="ne-total" placeholder="0">

      <label>Seña (si paga algo ahora)</label>
      <input type="number" id="ne-sena" placeholder="0">

      <label>Medio de pago de la seña</label>
      <select id="ne-medio-pago">
        <option>EFECTIVO</option>
        <option>TARJETA FISER</option>
        <option>TRANSFERENCIA SANTANDER</option>
        <option>MERCADO PAGO FISER</option>
        <option>MERCADO PAGO LAUREANO</option>
        <option>UALA CARLA</option>
        <option>LEMON LAUREANO</option>
        <option>CUENTA CORRIENTE</option>
      </select>

      <button class="btn btn-verde" onclick="guardarNuevaEntrada()">Guardar entrada</button>
      <div id="ne-msg"></div>
    </div>
  `);
}

async function guardarNuevaEntrada() {
  const msgBox = document.getElementById('ne-msg');
  const numeroSobre = document.getElementById('ne-sobre').value.trim();
  const nombreCliente = document.getElementById('ne-cliente').value.trim();
  const tipoCliente = document.getElementById('ne-tipo-cliente').value;
  const trabajo = document.getElementById('ne-trabajo').value.trim();
  const total = parseFloat(document.getElementById('ne-total').value) || null;
  const sena = parseFloat(document.getElementById('ne-sena').value) || 0;
  const medioPago = document.getElementById('ne-medio-pago').value;

  if (!numeroSobre) {
    msgBox.innerHTML = `<div class="msg msg-error">Falta el N° de sobre.</div>`;
    return;
  }
  if (!nombreCliente) {
    msgBox.innerHTML = `<div class="msg msg-error">Falta el nombre del cliente.</div>`;
    return;
  }

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  // 1) Buscar si el cliente ya existe (por nombre, sin importar mayúsc/minúsc)
  let clienteId;
  const { data: clienteExistente } = await sb
    .from('clientes')
    .select('id')
    .ilike('nombre', nombreCliente)
    .limit(1)
    .maybeSingle();

  if (clienteExistente) {
    clienteId = clienteExistente.id;
  } else {
    const { data: clienteNuevo, error: errCliente } = await sb
      .from('clientes')
      .insert({ nombre: nombreCliente, tipo_cliente: tipoCliente })
      .select('id')
      .single();
    if (errCliente) {
      msgBox.innerHTML = `<div class="msg msg-error">Error creando cliente: ${errCliente.message}</div>`;
      return;
    }
    clienteId = clienteNuevo.id;
  }

  // 2) Crear el sobre
  const { data: sobreNuevo, error: errSobre } = await sb
    .from('sobres')
    .insert({
      numero: numeroSobre,
      cliente_id: clienteId,
      descripcion: trabajo,
      precio_total: total,
      tipo_cliente: tipoCliente
    })
    .select('id')
    .single();

  if (errSobre) {
    const mensaje = errSobre.code === '23505'
      ? 'Ya existe un sobre con ese número.'
      : errSobre.message;
    msgBox.innerHTML = `<div class="msg msg-error">${mensaje}</div>`;
    return;
  }

  // 3) Si hay seña, registrar el movimiento de caja
  if (sena > 0) {
    await sb.from('movimientos_caja').insert({
      vendedora: usuarioActual.nombre,
      descripcion: 'seña sobre ' + numeroSobre,
      ingresa_egresa: 'INGRESA',
      tipo_cliente: tipoCliente,
      medio_pago: medioPago,
      monto: sena,
      cliente_id: clienteId,
      sobre_id: sobreNuevo.id
    });
  }

  // 4) Historial
  await sb.from('historial_sobres').insert({
    sobre_id: sobreNuevo.id,
    evento: 'ENTRADA',
    detalle: 'Ingresó al local (dio entrada: ' + usuarioActual.nombre + ')'
  });

  msgBox.innerHTML = `<div class="msg msg-ok">✅ Sobre ${numeroSobre} guardado correctamente.</div>`;
  document.getElementById('ne-sobre').value = '';
  document.getElementById('ne-cliente').value = '';
  document.getElementById('ne-trabajo').value = '';
  document.getElementById('ne-total').value = '';
  document.getElementById('ne-sena').value = '';
}
window.guardarNuevaEntrada = guardarNuevaEntrada;

// ============================================================
// PANTALLA 3: Taller — sobres que todavía no bajaron a un orfebre
// ============================================================
async function pantallaTaller() {
  render(`${pintarUsuarioActual()}<div class="card"><p>Cargando...</p></div>`);

  const { data, error } = await sb
    .from('sobres')
    .select('id, numero, descripcion, clientes(nombre)')
    .is('baja_taller', null)
    .is('fecha_salida', null)
    .order('created_at');

  if (error) {
    render(`${pintarUsuarioActual()}<div class="card"><p class="msg msg-error">${error.message}</p></div>`);
    return;
  }

  if (data.length === 0) {
    render(`${pintarUsuarioActual()}<div class="card"><h1>Taller</h1><div class="vacio">No hay sobres esperando bajar a taller 🎉</div></div>`);
    return;
  }

  const filas = data.map(s => `
    <div class="lista-sobre">
      <div class="nro">#${s.numero}</div>
      <div class="cli">${s.clientes ? s.clientes.nombre : '(sin cliente)'}</div>
      <div class="desc">${s.descripcion || ''}</div>
      <select id="orfebre-${s.id}">
        <option>Daniel</option>
        <option>Pachula</option>
        <option>GRABADO</option>
      </select>
      <button class="btn btn-verde" onclick="bajarATaller('${s.id}', '${s.numero}')">Bajar a taller</button>
      <div id="msg-${s.id}"></div>
    </div>
  `).join('');

  render(`
    ${pintarUsuarioActual()}
    <div class="card">
      <h1>Taller</h1>
      <div class="sub">Sobres pendientes de asignar a un orfebre</div>
      ${filas}
    </div>
  `);
}
window.pantallaTaller = pantallaTaller;

async function bajarATaller(sobreId, numero) {
  const orfebre = document.getElementById('orfebre-' + sobreId).value;
  const msgBox = document.getElementById('msg-' + sobreId);
  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { error } = await sb
    .from('sobres')
    .update({ baja_taller: new Date().toISOString(), orfebre: orfebre })
    .eq('id', sobreId);

  if (error) {
    msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`;
    return;
  }

  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'BAJA A TALLER',
    detalle: 'Asignado a ' + orfebre + ' (lo bajó: ' + usuarioActual.nombre + ')'
  });

  pantallaTaller();
}
window.bajarATaller = bajarATaller;

// ============================================================
// PANTALLA 4: Listo — sobres en taller, esperando control final
// ============================================================
async function pantallaListoLista() {
  render(`${pintarUsuarioActual()}<div class="card"><p>Cargando...</p></div>`);

  const { data, error } = await sb
    .from('sobres')
    .select('id, numero, descripcion, orfebre, precio_total, clientes(nombre)')
    .not('baja_taller', 'is', null)
    .is('listo', null)
    .is('fecha_salida', null)
    .order('baja_taller');

  if (error) {
    render(`${pintarUsuarioActual()}<div class="card"><p class="msg msg-error">${error.message}</p></div>`);
    return;
  }

  if (data.length === 0) {
    render(`${pintarUsuarioActual()}<div class="card"><h1>Listo</h1><div class="vacio">No hay sobres en el banco de trabajo ahora 🎉</div></div>`);
    return;
  }

  const filas = data.map(s => `
    <div class="lista-sobre">
      <div class="nro">#${s.numero}</div>
      <div class="cli">${s.clientes ? s.clientes.nombre : '(sin cliente)'} — orfebre: ${s.orfebre || '-'}</div>
      <div class="desc">${s.descripcion || ''}</div>
      ${!s.precio_total ? `<input type="number" id="precio-${s.id}" placeholder="Precio (si no estaba puesto)">` : ''}
      <label style="font-weight:400; display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="retorno-${s.id}" style="width:auto;"> Necesita volver a taller (no está terminado)
      </label>
      <button class="btn btn-verde" onclick="marcarListo('${s.id}', '${s.numero}')">Marcar listo</button>
      <div id="msg-${s.id}"></div>
    </div>
  `).join('');

  render(`
    ${pintarUsuarioActual()}
    <div class="card">
      <h1>Listo</h1>
      <div class="sub">Control final antes de avisarle al cliente</div>
      ${filas}
    </div>
  `);
}
window.pantallaListoLista = pantallaListoLista;

async function marcarListo(sobreId, numero) {
  const msgBox = document.getElementById('msg-' + sobreId);
  const retorno = document.getElementById('retorno-' + sobreId).checked;
  const precioInput = document.getElementById('precio-' + sobreId);
  const precio = precioInput ? parseFloat(precioInput.value) || null : null;

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  if (retorno) {
    // Vuelve con el mismo orfebre: no se marca listo, solo queda el registro
    await sb.from('historial_sobres').insert({
      sobre_id: sobreId,
      evento: 'RETORNO',
      detalle: 'Vuelve con el mismo orfebre (controlado por ' + usuarioActual.nombre + ')'
    });
    pantallaListoLista();
    return;
  }

  const cambios = { listo: new Date().toISOString(), controlado_por: usuarioActual.nombre };
  if (precio) cambios.precio_total = precio;

  const { error } = await sb.from('sobres').update(cambios).eq('id', sobreId);
  if (error) {
    msgBox.innerHTML = `<div class="msg msg-error">${error.message}</div>`;
    return;
  }

  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'LISTO PARA RETIRAR',
    detalle: 'Controlado por ' + usuarioActual.nombre
  });

  pantallaListoLista();
}
window.marcarListo = marcarListo;

// ============================================================
// PANTALLA 5: Retiro — sobres listos, esperando que el cliente pase a pagar y llevárselo
// ============================================================
async function pantallaRetiro() {
  render(`${pintarUsuarioActual()}<div class="card"><p>Cargando...</p></div>`);

  const { data: sobres, error } = await sb
    .from('sobres')
    .select('id, numero, descripcion, precio_total, tipo_cliente, clientes(nombre)')
    .not('listo', 'is', null)
    .is('fecha_salida', null)
    .order('listo');

  if (error) {
    render(`${pintarUsuarioActual()}<div class="card"><p class="msg msg-error">${error.message}</p></div>`);
    return;
  }

  if (sobres.length === 0) {
    render(`${pintarUsuarioActual()}<div class="card"><h1>Retiro</h1><div class="vacio">No hay sobres listos esperando retiro 🎉</div></div>`);
    return;
  }

  const ids = sobres.map(s => s.id);
  const { data: pagos } = await sb
    .from('movimientos_caja')
    .select('sobre_id, monto')
    .in('sobre_id', ids)
    .eq('ingresa_egresa', 'INGRESA');

  const pagadoPorSobre = {};
  (pagos || []).forEach(p => {
    pagadoPorSobre[p.sobre_id] = (pagadoPorSobre[p.sobre_id] || 0) + Number(p.monto);
  });

  const filas = sobres.map(s => {
    const total = Number(s.precio_total) || 0;
    const pagado = pagadoPorSobre[s.id] || 0;
    const saldo = Math.max(0, total - pagado);
    return `
      <div class="lista-sobre" id="fila-${s.id}">
        <div class="nro">#${s.numero}</div>
        <div class="cli">${s.clientes ? s.clientes.nombre : '(sin cliente)'}</div>
        <div class="desc">${s.descripcion || ''}</div>
        <div style="font-weight:700; margin-bottom:8px;">Saldo: $${saldo.toLocaleString('es-AR')}</div>
        <select id="medio-${s.id}">
          <option>EFECTIVO</option>
          <option>TARJETA FISER</option>
          <option>TRANSFERENCIA SANTANDER</option>
          <option>MERCADO PAGO FISER</option>
          <option>MERCADO PAGO LAUREANO</option>
          <option>UALA CARLA</option>
          <option>LEMON LAUREANO</option>
          <option>CUENTA CORRIENTE</option>
        </select>
        <button class="btn btn-verde" onclick="confirmarRetiro('${s.id}', '${s.numero}', ${saldo}, '${s.tipo_cliente || 'CONSUMIDOR_FINAL'}')">Confirmar cobro y entregar</button>
        <div id="msg-${s.id}"></div>
      </div>
    `;
  }).join('');

  render(`
    ${pintarUsuarioActual()}
    <div class="card">
      <h1>Retiro</h1>
      <div class="sub">Sobres listos para entregar</div>
      ${filas}
    </div>
  `);
}
window.pantallaRetiro = pantallaRetiro;

async function confirmarRetiro(sobreId, numero, saldo, tipoCliente) {
  const msgBox = document.getElementById('msg-' + sobreId);
  const medioPago = document.getElementById('medio-' + sobreId).value;
  const esCuentaCorriente = medioPago === 'CUENTA CORRIENTE';
  const montoCobrado = esCuentaCorriente ? 0 : saldo;

  msgBox.innerHTML = `<div class="msg">Guardando...</div>`;

  const { data: sobreData, error: errFecha } = await sb
    .from('sobres')
    .update({ fecha_salida: new Date().toISOString() })
    .eq('id', sobreId)
    .select('cliente_id')
    .single();

  if (errFecha) {
    msgBox.innerHTML = `<div class="msg msg-error">${errFecha.message}</div>`;
    return;
  }

  if (montoCobrado > 0) {
    await sb.from('movimientos_caja').insert({
      vendedora: usuarioActual.nombre,
      descripcion: 'cobro saldo sobre ' + numero,
      ingresa_egresa: 'INGRESA',
      tipo_cliente: tipoCliente,
      medio_pago: medioPago,
      monto: montoCobrado,
      cliente_id: sobreData.cliente_id,
      sobre_id: sobreId
    });
  }

  const detalle = esCuentaCorriente
    ? 'Se lo llevó, queda en cuenta corriente'
    : (montoCobrado > 0 ? 'Retirado y cobrado $' + montoCobrado : 'Retirado, sin saldo pendiente');

  await sb.from('historial_sobres').insert({
    sobre_id: sobreId,
    evento: 'RETIRADO',
    detalle: detalle + ' (entregó: ' + usuarioActual.nombre + ')'
  });

  pantallaRetiro();
}
window.confirmarRetiro = confirmarRetiro;

// Arranque
pantallaLogin();
</script>
</body>
</html>
