<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos</title>
<meta name="apple-mobile-web-app-title" content="Fotos">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="foto-icon-192.png">
<link rel="apple-touch-icon" href="foto-icon-192.png">
<link rel="manifest" href="manifest-foto.json">
<meta name="theme-color" content="#1a1a1a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4efe4;
    margin: 0;
    padding: 16px;
    color: #2c2c2a;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    max-width: 480px;
    margin: 30px auto 16px auto;
    box-shadow: 0 2px 10px rgba(60,40,10,0.08);
  }
  h1 { font-size: 22px; margin: 0 0 4px 0; text-align: center; letter-spacing: -0.2px; }
  .sub { color: #8a8378; font-size: 14px; margin-bottom: 18px; text-align: center; }
  input {
    width: 100%;
    padding: 18px;
    font-size: 28px;
    text-align: center;
    border: 1.5px solid #e6ddc9;
    border-radius: 12px;
    background: #fdfcf9;
  }
  input:focus { outline: none; border-color: #c9a24a; }
  .nro { font-weight: 700; font-size: 20px; text-align: center; }
  .cliente { text-align: center; font-size: 16px; color: #7a5c00; margin-top: 2px; font-weight: 600; }
  .desc { text-align: center; margin-top: 14px; font-size: 32px; font-weight: 600; line-height: 1.3; }
  .fecha { text-align: center; margin-top: 8px; font-size: 16px; font-weight: 700; color: #7a5c00; }
  .vacio { color: #8a8378; text-align: center; margin-top: 10px; }
  .msg { text-align: center; margin-top: 10px; color: #8a8378; }
  img { width: 100%; max-height: 62vh; object-fit: contain; border-radius: 10px; border: 1px solid #e6ddc9; margin-top: 12px; }
  .btn { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; border: none; border-radius: 12px; background: #c9a24a; color: white; margin-top: 10px; cursor: pointer; }
  .btn:active { opacity: .8; }
  .rt-aviso { text-align: center; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>

<div class="card">
  <h1>📷 Fotos</h1>
  <div class="sub">Joyería Tándem — escribí el número de sobre</div>
  <input type="tel" inputmode="numeric" id="numero" placeholder="Ej: 4801" autofocus>
  <div id="resultado" style="margin-top:18px;"></div>
</div>

<div class="card">
  <h1>🔄 Volvieron del taller</h1>
  <div class="sub">Terminados, para dejar en el canasto — escribí los N° de sobre, separados por espacio</div>
  <input type="text" id="rtSobres" placeholder="Ej: 4801 4802 4803" style="font-size:18px; padding:14px; text-align:left;">
  <button class="btn" id="rtBoton">Regreso al local</button>
  <div id="rtResultado" class="rt-aviso"></div>
</div>

<script>
const SUPABASE_URL = 'https://vbkpczhbudktbkclqncy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wpv2kS2qMJFBhEOlGrWg3g_FWt8IFZn';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  db: { schema: 'tandem' }
});

// Convierte una fecha-only ISO ("2026-09-11") a DD/MM/AAAA sin pasar por
// new Date(), que interpreta ese string como UTC y en Argentina puede
// mostrar el día anterior.
function fechaCortaAR(fechaISO) {
  if (!fechaISO) return '';
  const partes = String(fechaISO).slice(0, 10).split('-');
  if (partes.length !== 3) return fechaISO;
  return partes[2] + '/' + partes[1] + '/' + partes[0];
}

// Normaliza el número de sobre igual que el sistema principal: saca
// símbolos (#, N°, espacios) y ceros a la izquierda.
function normalizarSobre(valor) {
  if (!valor) return '';
  let limpio = String(valor).replace(/[^0-9]/g, '');
  limpio = limpio.replace(/^0+/, '');
  return limpio || '0';
}

let _timeout = null;
const input = document.getElementById('numero');
const box = document.getElementById('resultado');

input.addEventListener('input', () => {
  clearTimeout(_timeout);
  const numero = input.value.trim();
  if (!numero) { box.innerHTML = ''; return; }

  _timeout = setTimeout(async () => {
    box.innerHTML = `<div class="msg">Buscando...</div>`;
    const numeroNormalizado = normalizarSobre(numero);

    const { data: s, error } = await sb
      .from('sobres')
      .select('id, numero, descripcion, foto_referencia, para_el_dia, clientes(nombre)')
      .eq('numero', numeroNormalizado)
      .maybeSingle();

    if (error) { box.innerHTML = `<div class="msg">${error.message}</div>`; return; }
    if (!s) { box.innerHTML = `<div class="vacio">No se encontró ese sobre.</div>`; return; }

    const fechaHtml = s.para_el_dia
      ? `<div class="fecha">📅 Entregar el ${fechaCortaAR(s.para_el_dia)}</div>`
      : '';
    const clienteHtml = s.clientes && s.clientes.nombre
      ? `<div class="cliente">${s.clientes.nombre}</div>`
      : '';

    // Además de foto_referencia (la primera, vieja), se buscan TODAS las fotos
    // guardadas en tandem.fotos_sobre para este sobre (ej: mesa + laterales de un sello).
    const { data: fotosExtra } = await sb
      .from('fotos_sobre')
      .select('url, etiqueta')
      .eq('sobre_id', s.id)
      .order('created_at');

    const urlsExtra = (fotosExtra || []).map(f => f.url);
    const todasLasFotos = s.foto_referencia && !urlsExtra.includes(s.foto_referencia)
      ? [{ url: s.foto_referencia, etiqueta: null }, ...(fotosExtra || [])]
      : (fotosExtra || []);

    if (todasLasFotos.length === 0) {
      box.innerHTML = `
        <div class="nro">#${s.numero}</div>
        ${clienteHtml}
        <div class="vacio">Este sobre no tiene foto cargada.</div>
        <div class="desc">${s.descripcion || ''}</div>
        ${fechaHtml}
      `;
      return;
    }

    box.innerHTML = `
      <div class="nro">#${s.numero}</div>
      ${clienteHtml}
      ${todasLasFotos.map(f => `
        ${f.etiqueta ? `<div style="text-align:center; margin-top:10px; font-size:15px; font-weight:700; color:#7a5c00;">🏷️ ${f.etiqueta}</div>` : ''}
        <img src="${f.url}" onclick="window.open('${f.url}','_blank')" style="cursor:pointer;">
      `).join('')}
      <div class="desc">${s.descripcion || ''}</div>
      ${fechaHtml}
    `;
  }, 250);
});

document.getElementById('rtBoton').addEventListener('click', async () => {
  const campo = document.getElementById('rtSobres');
  const resBox = document.getElementById('rtResultado');
  const numeros = [...new Set(campo.value.trim().split(/[\s,]+/).filter(n => n))];

  if (numeros.length === 0) { resBox.innerHTML = 'Escribí al menos un N° de sobre.'; return; }

  resBox.innerHTML = '⏳ Guardando...';
  const ok = [], yaEstaban = [], errores = [];

  for (const numero of numeros) {
    const { data: s, error: errBuscar } = await sb
      .from('sobres')
      .select('id, baja_taller, listo, fecha_salida, salida_taller_at, orfebre')
      .eq('numero', normalizarSobre(numero))
      .maybeSingle();

    if (errBuscar || !s) { errores.push(numero + ' (no existe)'); continue; }
    if (s.fecha_salida) { errores.push(numero + ' (ya retirado)'); continue; }
    if (!s.baja_taller) { errores.push(numero + ' (no había bajado a taller)'); continue; }
    if (s.listo) { yaEstaban.push(numero + ' (ya estaba Listo)'); continue; }
    if (s.salida_taller_at) { yaEstaban.push(numero); continue; }

    const { error } = await sb.from('sobres').update({ salida_taller_at: new Date().toISOString() }).eq('id', s.id);
    if (error) { errores.push(numero + ' (error al guardar)'); continue; }

    await sb.from('historial_sobres').insert({
      sobre_id: s.id,
      evento: 'REGRESO AL LOCAL',
      detalle: 'En el local, falta controlar (taller: ' + (s.orfebre || 'sin asignar') + ')'
    });
    ok.push(numero);
  }

  resBox.innerHTML = [
    ok.length ? '✅ Listo: ' + ok.join(', ') : '',
    yaEstaban.length ? 'ℹ️ Ya estaban así: ' + yaEstaban.join(', ') : '',
    errores.length ? '⚠️ No se pudo: ' + errores.join(', ') : ''
  ].filter(Boolean).join('<br>');
  campo.value = '';
});
</script>

</body>
</html>
